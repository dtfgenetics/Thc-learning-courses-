name: Verify Course 1 public raster release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "visuals/COURSE1-VISUAL-RELEASE-MANIFEST.json"
      - "scripts/verify-course1-public-raster-release.mjs"
      - ".github/workflows/course1-raster-public-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify 23 pinned Course 1 raster delivery URLs
        run: |
          set -o pipefail
          node scripts/verify-course1-public-raster-release.mjs | tee course1-raster-public-verification.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course1-raster-public-verification
          path: course1-raster-public-verification.json
          if-no-files-found: warn
