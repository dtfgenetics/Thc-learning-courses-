name: Foundations credential governance once

on:
  push:
    branches: [feat/foundations-credential-governance-v2]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Wire course-completion evidence into credential runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path('apps/api/src/server.mjs')
          text = server.read_text()
          old = """  const evidence = {\n    learnerId: rawEvidence.learnerId ?? null,\n    assessments: (rawEvidence.assessments ?? []).filter((row) => requiredAssessments.has(row.assessmentId)),\n    performanceAssessments: (rawEvidence.performanceAssessments ?? []).filter((row) => requiredPerformance.includes(row.assessmentId)),\n    portfolioArtifacts: (rawEvidence.portfolioArtifacts ?? []).filter((row) => requiredArtifacts.includes(row.artifactId))\n  };"""
          new = """  const evidence = {\n    learnerId: rawEvidence.learnerId ?? null,\n    courseCompletions: (rawEvidence.courseCompletions ?? []).filter((row) => row.courseId === credential.course),\n    assessments: (rawEvidence.assessments ?? []).filter((row) => requiredAssessments.has(row.assessmentId)),\n    performanceAssessments: (rawEvidence.performanceAssessments ?? []).filter((row) => requiredPerformance.includes(row.assessmentId)),\n    portfolioArtifacts: (rawEvidence.portfolioArtifacts ?? []).filter((row) => requiredArtifacts.includes(row.artifactId))\n  };"""
          if old not in text:
              raise SystemExit('server evidence block not found')
          text = text.replace(old, new, 1)
          old2 = """      id: credential.id,\n      title: credential.title,\n      version: credential.version,\n      role: credential.role ?? null,\n      course: credential.course,\n      minimumPassingScorePercent: credential.eligibility.minimumPassingScorePercent"""
          new2 = """      id: credential.id,\n      title: credential.title,\n      version: credential.version,\n      status: credential.status,\n      role: credential.role ?? null,\n      course: credential.course,\n      courseVersion: credential.courseVersion ?? null,\n      certificationUseStatus: credential.governance?.certificationUseStatus ?? null,\n      releaseApprovalStatus: credential.governance?.releaseApprovalStatus ?? null,\n      minimumPassingScorePercent: credential.eligibility.minimumPassingScorePercent"""
          if old2 not in text:
              raise SystemExit('server credential projection block not found')
          server.write_text(text.replace(old2, new2, 1))

          store = Path('apps/api/src/postgres-learner-store.mjs')
          text = store.read_text()
          old3 = "return { learnerId: externalSubject, assessmentAttempts: [], assessments: [], competencies: [], performanceAssessments: [], portfolioArtifacts: [] };"
          new3 = "return { learnerId: externalSubject, courseCompletions: [], assessmentAttempts: [], assessments: [], competencies: [], performanceAssessments: [], portfolioArtifacts: [] };"
          if old3 not in text:
              raise SystemExit('empty credential evidence projection not found')
          text = text.replace(old3, new3, 1)
          anchor = """      const assessments = [...bestByAssessment.values()].map((attempt) => ({\n        assessmentId: attempt.assessmentId,\n        status: attempt.passed ? 'passed' : 'failed',\n        scorePercent: attempt.scorePercent\n      }));\n\n      const competencyResult = await queryOrUnavailable("""
          replacement = """      const assessments = [...bestByAssessment.values()].map((attempt) => ({\n        assessmentId: attempt.assessmentId,\n        status: attempt.passed ? 'passed' : 'failed',\n        scorePercent: attempt.scorePercent\n      }));\n\n      const enrollmentResult = await queryOrUnavailable(\n        query,\n        `select course_id, course_version, status, enrolled_at, completed_at\n           from enrollments\n          where learner_id = $1\n          order by enrolled_at desc, course_id, course_version`,\n        [learnerId]\n      );\n      const courseCompletions = (enrollmentResult.rows ?? []).map(enrollmentRow);\n\n      const competencyResult = await queryOrUnavailable("""
          if anchor not in text:
              raise SystemExit('credential assessment anchor not found')
          text = text.replace(anchor, replacement, 1)
          old4 = "return { learnerId: externalSubject, assessmentAttempts, assessments, competencies, performanceAssessments, portfolioArtifacts };"
          new4 = "return { learnerId: externalSubject, courseCompletions, assessmentAttempts, assessments, competencies, performanceAssessments, portfolioArtifacts };"
          if old4 not in text:
              raise SystemExit('credential evidence return block not found')
          store.write_text(text.replace(old4, new4, 1))
          PY
      - name: Strengthen credential eligibility fixtures and tests
        run: |
          cat > tests/fixtures/eligibility-pass.json <<'JSON'
          {
            "learnerId": "TEST-LEARNER-PASS",
            "courseCompletions": [
              {
                "courseId": "COURSE-CULT-FOUNDATIONS-001",
                "courseVersion": "1.1.0",
                "status": "completed"
              }
            ],
            "assessments": [
              {
                "assessmentId": "ASSESS-CULT-FOUNDATIONS-FINAL-001",
                "status": "passed",
                "scorePercent": 86
              }
            ]
          }
          JSON
          cat > tests/fixtures/eligibility-fail.json <<'JSON'
          {
            "learnerId": "TEST-LEARNER-FAIL",
            "courseCompletions": [
              {
                "courseId": "COURSE-CULT-FOUNDATIONS-001",
                "courseVersion": "1.1.0",
                "status": "completed"
              }
            ],
            "assessments": [
              {
                "assessmentId": "ASSESS-CULT-FOUNDATIONS-FINAL-001",
                "status": "passed",
                "scorePercent": 72
              }
            ]
          }
          JSON
          cat > scripts/test-credential-eligibility.mjs <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { evaluateCredentialEligibility } from '../packages/domain/credential-eligibility.mjs';

          const credential = JSON.parse(fs.readFileSync('content/credentials/CRED-CULT-FOUNDATIONS-001.json', 'utf8'));
          const passEvidence = JSON.parse(fs.readFileSync('tests/fixtures/eligibility-pass.json', 'utf8'));
          const failEvidence = JSON.parse(fs.readFileSync('tests/fixtures/eligibility-fail.json', 'utf8'));

          function run(input) {
            return spawnSync(process.execPath, ['scripts/evaluate-credential-eligibility.mjs', `--input=${input}`], { encoding: 'utf8' });
          }

          const draftRun = run('tests/fixtures/eligibility-pass.json');
          assert.equal(draftRun.status, 2, 'validation-pending credential must fail closed even when learner requirements are satisfied');
          const draftResult = JSON.parse(draftRun.stdout);
          assert.equal(draftResult.requirementsSatisfied, true);
          assert.equal(draftResult.releaseAuthorized, false);
          assert.equal(draftResult.eligible, false);
          for (const reason of [
            'credential-definition-not-approved',
            'human-review-incomplete',
            'accessibility-review-incomplete',
            'pilot-incomplete',
            'standard-setting-incomplete',
            'release-approval-missing',
            'certification-use-not-authorized'
          ]) {
            assert.ok(draftResult.releaseBlockers.some((row) => row.reason === reason), `missing release blocker ${reason}`);
          }

          const authorizedCredential = structuredClone(credential);
          authorizedCredential.status = 'approved';
          authorizedCredential.governance = {
            certificationUseStatus: 'authorized',
            humanReviewStatus: 'complete',
            accessibilityReviewStatus: 'complete',
            pilotStatus: 'complete',
            standardSettingStatus: 'complete',
            releaseApprovalStatus: 'approved'
          };

          const passResult = evaluateCredentialEligibility({ credential: authorizedCredential, evidence: passEvidence });
          assert.equal(passResult.requirementsSatisfied, true);
          assert.equal(passResult.releaseAuthorized, true);
          assert.equal(passResult.eligible, true);

          const failResult = evaluateCredentialEligibility({ credential: authorizedCredential, evidence: failEvidence });
          assert.equal(failResult.eligible, false);
          assert.ok(failResult.missingRequirements.some((row) => row.reason === 'below-minimum-score'));

          const wrongVersion = structuredClone(passEvidence);
          wrongVersion.courseCompletions[0].courseVersion = '1.0.0';
          const wrongVersionResult = evaluateCredentialEligibility({ credential: authorizedCredential, evidence: wrongVersion });
          assert.equal(wrongVersionResult.eligible, false);
          assert.ok(wrongVersionResult.missingRequirements.some((row) => row.reason === 'course-version-mismatch'));

          const noCompletion = structuredClone(passEvidence);
          noCompletion.courseCompletions = [];
          const noCompletionResult = evaluateCredentialEligibility({ credential: authorizedCredential, evidence: noCompletion });
          assert.equal(noCompletionResult.eligible, false);
          assert.ok(noCompletionResult.missingRequirements.some((row) => row.reason === 'missing-course-completion'));

          const missingScore = structuredClone(passEvidence);
          delete missingScore.assessments[0].scorePercent;
          const missingScoreResult = evaluateCredentialEligibility({ credential: authorizedCredential, evidence: missingScore });
          assert.equal(missingScoreResult.eligible, false);
          assert.ok(missingScoreResult.missingRequirements.some((row) => row.reason === 'missing-score'));

          console.log('Credential eligibility tests passed: learner requirements, course-version evidence, and release governance all fail closed.');
          JS
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild generated curriculum registry
        run: npm run registry:build
      - name: Run focused credential eligibility test
        run: node scripts/test-credential-eligibility.mjs
      - name: Run complete deterministic suite
        run: npm test
      - name: Commit validated runtime and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/foundations-credential-governance-once.yml
          git add -A
          git commit -m "feat: enforce Foundations credential governance and course evidence"
          git push origin HEAD:feat/foundations-credential-governance-v2
