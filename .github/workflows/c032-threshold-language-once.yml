name: C032 threshold language correction once

on:
  push:
    branches:
      - fix/c032-provisional-threshold-language
    paths:
      - .github/workflows/c032-threshold-language-once.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/c032-provisional-threshold-language
          fetch-depth: 1
      - name: Correct provisional threshold language and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          package = Path('docs/academy-v2/course-packages/THC-C032-Ladder-Tool-Ergonomic-Safety.md')
          text = package.read_text()
          old_final = 'Passing target: 80%. The final is a content assessment and does not replace the applied practical.'
          new_final = ('Provisional development threshold: 80%. This value is an academic testing target only and has not been validated as a certification cut score. '
                       'It remains subject to human item review, pilot evidence, and formal standard setting. The final is a content assessment and does not replace the applied practical.')
          old_practical = '`PRACTICAL-THC-C032-SAFETY-WALKTHROUGH` is a 100-point integrated safety walkthrough with ladder, tool, and ergonomic stations. Passing requires at least 80% and zero critical errors.'
          new_practical = ('`PRACTICAL-THC-C032-SAFETY-WALKTHROUGH` is a 100-point integrated safety walkthrough with ladder, tool, and ergonomic stations. '
                           'Its current development standard is at least 80% and zero critical errors. That standard is provisional and is not authorized for certification use until assessor calibration, pilot evidence, accessibility review, and formal standard setting are complete.')
          assert text.count(old_final) == 1, 'expected one final-threshold sentence'
          assert text.count(old_practical) == 1, 'expected one practical-threshold sentence'
          text = text.replace(old_final, new_final).replace(old_practical, new_practical)
          package.write_text(text)

          practical = Path('docs/academy-v2/practicals/PRACTICAL-THC-C032-SAFETY-WALKTHROUGH.md')
          text = practical.read_text()
          old = '**Pass:** 80% and zero critical errors'
          new = ('**Provisional development standard:** 80% and zero critical errors  \n'
                 '**Certification status:** Not authorized for certification use; assessor calibration, pilot evidence, accessibility review, and formal standard setting remain required')
          assert text.count(old) == 1, 'expected one practical pass line'
          text = text.replace(old, new)
          practical.write_text(text)
          PY
          rm .github/workflows/c032-threshold-language-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/academy-v2/course-packages/THC-C032-Ladder-Tool-Ergonomic-Safety.md docs/academy-v2/practicals/PRACTICAL-THC-C032-SAFETY-WALKTHROUGH.md .github/workflows/c032-threshold-language-once.yml
          git diff --cached --exit-code && { echo "No threshold-language correction produced"; exit 1; } || true
          git commit -m "Clarify THC-C032 provisional assessment thresholds"
          git push origin HEAD:fix/c032-provisional-threshold-language
