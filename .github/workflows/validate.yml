name: Curriculum quality audit

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: curriculum-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Normalize Course 1 public academic publication
        run: npm run course1:publication:sync
      - name: Build expected curriculum registry
        run: npm run registry:build
      - name: Upload generated curriculum registry when available
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: generated-curriculum-registry
          path: registry/curriculum.json
          if-no-files-found: ignore
      - name: Verify generated publication and registry are committed
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated Course 1 publication or curriculum registry differs from the committed source. Run the canonical sync/build commands and commit the result."
            git --no-pager diff -- . ':(exclude)node_modules'
            exit 1
          fi
      - name: Audit Course 1 public academic publication
        run: npm run course1:publication:audit
      - name: Enforce Course 1 project alignment
        run: node scripts/check-course1-project-alignment.mjs
      - name: Enforce Course 1 visual concept coverage
        run: node scripts/check-course1-visual-concept-coverage.mjs
      - name: Audit Learning Hub assessment item quality
        run: node scripts/check-learning-hub-item-quality.mjs
      - name: Enforce Course 2 complete learning loop and balanced assessment
        run: node scripts/audit-learning-hub-objective-coverage.mjs --course=COURSE-LH-TECH1-002 --require-complete-learning-loop --require-balanced-assessment
      - name: Enforce Course 3 complete learning loop and balanced assessment
        run: node scripts/audit-learning-hub-objective-coverage.mjs --course=COURSE-LH-TECH1-003 --require-complete-learning-loop --require-balanced-assessment
      - name: Enforce Course 4 complete learning loop and balanced assessment
        run: node scripts/audit-learning-hub-objective-coverage.mjs --course=COURSE-LH-TECH1-004 --require-complete-learning-loop --require-balanced-assessment
      - name: Enforce Course 5 complete learning loop and balanced assessment
        run: node scripts/audit-learning-hub-objective-coverage.mjs --course=COURSE-LH-TECH1-005 --require-complete-learning-loop --require-balanced-assessment
      - name: Enforce Course 6 complete learning loop and balanced assessment
        run: node scripts/audit-learning-hub-objective-coverage.mjs --course=COURSE-LH-TECH1-006 --require-complete-learning-loop --require-balanced-assessment
      - name: Enforce all seven Technician I source-package contracts
        run: node scripts/report-tech1-course-package-readiness.mjs --require-source-package
      - name: Enforce Technician I credential machine-layer contract
        run: node scripts/test-tech1-machine-layer.mjs
      - name: Enforce public credential-bank security boundary
        run: node scripts/test-public-credential-bank-boundary.mjs
      - name: Enforce fail-closed Technician I release readiness
        run: node scripts/test-tech1-release-readiness.mjs
      - name: Run complete curriculum and credential audit suite
        run: npm test
