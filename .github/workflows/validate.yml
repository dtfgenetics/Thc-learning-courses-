name: Curriculum quality audit

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: write

concurrency:
  group: curriculum-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Normalize Course 1 public academic publication
        run: npm run course1:publication:sync
      - name: Build expected curriculum registry
        continue-on-error: true
        run: npm run registry:build
      - name: Upload generated curriculum registry when available
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: generated-curriculum-registry
          path: registry/curriculum.json
          if-no-files-found: ignore
      - name: Synchronize public Course 1 and generated registry on same-repo PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Sync public Course 1 publication and generated registry" || true
            git push origin HEAD:${{ github.head_ref }} || true
          fi
      - name: Audit Course 1 public academic publication
        run: npm run course1:publication:audit
      - name: Audit Learning Hub assessment item quality
        continue-on-error: true
        run: node scripts/check-learning-hub-item-quality.mjs
      - name: Run complete curriculum and credential audit suite
        continue-on-error: true
        run: npm test
