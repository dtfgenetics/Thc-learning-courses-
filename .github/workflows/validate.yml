name: Curriculum quality gates

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: curriculum-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Require committed dependency lock
        run: test -f package-lock.json
      - name: Install locked validation dependencies
        run: npm ci --no-audit --no-fund
      - name: Require dependency lock to remain unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Build expected curriculum registry
        run: npm run registry:build
      - name: Upload generated curriculum registry
        uses: actions/upload-artifact@v4
        with:
          name: generated-curriculum-registry
          path: registry/curriculum.json
          if-no-files-found: error
      - name: Require committed curriculum registry to match source objects
        run: |
          if ! git diff --exit-code -- registry/curriculum.json; then
            echo "registry/curriculum.json is out of sync with curriculum source objects."
            echo "Run 'npm run registry:build', commit the updated registry, and push again."
            exit 1
          fi
      - name: Run complete curriculum and credential test suite
        run: npm test
