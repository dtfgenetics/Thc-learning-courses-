name: Curriculum quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: curriculum-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build expected curriculum registry
        run: npm run registry:build
      - name: Require committed curriculum registry to match source objects
        run: git diff --exit-code -- registry/curriculum.json
      - name: Run complete curriculum and credential test suite
        run: npm test
