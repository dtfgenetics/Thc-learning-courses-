name: Curriculum quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: curriculum-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked validation dependencies
        run: npm ci --no-audit --no-fund
      - name: Require dependency lock to remain unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Build expected curriculum registry
        run: npm run registry:build
      - name: Upload generated curriculum registry
        uses: actions/upload-artifact@v4
        with:
          name: generated-curriculum-registry
          path: registry/curriculum.json
          if-no-files-found: error
      - name: Synchronize generated curriculum registry on same-repo PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- registry/curriculum.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add registry/curriculum.json
            git commit -m "Sync generated curriculum registry"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Require committed curriculum registry to match source objects
        run: git diff --exit-code -- registry/curriculum.json
      - name: Run complete curriculum and credential test suite
        run: npm test
