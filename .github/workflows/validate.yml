name: Curriculum quality gates

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: curriculum-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Require committed dependency lock
        run: test -f package-lock.json
      - name: Install locked validation dependencies
        run: npm ci --no-audit --no-fund
      - name: Require dependency lock to remain unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Enforce deterministic routine QA policy
        run: node scripts/check-routine-qa-policy.mjs
      - name: Build working curriculum registry from source objects
        run: npm run registry:build
      - name: Upload generated curriculum registry
        uses: actions/upload-artifact@v4
        with:
          name: generated-curriculum-registry
          path: registry/curriculum.json
          if-no-files-found: error
      - name: Audit Cultivation Foundations instructional completeness
        run: node scripts/report-foundations-instructional-completeness.mjs --check --json > foundations-instructional-completeness.json
      - name: Upload Cultivation Foundations instructional completeness
        uses: actions/upload-artifact@v4
        with:
          name: cultivation-foundations-instructional-completeness
          path: foundations-instructional-completeness.json
          if-no-files-found: error
      - name: Audit full course catalog completeness
        run: node scripts/report-course-catalog-completeness.mjs --json > course-catalog-completeness.json
      - name: Upload full course catalog completeness
        uses: actions/upload-artifact@v4
        with:
          name: course-catalog-completeness
          path: course-catalog-completeness.json
          if-no-files-found: error
      - name: Build Cultivation Foundations assessment review batch
        run: node scripts/build-assessment-review-batches.mjs --batch-size=24 > assessment-review-batch.json
      - name: Upload assessment review batch
        uses: actions/upload-artifact@v4
        with:
          name: cultivation-foundations-assessment-review-batch
          path: assessment-review-batch.json
          if-no-files-found: error
      - name: Build pending Cultivation Foundations human-review workset
        run: node scripts/build-review-packets.mjs --lane=credential-item --state=pending > foundations-pending-review-workset.json
      - name: Upload pending Cultivation Foundations human-review workset
        uses: actions/upload-artifact@v4
        with:
          name: cultivation-foundations-pending-review-workset
          path: foundations-pending-review-workset.json
          if-no-files-found: error
      - name: Build pending Cultivation Foundations item review preflight
        run: node scripts/report-foundations-item-review-preflight.mjs > foundations-item-review-preflight.json
      - name: Upload pending Cultivation Foundations item review preflight
        uses: actions/upload-artifact@v4
        with:
          name: cultivation-foundations-item-review-preflight
          path: foundations-item-review-preflight.json
          if-no-files-found: error
      - name: Build full Cultivation Foundations item-bank preflight
        run: node scripts/report-foundations-item-bank-preflight.mjs > foundations-item-bank-preflight.json
      - name: Upload full Cultivation Foundations item-bank preflight
        uses: actions/upload-artifact@v4
        with:
          name: cultivation-foundations-item-bank-preflight
          path: foundations-item-bank-preflight.json
          if-no-files-found: error
      - name: Report Cultivation Foundations item-bank readiness
        run: node scripts/report-item-bank-readiness.mjs > foundations-item-bank-readiness.json
      - name: Upload Cultivation Foundations item-bank readiness
        uses: actions/upload-artifact@v4
        with:
          name: cultivation-foundations-item-bank-readiness
          path: foundations-item-bank-readiness.json
          if-no-files-found: error
      - name: Build Cultivation Foundations review handoff
        run: node scripts/build-foundations-review-handoff.mjs > foundations-review-handoff.json
      - name: Upload Cultivation Foundations review handoff
        uses: actions/upload-artifact@v4
        with:
          name: cultivation-foundations-review-handoff
          path: foundations-review-handoff.json
          if-no-files-found: error
      - name: Report Cultivation Foundations answer-key balance
        run: node scripts/rebalance-foundations-pending-answer-positions.mjs > foundations-answer-key-balance.json
      - name: Upload Cultivation Foundations answer-key balance
        uses: actions/upload-artifact@v4
        with:
          name: cultivation-foundations-answer-key-balance
          path: foundations-answer-key-balance.json
          if-no-files-found: error
      - name: Build Cultivation Foundations pilot cohort
        run: node scripts/build-foundations-pilot-cohort.mjs > foundations-pilot-cohort.json
      - name: Upload Cultivation Foundations pilot cohort
        uses: actions/upload-artifact@v4
        with:
          name: cultivation-foundations-pilot-cohort
          path: foundations-pilot-cohort.json
          if-no-files-found: error
      - name: Build Cultivation Foundations pilot staging plan
        run: node scripts/stage-foundations-pilot-cohort.mjs > foundations-pilot-staging-plan.json
      - name: Upload Cultivation Foundations pilot staging plan
        uses: actions/upload-artifact@v4
        with:
          name: cultivation-foundations-pilot-staging-plan
          path: foundations-pilot-staging-plan.json
          if-no-files-found: error
      - name: Dry-run reviewed Foundations active-pool promotion
        run: node scripts/promote-foundations-active-pool.mjs > assessment-promotion-plan.json
      - name: Upload assessment promotion plan
        uses: actions/upload-artifact@v4
        with:
          name: cultivation-foundations-assessment-promotion-plan
          path: assessment-promotion-plan.json
          if-no-files-found: error
      - name: Validate operational controls
        run: npm run ops:validate
      - name: Validate staging readiness contract for promotion branches
        if: ${{ github.base_ref == 'staging' || github.base_ref == 'main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' }}
        run: npm run staging:readiness
      - name: Validate system readiness consistency
        run: npm run status:check
      - name: Validate production-readiness boundary
        run: npm run production:readiness
      - name: Run complete curriculum and credential test suite against generated registry
        run: npm test
