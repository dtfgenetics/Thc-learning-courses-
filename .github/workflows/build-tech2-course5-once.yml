name: Build Technician II Course 005 once

on:
  push:
    branches:
      - feat/tech2-course-005-instruction-assessment

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Technician II Course 005 source
        run: node scripts/build-tech2-course5.mjs
      - name: Rebuild curriculum registry
        run: npm run registry:build
      - name: Validate Course 205 item quality
        run: node scripts/check-learning-hub-item-quality.mjs
      - name: Validate Course 205 contracts
        run: |
          npm run schema:validate
          npm run validate
          npm run registry:validate
          npm run tech2:program:test
          npm run tech2:course1:test
          npm run tech2:course2:test
          npm run tech2:course3:test
          npm run tech2:course4:test
          npm run tech2:course5:test
          npm run credential:tech2:test
      - name: Run complete deterministic suite
        run: npm test
      - name: Commit validated Course 205 source
        run: |
          rm -f .github/workflows/build-tech2-course5-once.yml scripts/build-tech2-course5.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content docs package.json registry scripts .github/workflows
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat: build Technician II Course 005 propagation and canopy performance'
          git push origin HEAD:feat/tech2-course-005-instruction-assessment
