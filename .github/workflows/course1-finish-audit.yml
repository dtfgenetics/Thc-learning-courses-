name: Course 1 finish audit

on:
  pull_request:
    branches: [dev, staging, main]
    paths:
      - content/courses/COURSE-LH-TECH1-001.json
      - content/modules/MOD-LH-TECH1-001-*.json
      - content/lessons/LESSON-LH-TECH1-001-*.json
      - content/learning-objectives/LO-LH-TECH1-001-*.json
      - content/assessments/ASSESS-LH-TECH1-001-*.json
      - content/questions/ITEM-LH-TECH1-001-*.json
      - content/performance-assessments/**
      - content/reviews/**
      - apps/web/public/rich-content.js
      - apps/web/public/rich-content.css
      - apps/web/public/assets/course1/**
      - visuals/ASSET-REGISTRY.json
      - visuals/COURSE1-VISUAL-RELEASE-MANIFEST.json
      - visuals/COURSE1-PNG-QA-13-18.json
      - visuals/COURSE1-PRODUCTION-QUALITY-POLICY.json
      - docs/learning-hub/tech1/course-001/FINAL-HUMAN-REVIEW-WORKLIST.md
      - docs/learning-hub/tech1/course-001/instructor/OBJECTIVE-REMEDIATION-MATRIX.md
      - docs/learning-hub/tech1/course-001/accessibility/COURSE1-RENDERED-ACCESSIBILITY-UX-REVIEW.md
      - docs/learning-hub/tech1/course-001/PRODUCTION-QUALITY-STANDARD.md
      - registry/course1-completion-status.json
      - scripts/build-learning-hub-review-queue.mjs
      - scripts/audit-course1-objective-coverage.mjs
      - scripts/audit-course1-review-inventory.mjs
      - scripts/check-course1-material-production-quality.mjs
      - .github/workflows/course1-finish-audit.yml
  push:
    branches: [dev, staging, main, 'feat/course1-finish-*', 'fix/course1-*']
    paths:
      - content/courses/COURSE-LH-TECH1-001.json
      - content/modules/MOD-LH-TECH1-001-*.json
      - content/lessons/LESSON-LH-TECH1-001-*.json
      - content/learning-objectives/LO-LH-TECH1-001-*.json
      - content/assessments/ASSESS-LH-TECH1-001-*.json
      - content/questions/ITEM-LH-TECH1-001-*.json
      - content/performance-assessments/**
      - content/reviews/**
      - apps/web/public/rich-content.js
      - apps/web/public/rich-content.css
      - apps/web/public/assets/course1/**
      - visuals/ASSET-REGISTRY.json
      - visuals/COURSE1-VISUAL-RELEASE-MANIFEST.json
      - visuals/COURSE1-PNG-QA-13-18.json
      - visuals/COURSE1-PRODUCTION-QUALITY-POLICY.json
      - docs/learning-hub/tech1/course-001/FINAL-HUMAN-REVIEW-WORKLIST.md
      - docs/learning-hub/tech1/course-001/instructor/OBJECTIVE-REMEDIATION-MATRIX.md
      - docs/learning-hub/tech1/course-001/accessibility/COURSE1-RENDERED-ACCESSIBILITY-UX-REVIEW.md
      - docs/learning-hub/tech1/course-001/PRODUCTION-QUALITY-STANDARD.md
      - registry/course1-completion-status.json
      - scripts/build-learning-hub-review-queue.mjs
      - scripts/audit-course1-objective-coverage.mjs
      - scripts/audit-course1-review-inventory.mjs
      - scripts/check-course1-material-production-quality.mjs
      - .github/workflows/course1-finish-audit.yml

permissions:
  contents: read

jobs:
  course1-finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enforce learner material production quality
        run: node scripts/check-course1-material-production-quality.mjs
      - name: Verify objective instruction-practice-assessment-remediation loop
        run: node scripts/audit-course1-objective-coverage.mjs
      - name: Verify complete human-review inventory
        run: node scripts/audit-course1-review-inventory.mjs
      - name: Verify Learning Hub review queue integrity
        run: node scripts/build-learning-hub-review-queue.mjs --course=COURSE-LH-TECH1-001 --summary-only --check
      - name: Require durable final human-review worklist
        run: |
          test -s docs/learning-hub/tech1/course-001/FINAL-HUMAN-REVIEW-WORKLIST.md
          grep -q "npm run review:lh:course1" docs/learning-hub/tech1/course-001/FINAL-HUMAN-REVIEW-WORKLIST.md
          grep -q "166" docs/learning-hub/tech1/course-001/FINAL-HUMAN-REVIEW-WORKLIST.md
      - name: Require rendered accessibility and manual UX review packet
        run: |
          test -s docs/learning-hub/tech1/course-001/accessibility/COURSE1-RENDERED-ACCESSIBILITY-UX-REVIEW.md
          grep -q "WCAG 2.2" docs/learning-hub/tech1/course-001/accessibility/COURSE1-RENDERED-ACCESSIBILITY-UX-REVIEW.md
          grep -q "19 canonical visual placements" docs/learning-hub/tech1/course-001/accessibility/COURSE1-RENDERED-ACCESSIBILITY-UX-REVIEW.md
