name: Universal credential governance once

on:
  push:
    branches: [feat/universal-credential-governance-v1]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Require governance for every credential and pin course completion
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          credentials_dir = Path('content/credentials')
          courses_dir = Path('content/courses')
          for path in sorted(credentials_dir.glob('*.json')):
              credential = json.loads(path.read_text())
              course_id = credential.get('course')
              course_path = courses_dir / f'{course_id}.json'
              if not course_path.exists():
                  raise SystemExit(f'{credential.get("id")}: linked course missing: {course_id}')
              course = json.loads(course_path.read_text())
              credential['courseVersion'] = str(course['version'])
              credential.setdefault('governance', {
                  'certificationUseStatus': 'validation-pending',
                  'humanReviewStatus': 'not-started',
                  'accessibilityReviewStatus': 'not-started',
                  'pilotStatus': 'not-started',
                  'standardSettingStatus': 'not-started',
                  'releaseApprovalStatus': 'not-requested'
              })
              eligibility = credential.setdefault('eligibility', {})
              eligibility['requireCourseCompletion'] = True
              extensions = credential.setdefault('extensions', {})
              extensions.setdefault('thresholdGovernance', {
                  'configuredScoreIsProvisional': True,
                  'certificationUseBlockedUntilStandardSetting': True
              })
              path.write_text(json.dumps(credential, indent=2) + '\n')
          PY
      - name: Make credential evaluator universally fail closed without governance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/domain/credential-eligibility.mjs')
          text = path.read_text()
          old = """function credentialReleaseBlockers(credential) {\n  if (!credential?.governance) return [];\n  const blockers = [];\n"""
          new = """function credentialReleaseBlockers(credential) {\n  const blockers = [];\n  if (!credential?.governance) {\n    blockers.push({\n      type: 'credential-release',\n      id: credential?.id ?? null,\n      reason: 'credential-governance-missing',\n      actual: null\n    });\n    return blockers;\n  }\n"""
          if old not in text:
              raise SystemExit('credential release blocker function anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Add permanent universal governance regression test
        run: |
          cat > scripts/test-credential-governance.mjs <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { evaluateCredentialEligibility } from '../packages/domain/credential-eligibility.mjs';

          const root = process.cwd();
          const credentialsDir = path.join(root, 'content/credentials');
          const courseDir = path.join(root, 'content/courses');
          const files = fs.readdirSync(credentialsDir).filter((name) => name.endsWith('.json')).sort();
          assert.ok(files.length > 0, 'credential inventory must not be empty');

          for (const file of files) {
            const credential = JSON.parse(fs.readFileSync(path.join(credentialsDir, file), 'utf8'));
            assert.ok(credential.governance, `${credential.id} must declare credential governance`);
            assert.equal(credential.governance.certificationUseStatus, 'validation-pending', `${credential.id} must remain validation-pending until approved evidence changes it`);
            assert.equal(credential.governance.releaseApprovalStatus, 'not-requested', `${credential.id} must not imply release approval`);
            for (const field of ['humanReviewStatus', 'accessibilityReviewStatus', 'pilotStatus', 'standardSettingStatus']) {
              assert.ok(credential.governance[field], `${credential.id} must declare ${field}`);
            }
            const coursePath = path.join(courseDir, `${credential.course}.json`);
            assert.ok(fs.existsSync(coursePath), `${credential.id} must reference an existing course`);
            const course = JSON.parse(fs.readFileSync(coursePath, 'utf8'));
            assert.equal(credential.courseVersion, course.version, `${credential.id} must pin the current course version`);
            assert.equal(credential.eligibility.requireCourseCompletion, true, `${credential.id} must require versioned course completion`);
            assert.equal(credential.extensions?.thresholdGovernance?.configuredScoreIsProvisional, true, `${credential.id} configured score must be explicitly provisional before standard setting`);
            assert.equal(credential.extensions?.thresholdGovernance?.certificationUseBlockedUntilStandardSetting, true, `${credential.id} must block certification use until standard setting`);

            const noEvidence = evaluateCredentialEligibility({ credential, evidence: {} });
            assert.equal(noEvidence.eligible, false, `${credential.id} must fail closed without learner evidence and release approval`);
            assert.equal(noEvidence.releaseAuthorized, false, `${credential.id} must not report release authorization while validation-pending`);
            assert.ok(noEvidence.releaseBlockers.length > 0, `${credential.id} must expose release blockers while validation-pending`);
          }

          const synthetic = {
            id: 'CRED-SYNTHETIC-001',
            title: 'Synthetic Credential',
            version: '1.0.0',
            status: 'approved',
            course: 'COURSE-SYNTHETIC-001',
            eligibility: { requiredAssessments: [], minimumPassingScorePercent: 80 }
          };
          const missingGovernance = evaluateCredentialEligibility({ credential: synthetic, evidence: {} });
          assert.equal(missingGovernance.eligible, false);
          assert.ok(missingGovernance.releaseBlockers.some((row) => row.reason === 'credential-governance-missing'));

          console.log(`Credential governance regression passed for ${files.length} credential definitions.`);
          JS
          node - <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['credential:governance:test'] = 'node scripts/test-credential-governance.mjs';
          const marker = 'npm run credential:test &&';
          if (!pkg.scripts.test.includes(marker)) throw new Error('credential:test marker missing from canonical npm test chain');
          pkg.scripts.test = pkg.scripts.test.replace(marker, 'npm run credential:governance:test && npm run credential:test &&');
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          JS
      - name: Improve credential-progress UI release-state language
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/public/portal.js')
          text = path.read_text()
          old = """    summary.append(\n      summaryCard('Credential status', data.eligibility?.eligible ? 'Eligible' : 'In progress', data.credential?.title ?? ''),"""
          new = """    const releasePending = data.eligibility?.requirementsSatisfied === true && data.eligibility?.releaseAuthorized === false;\n    const credentialStatus = data.eligibility?.eligible ? 'Eligible' : releasePending ? 'Release pending' : 'In progress';\n    const credentialStatusNote = releasePending\n      ? 'Learner requirements are satisfied; credential validation/release gates are still open.'\n      : (data.credential?.title ?? '');\n    summary.append(\n      summaryCard('Credential status', credentialStatus, credentialStatusNote),"""
          if old not in text:
              raise SystemExit('credential status summary anchor not found')
          text = text.replace(old, new, 1)
          old2 = """      for (const row of data.eligibility?.missingRequirements ?? []) {\n        const humanType = row.type === 'assessment' ? 'Written assessment' : row.type === 'performance-assessment' ? 'Practical/capstone' : 'Portfolio artifact';\n        list.append(text('li', `${humanType}: ${row.id} — ${statusLabel(row.reason)}`));\n      }\n      if (!list.children.length) list.append(text('li', 'No unresolved requirement details are available.'));"""
          new2 = """      for (const row of data.eligibility?.missingRequirements ?? []) {\n        const humanType = row.type === 'assessment'\n          ? 'Written assessment'\n          : row.type === 'performance-assessment'\n            ? 'Practical/capstone'\n            : row.type === 'course-completion'\n              ? 'Course completion'\n              : 'Portfolio artifact';\n        list.append(text('li', `${humanType}: ${row.id} — ${statusLabel(row.reason)}`));\n      }\n      for (const row of data.eligibility?.releaseBlockers ?? []) {\n        list.append(text('li', `Credential release: ${statusLabel(row.reason)}`));\n      }\n      if (!list.children.length) list.append(text('li', 'No unresolved requirement details are available.'));"""
          if old2 not in text:
              raise SystemExit('credential blockers UI anchor not found')
          path.write_text(text.replace(old2, new2, 1))
          PY
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild registry
        run: npm run registry:build
      - name: Run universal credential-governance regression
        run: npm run credential:governance:test
      - name: Run complete deterministic suite
        run: npm test
      - name: Commit migration and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/universal-credential-governance-once.yml
          git add -A
          git commit -m "feat: require release governance for every credential"
          git push origin HEAD:feat/universal-credential-governance-v1
