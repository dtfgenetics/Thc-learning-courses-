name: Reviewed assessment version integrity

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'content/questions/**'
      - 'content/reviews/**'
      - 'scripts/check-reviewed-assessment-item-versioning.mjs'
      - 'scripts/test-reviewed-assessment-item-versioning.mjs'
      - 'scripts/report-foundations-reviewed-item-remediation.mjs'
      - '.github/workflows/reviewed-assessment-version-integrity.yml'
  push:
    branches: [staging, main]
    paths:
      - 'content/questions/**'
      - 'content/reviews/**'
      - 'scripts/check-reviewed-assessment-item-versioning.mjs'
      - 'scripts/test-reviewed-assessment-item-versioning.mjs'
      - 'scripts/report-foundations-reviewed-item-remediation.mjs'
      - '.github/workflows/reviewed-assessment-version-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewed-item-version-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test version-integrity rules
        run: node scripts/test-reviewed-assessment-item-versioning.mjs
      - name: Reject substantive same-version edits to approved assessment items
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-reviewed-assessment-item-versioning.mjs --base="$REVIEW_BASE_SHA"
      - name: Build reviewed Foundations remediation inventory
        run: node scripts/report-foundations-reviewed-item-remediation.mjs > foundations-reviewed-item-remediation.json
      - name: Upload reviewed Foundations remediation inventory
        uses: actions/upload-artifact@v4
        with:
          name: cultivation-foundations-reviewed-item-remediation
          path: foundations-reviewed-item-remediation.json
          if-no-files-found: error
