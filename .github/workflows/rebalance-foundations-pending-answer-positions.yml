name: Rebalance pending Foundations answer positions

on:
  push:
    branches: [work/rebalance-foundations-pending-answer-positions]

permissions:
  contents: write

concurrency:
  group: foundations-pending-answer-position-rebalance
  cancel-in-progress: true

jobs:
  rebalance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/rebalance-foundations-pending-answer-positions
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebalance only unreviewed Foundations item answer positions
        run: node scripts/rebalance-foundations-pending-answer-positions.mjs --write > foundations-answer-key-rebalance.json
      - name: Rebuild generated registry
        run: npm run registry:build
      - name: Run complete curriculum and credential test suite
        run: npm test
      - name: Commit validated rebalance to work branch
        shell: bash
        run: |
          if git diff --quiet -- content/questions registry/curriculum.json; then
            echo "No answer-position changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/questions registry/curriculum.json
          git commit -m "Rebalance pending Foundations answer positions"
          git push origin HEAD:work/rebalance-foundations-pending-answer-positions
      - name: Upload rebalance report
        uses: actions/upload-artifact@v4
        with:
          name: cultivation-foundations-answer-key-rebalance
          path: foundations-answer-key-rebalance.json
          if-no-files-found: error
