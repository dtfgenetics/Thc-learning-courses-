name: Record public deployment evidence

on:
  push:
    branches: [main]
    paths-ignore:
      - 'registry/**'
      - 'scripts/record-public-deployment-identity.mjs'
      - 'scripts/test-tech1-course-deployment-evidence.mjs'
      - 'scripts/test-tech1-course-completion-status.mjs'
      - 'scripts/test-tech2-course-completion-status.mjs'
      - '.github/workflows/public-deployment-identity.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full deployed source SHA expected from /api/build-info
        required: true
        type: string
      base_url:
        description: Public Academy base URL
        required: false
        default: https://dtfseeds.com
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: academy-public-deployment-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve verification target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.expected_sha }}
          INPUT_BASE_URL: ${{ inputs.base_url }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "expected_sha=$PUSH_SHA" >> "$GITHUB_OUTPUT"
            echo "base_url=https://dtfseeds.com" >> "$GITHUB_OUTPUT"
          else
            echo "expected_sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
            echo "base_url=${INPUT_BASE_URL:-https://dtfseeds.com}" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve deployed build identity
        id: deployment
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            if node scripts/verify-public-deployment-identity.mjs --base-url "$BASE_URL" --expected-sha "$EXPECTED_SHA"; then
              echo "deployed=true" >> "$GITHUB_OUTPUT"
            else
              echo "deployed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Current repository push is not the deployed Academy source yet; no deployment evidence will be recorded."
            fi
            exit 0
          fi

          for attempt in {1..20}; do
            if node scripts/verify-public-deployment-identity.mjs --base-url "$BASE_URL" --expected-sha "$EXPECTED_SHA"; then
              echo "deployed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Deployment identity not current yet (attempt $attempt/20)."
            if [ "$attempt" -lt 20 ]; then sleep 30; fi
          done
          echo "::error::Public deployment did not report expected source SHA within the verification window."
          exit 1
      - name: Record exact public deployment identity
        if: steps.deployment.outputs.deployed == 'true'
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          node scripts/record-public-deployment-identity.mjs --base-url "$BASE_URL" --expected-sha "$EXPECTED_SHA" --write
      - name: Verify deployed learner surfaces
        if: steps.deployment.outputs.deployed == 'true'
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          node scripts/verify-public-learner-surface.mjs --base-url "$BASE_URL" --expected-sha "$EXPECTED_SHA" --write
      - name: Validate updated deployment evidence
        if: steps.deployment.outputs.deployed == 'true'
        run: |
          npm run academy:accessibility:test
          npm run tech1:course-completion-status:test
          npm run tech1:course-deployment-evidence:test
          npm run tech2:course-completion-status:test
          npm run academy:completion:check
      - name: Create ledger update pull request
        if: steps.deployment.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          if git diff --quiet; then
            echo "No ledger changes are required."
            exit 0
          fi
          short_sha="${EXPECTED_SHA:0:12}"
          branch="ops/deployment-evidence-${short_sha}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add registry/
          git commit -m "ops: record deployed Academy evidence ${short_sha}"
          git push -u origin "$branch"
          existing="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            if ! gh pr create --base main --head "$branch" --title "Record deployed Academy evidence ${short_sha}" --body "Verified the public /api/build-info response and learner course/lesson/assessment surfaces against full source SHA \`${EXPECTED_SHA}\`. Machine deployment QA was recorded; manual responsive/accessibility and human certification gates remain fail-closed."; then
              echo "::warning::Evidence branch $branch was pushed successfully, but repository settings did not permit GitHub Actions to open the PR. Create a PR from $branch to main with normal repository tooling."
            fi
          else
            echo "PR #$existing already exists."
          fi
