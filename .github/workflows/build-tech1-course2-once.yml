name: Build Technician I Course 002 once

on:
  push:
    branches: [feat/tech1-course-002-instruction-assessment]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Course 002 source objects
        run: node scripts/build-tech1-course2.mjs
      - name: Rebuild curriculum registry
        run: npm run registry:build
      - name: Validate Course 002 slice
        run: |
          npm run schema:validate
          npm run validate
          npm run registry:validate
          npm run tech1:program:test
          npm run tech1:course2:test
      - name: Run complete deterministic suite
        run: npm test
      - name: Commit validated Course 002 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-tech1-course2-once.yml
          git add content package.json registry scripts
          git commit -m "feat: build Technician I Course 002 instruction and assessment"
          git push origin HEAD:feat/tech1-course-002-instruction-assessment
