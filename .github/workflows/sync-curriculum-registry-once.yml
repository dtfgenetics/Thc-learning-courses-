name: Sync curriculum registry once

on:
  push:
    branches:
      - feat/continuous-lesson-gap-audit-20261003
    paths:
      - .github/workflows/sync-curriculum-registry-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/continuous-lesson-gap-audit-20261003
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run registry:build
      - name: Commit registry
        run: |
          git config user.name "dtf-course-automation"
          git config user.email "actions@users.noreply.github.com"
          git add registry/curriculum.json
          if git diff --cached --quiet; then echo "Registry already current."; exit 0; fi
          git commit -m "Sync generated curriculum registry [generated-registry]"
          git push origin HEAD:feat/continuous-lesson-gap-audit-20261003
