name: Run assessment feedback policy v2 temporary

on:
  push:
    branches:
      - feat/assessment-feedback-policy-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/assessment-feedback-policy-v2
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: python scripts/patch-assessment-feedback-policy-v2-temp.py
      - run: npm run assessment:feedback:test
      - run: npm run assessment:delivery:test
      - run: npm run assessment:competency-version:test
      - run: npm run api:learner-assessment:test
      - name: Commit permanent feedback policy integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-assessment-feedback-policy-v2-temp.yml scripts/patch-assessment-feedback-policy-v2-temp.py
          git add apps/api/src/assessment-delivery.mjs package.json scripts/test-assessment-feedback-policy.mjs
          git commit -m "Honor declared assessment feedback policy"
          git push origin HEAD:feat/assessment-feedback-policy-v2
