name: C032 registry sync once

on:
  push:
    branches:
      - feature/thc-c032-clean-port
    paths:
      - .github/workflows/c032-registry-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/thc-c032-clean-port
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Rebuild canonical registry and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-global-registry.mjs --write
          rm .github/workflows/c032-registry-sync-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/curriculum.json .github/workflows/c032-registry-sync-once.yml
          git diff --cached --exit-code && { echo "No generated-state change to commit"; exit 1; } || true
          git commit -m "Sync generated registry for THC-C032"
          git push origin HEAD:feature/thc-c032-clean-port
