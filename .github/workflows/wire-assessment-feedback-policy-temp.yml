name: Wire assessment feedback policy temporary

on:
  push:
    branches:
      - feat/assessment-feedback-policy

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/assessment-feedback-policy
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Wire feedback policy test into default gate
        shell: python
        run: |
          from pathlib import Path
          p = Path('package.json')
          text = p.read_text()
          anchor = '    "assessment:policy:test": "node scripts/test-assessment-attempt-policy.mjs",\n'
          line = '    "assessment:feedback:test": "node scripts/test-assessment-feedback-policy.mjs",\n'
          if '"assessment:feedback:test"' not in text:
              if anchor not in text: raise SystemExit('assessment policy script anchor missing')
              text = text.replace(anchor, anchor + line, 1)
          chain = 'npm run assessment:delivery:test && npm run assessment:policy:test && npm run api:learner-assessment:test'
          replacement = 'npm run assessment:delivery:test && npm run assessment:policy:test && npm run assessment:feedback:test && npm run api:learner-assessment:test'
          if replacement not in text:
              if chain not in text: raise SystemExit('assessment test chain anchor missing')
              text = text.replace(chain, replacement, 1)
          p.write_text(text)
      - run: npm run assessment:feedback:test
      - run: npm run assessment:delivery:test
      - run: npm run api:learner-assessment:test
      - name: Commit permanent feedback policy integration
        run: |
          rm .github/workflows/wire-assessment-feedback-policy-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/assessment-delivery.mjs scripts/test-assessment-feedback-policy.mjs package.json .github/workflows/wire-assessment-feedback-policy-temp.yml
          git commit -m "Enforce assessment feedback disclosure policy"
          git push origin HEAD:feat/assessment-feedback-policy
