name: Build Technician II release readiness once

on:
  push:
    branches:
      - feat/tech2-release-readiness

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/tech2-release-readiness
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Technician II release-readiness source
        run: node scripts/build-tech2-release-readiness.mjs
      - name: Rebuild curriculum registry
        run: npm run registry:build
      - name: Validate release-readiness contracts
        run: |
          node scripts/check-learning-hub-item-quality.mjs
          npm run schema:validate
          npm run validate
          npm run performance:validate
          npm run registry:validate
          npm run tech2:program:test
          npm run tech2:course8:test
          npm run tech2:release-readiness:test
          npm run credential:tech2:test
          node scripts/test-public-credential-bank-boundary.mjs
      - name: Run complete deterministic suite
        run: npm test
      - name: Commit validated Technician II release-readiness source
        run: |
          rm -f .github/workflows/build-tech2-release-readiness-once.yml scripts/build-tech2-release-readiness.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: add Technician II release-readiness governance"
          git push origin HEAD:feat/tech2-release-readiness
