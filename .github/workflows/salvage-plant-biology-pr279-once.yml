name: Salvage Plant Biology PR279 once

on:
  push:
    branches:
      - salvage/plant-biology-pr279

permissions:
  contents: write

jobs:
  salvage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Port only the useful PR279 content
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin content/v2-plant-biology-lesson-assessments
          OLD=origin/content/v2-plant-biology-lesson-assessments

          for p in \
            content/assessments/ASSESS-PLANT-BIO-ANATOMY-002.json \
            content/assessments/ASSESS-PLANT-BIO-SEX-003.json \
            content/references/REF-TRICHOME-BIOLOGY-2021-001.json \
            content/references/REF-FLOROGENESIS-2019-001.json \
            content/questions/ITEM-PLANT-BIO-A2-001.json \
            content/questions/ITEM-PLANT-BIO-A2-002.json \
            content/questions/ITEM-PLANT-BIO-A2-003.json \
            content/questions/ITEM-PLANT-BIO-A2-004.json \
            content/questions/ITEM-PLANT-BIO-A2-005.json \
            content/questions/ITEM-PLANT-BIO-A2-006.json \
            content/questions/ITEM-PLANT-BIO-A2-007.json \
            content/questions/ITEM-PLANT-BIO-A2-008.json \
            content/questions/ITEM-PLANT-BIO-S3-001.json \
            content/questions/ITEM-PLANT-BIO-S3-002.json \
            content/questions/ITEM-PLANT-BIO-S3-003.json \
            content/questions/ITEM-PLANT-BIO-S3-004.json \
            content/questions/ITEM-PLANT-BIO-S3-005.json \
            content/questions/ITEM-PLANT-BIO-S3-006.json \
            content/questions/ITEM-PLANT-BIO-S3-007.json \
            content/questions/ITEM-PLANT-BIO-S3-008.json
          do
            mkdir -p "$(dirname "$p")"
            git show "$OLD:$p" > "$p"
          done

          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const OLD = 'origin/content/v2-plant-biology-lesson-assessments';
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const readOld = p => JSON.parse(execFileSync('git', ['show', `${OLD}:${p}`], { encoding: 'utf8' }));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');

          const coursePath = 'content/courses/COURSE-CULT-FOUNDATIONS-001.json';
          const course = read(coursePath);
          const oldCourse = readOld(coursePath);
          course.version = '1.1.0';
          course.description = oldCourse.description;
          course.level = oldCourse.academicLevel || 'foundational';
          course.intendedAudience = oldCourse.intendedAudience;
          course.prerequisites = oldCourse.prerequisites;
          course.deliveryModes = oldCourse.deliveryModes;
          course.learningOutcomes = oldCourse.learningOutcomes;
          course.evidencePolicy = `${oldCourse.sourcePolicy.standard} ${oldCourse.sourcePolicy.citationPractice}`;
          course.assessmentPolicy = [
            oldCourse.assessmentPolicy.formative,
            oldCourse.assessmentPolicy.module,
            oldCourse.assessmentPolicy.summative,
            oldCourse.assessmentPolicy.productionActivation,
            oldCourse.assessmentPolicy.credential
          ].join(' ');
          course.extensions = {
            ...(course.extensions || {}),
            academicProfile: {
              sourcePolicy: oldCourse.sourcePolicy,
              detailedAssessmentPolicy: oldCourse.assessmentPolicy,
              credentialStatement: oldCourse.credentialStatement,
              migratedFrom: 'PR-279'
            }
          };
          write(coursePath, course);

          const lessonPaths = [
            'content/lessons/LESSON-PLANT-BIO-ANATOMY-002.json',
            'content/lessons/LESSON-PLANT-BIO-SEX-003.json'
          ];
          const supported = new Set(['overview','vocabulary','sections','workedExamples','commonMistakes','practicalApplication','summary','blocks','extensions']);
          for (const p of lessonPaths) {
            const oldLesson = readOld(p);
            const extras = {};
            for (const [k, v] of Object.entries(oldLesson.content || {})) {
              if (!supported.has(k)) extras[k] = v;
            }
            oldLesson.content = {
              overview: oldLesson.content.overview,
              vocabulary: oldLesson.content.vocabulary,
              sections: oldLesson.content.sections,
              workedExamples: oldLesson.content.workedExamples,
              commonMistakes: oldLesson.content.commonMistakes,
              practicalApplication: oldLesson.content.practicalApplication,
              summary: oldLesson.content.summary,
              extensions: {
                ...(oldLesson.content.extensions || {}),
                academyEnrichment: extras,
                migration: { source: 'PR-279', preservedWithoutArtificialContentCaps: true }
              }
            };
            oldLesson.extensions = {
              ...(oldLesson.extensions || {}),
              migration: { source: 'PR-279', currentSchemaMapped: true }
            };
            write(p, oldLesson);
          }
          NODE

      - name: Install locked dependencies
        run: npm ci
      - name: Synchronize generated registry
        run: npm run registry:build
      - name: Run deterministic validation suite
        run: npm test
      - name: Commit salvage and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/salvage-plant-biology-pr279-once.yml
          git add content/courses/COURSE-CULT-FOUNDATIONS-001.json \
            content/lessons/LESSON-PLANT-BIO-ANATOMY-002.json \
            content/lessons/LESSON-PLANT-BIO-SEX-003.json \
            content/assessments/ASSESS-PLANT-BIO-ANATOMY-002.json \
            content/assessments/ASSESS-PLANT-BIO-SEX-003.json \
            content/references/REF-TRICHOME-BIOLOGY-2021-001.json \
            content/references/REF-FLOROGENESIS-2019-001.json \
            content/questions/ITEM-PLANT-BIO-A2-*.json \
            content/questions/ITEM-PLANT-BIO-S3-*.json \
            registry/curriculum.json
          git commit -m 'Salvage Plant Biology assessments and academic lesson enrichments'
          git push origin HEAD:salvage/plant-biology-pr279
