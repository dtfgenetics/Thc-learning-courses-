name: Sync curriculum registry

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/build-global-registry.mjs"
      - ".github/workflows/sync-curriculum-registry.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-curriculum-registry-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build canonical curriculum registry
        run: npm run registry:build

      - name: Commit generated registry when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/curriculum.json
          if git diff --cached --quiet; then
            echo "Curriculum registry already matches canonical source."
            exit 0
          fi
          git commit -m "Sync generated curriculum registry"
          git push
