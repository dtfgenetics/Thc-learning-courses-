name: One-shot THC-C032 registry sync

on:
  push:
    branches: [feature/thc-c032-clean-port]
    paths:
      - .github/workflows/sync-c032-registry.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/thc-c032-clean-port
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build canonical registry
        run: npm run registry:build
      - name: Commit generated registry when changed
        run: |
          if git diff --quiet -- registry/curriculum.json; then
            echo "Registry already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/curriculum.json
          git commit -m "chore: sync generated registry for THC-C032"
          git push origin HEAD:feature/thc-c032-clean-port
