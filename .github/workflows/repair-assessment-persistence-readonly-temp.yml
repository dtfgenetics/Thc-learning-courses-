name: Repair assessment persistence read-only compatibility (temporary)

on:
  push:
    branches:
      - feat/assessment-attempt-persistence

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/assessment-attempt-persistence
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply compatibility repair
        shell: python
        run: |
          from pathlib import Path
          store_path = Path('apps/api/src/postgres-learner-store.mjs')
          text = store_path.read_text()
          old = "  if (typeof withTransaction !== 'function') throw new Error('PostgreSQL learner store requires withTransaction(callback)');\n"
          new = """  function requireTransaction() {
            if (typeof withTransaction !== 'function') throw new Error('Assessment attempt writes require withTransaction(callback)');
            return withTransaction;
          }
          """
          if old in text:
              text = text.replace(old, new, 1)
          elif 'function requireTransaction()' not in text:
              raise SystemExit('transaction guard anchor missing')
          text = text.replace('return withTransaction(async (runQuery) => {', 'return requireTransaction()(async (runQuery) => {')
          store_path.write_text(text)

          test_path = Path('scripts/test-assessment-attempt-persistence.mjs')
          test = test_path.read_text()
          old_assert = "assert.throws(() => createPostgresLearnerStore({ query: fakeQuery }), /withTransaction/);"
          new_assert = """const readOnlyStore = createPostgresLearnerStore({ query: fakeQuery });
          await assert.rejects(
            () => readOnlyStore.createAssessmentAttempt('subject-alice', started),
            /withTransaction/
          );"""
          if old_assert in test:
              test = test.replace(old_assert, new_assert, 1)
          elif 'const readOnlyStore = createPostgresLearnerStore' not in test:
              raise SystemExit('read-only assertion anchor missing')
          test_path.write_text(test)

          Path('.github/workflows/repair-assessment-persistence-readonly-temp.yml').unlink()
      - run: npm run assessment:persistence:test
      - run: npm run persistence:test
      - run: npm run production:persistence:test
      - name: Commit repair and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/postgres-learner-store.mjs scripts/test-assessment-attempt-persistence.mjs .github/workflows/repair-assessment-persistence-readonly-temp.yml
          git commit -m "Preserve read-only learner store compatibility"
          git push origin HEAD:feat/assessment-attempt-persistence
