name: Promote credential governance main once

on:
  push:
    branches: [promote/credential-governance-to-main]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Port exact validated credential-governance delta from staging
        run: |
          git fetch origin staging:refs/remotes/origin/staging
          git checkout origin/staging -- \
            apps/api/src/postgres-learner-store.mjs \
            apps/api/src/server.mjs \
            apps/web/public/portal.js \
            content/credentials/CRED-CULT-FOUNDATIONS-001.json \
            content/credentials/CRED-CANOPY-FLOWERING-ADVANCED-001.json \
            content/credentials/CRED-CROP-SYSTEMS-001.json \
            content/credentials/CRED-CULT-TECH-II-001.json \
            content/credentials/CRED-ENV-LIGHT-ADVANCED-001.json \
            content/credentials/CRED-GENETICS-ADVANCED-001.json \
            content/credentials/CRED-NUTRITION-IPM-ADVANCED-001.json \
            content/credentials/CRED-POSTHARVEST-QA-001.json \
            content/credentials/CRED-PRO-SOP-QA-001.json \
            content/credentials/CRED-PROP-ADVANCED-001.json \
            content/credentials/CRED-WATER-IRRIGATION-ADVANCED-001.json \
            package.json \
            packages/domain/credential-eligibility.mjs \
            schemas/credential.schema.json \
            scripts/test-credential-eligibility.mjs \
            scripts/test-credential-governance.mjs \
            scripts/test-technician-ii-credential.mjs \
            tests/fixtures/eligibility-fail.json \
            tests/fixtures/eligibility-pass.json \
            tests/fixtures/tech2-eligibility-fail.json \
            tests/fixtures/tech2-eligibility-pass.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild generated registry
        run: npm run registry:build
      - name: Verify universal credential governance
        run: npm run credential:governance:test
      - name: Run complete deterministic suite on current main plus governance
        run: npm test
      - name: Commit exact promotion and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/promote-credential-governance-main-once.yml
          git add -A
          git commit -m "feat: promote universal credential governance to main"
          git push origin HEAD:promote/credential-governance-to-main
