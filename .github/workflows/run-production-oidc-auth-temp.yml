name: Run production OIDC integration temporary

on:
  push:
    branches:
      - feat/production-oidc-auth-adapter

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/production-oidc-auth-adapter
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: python scripts/patch-production-oidc-auth-temp.py
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run api:oidc-auth:test
      - run: npm run api:test
      - run: npm run api:bootstrap:test
      - run: npm run api:learner-assessment:test
      - run: npm run api:performance-result:test
      - name: Commit permanent OIDC integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-production-oidc-auth-temp.yml scripts/patch-production-oidc-auth-temp.py
          git add apps/api/src/oidc-auth-adapter.mjs apps/api/src/server.mjs apps/api/src/bootstrap.mjs scripts/test-oidc-auth-adapter.mjs scripts/test-production-bootstrap.mjs docs/API-SECURITY.md package.json package-lock.json
          git commit -m "Integrate production OIDC authentication"
          git push origin HEAD:feat/production-oidc-auth-adapter
