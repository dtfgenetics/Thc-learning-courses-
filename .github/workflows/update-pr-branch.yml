name: Update PR Branch

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to update with its latest base branch
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pr-branch-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.inputs.pr_number }}
    steps:
      - name: Validate and update PR branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pr_number must be numeric"; exit 1; }
          pr="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          [[ "$(jq -r '.state' <<<"$pr")" == "open" ]] || { echo "::error::PR is not open"; exit 1; }
          [[ "$(jq -r '.head.repo.full_name // ""' <<<"$pr")" == "$REPOSITORY" ]] || { echo "::error::fork-backed PR is not writable with this repository token"; exit 1; }
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          base_sha="$(jq -r '.base.sha' <<<"$pr")"
          behind="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "/repos/${REPOSITORY}/compare/${base_sha}...${head_sha}" --jq '.behind_by')"
          if [[ "$behind" == "0" ]]; then
            echo "PR #${PR_NUMBER} is already current with its base." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api --method PUT -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/update-branch" -f expected_head_sha="$head_sha"
          for attempt in {1..20}; do
            new_sha="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            [[ "$new_sha" != "$head_sha" ]] && { echo "Updated PR #${PR_NUMBER}: ${head_sha} -> ${new_sha}" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 2
          done
          echo "::error::Update was accepted but PR head did not advance during verification."
          exit 1
