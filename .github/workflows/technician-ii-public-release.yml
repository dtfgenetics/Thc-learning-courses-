name: Technician II public academic release

on:
  pull_request:
    paths:
      - 'content/courses/COURSE-LH-TECH2-*.json'
      - 'content/modules/MOD-LH-TECH2-*.json'
      - 'content/lessons/LESSON-LH-TECH2-*.json'
      - 'content/assessments/ASSESS-LH-TECH2-*.json'
      - 'content/questions/Q-LH-TECH2-*.json'
      - 'content/public-releases/PUBLIC-RELEASE-LH-TECH2-*.json'
      - 'scripts/test-tech2-public-release.mjs'
      - 'docs/learning-hub/tech2/**'
      - 'registry/tech2-course*-completion-status.json'
      - 'registry/tech2-course*-deployment-evidence.json'
      - 'scripts/test-tech2-learner-runtime.mjs'
      - 'scripts/test-tech2-course-completion-status.mjs'
      - 'scripts/test-tech2-course-support-packages.mjs'
      - 'scripts/test-tech2-visual-production-plan.mjs'
      - 'scripts/test-tech2-review-queues.mjs'
      - 'scripts/build-learning-hub-review-queue.mjs'
      - 'visuals/TECH2-VISUAL-PRODUCTION-PLAN.json'
      - '.github/workflows/technician-ii-public-release.yml'
  push:
    branches: [main, staging, dev]
    paths:
      - 'content/courses/COURSE-LH-TECH2-*.json'
      - 'content/modules/MOD-LH-TECH2-*.json'
      - 'content/lessons/LESSON-LH-TECH2-*.json'
      - 'content/assessments/ASSESS-LH-TECH2-*.json'
      - 'content/questions/Q-LH-TECH2-*.json'
      - 'content/public-releases/PUBLIC-RELEASE-LH-TECH2-*.json'
      - 'scripts/test-tech2-public-release.mjs'
      - 'docs/learning-hub/tech2/**'
      - 'registry/tech2-course*-completion-status.json'
      - 'registry/tech2-course*-deployment-evidence.json'
      - 'scripts/test-tech2-learner-runtime.mjs'
      - 'scripts/test-tech2-course-completion-status.mjs'
      - 'scripts/test-tech2-course-support-packages.mjs'
      - '.github/workflows/technician-ii-public-release.yml'

permissions:
  contents: read

jobs:
  validate-public-academic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Technician II learner release
        run: node scripts/test-tech2-public-release.mjs
      - name: Re-run Technician II program structure
        run: node scripts/test-tech2-program-structure.mjs
      - name: Re-run Technician II course regressions
        run: |
          node scripts/test-tech2-course1.mjs
          node scripts/test-tech2-course2.mjs
          node scripts/test-tech2-course3.mjs
          node scripts/test-tech2-course4.mjs
          node scripts/test-tech2-course5.mjs
          node scripts/test-tech2-course6.mjs
          node scripts/test-tech2-course7.mjs
          node scripts/test-tech2-course8.mjs
      - name: Validate Technician II learner runtime
        run: node scripts/test-tech2-learner-runtime.mjs
      - name: Validate Technician II completion/deployment evidence
        run: node scripts/test-tech2-course-completion-status.mjs
      - name: Validate Technician II learner support packages
        run: node scripts/test-tech2-course-support-packages.mjs
      - name: Validate Technician II visual production lifecycle
        run: node scripts/test-tech2-visual-production-plan.mjs
      - name: Validate Technician II versioned review queues
        run: node scripts/test-tech2-review-queues.mjs
      - name: Validate curriculum graph and references
        run: node scripts/validate-curriculum.mjs
