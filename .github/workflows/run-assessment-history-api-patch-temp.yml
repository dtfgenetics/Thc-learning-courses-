name: Run assessment history API patch temporary

on:
  push:
    branches:
      - feat/assessment-attempt-history-api

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/assessment-attempt-history-api
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: python scripts/patch-assessment-history-api-temp.py
      - run: npm run api:learner-assessment:test
      - name: Commit permanent history endpoint
        run: |
          rm .github/workflows/run-assessment-history-api-patch-temp.yml
          rm scripts/patch-assessment-history-api-temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.mjs scripts/test-learner-assessment-api.mjs .github/workflows/run-assessment-history-api-patch-temp.yml scripts/patch-assessment-history-api-temp.py
          git commit -m "Expose learner assessment attempt history and policy"
          git push origin HEAD:feat/assessment-attempt-history-api
