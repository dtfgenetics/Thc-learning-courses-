name: Build Technician II program shell once

on:
  push:
    branches:
      - feat/tech2-program-shell

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Technician II eight-course program shell
        run: node scripts/build-tech2-program-shell.mjs
      - name: Rebuild curriculum registry
        run: npm run registry:build
      - name: Validate Technician II program shell
        run: |
          npm run schema:validate
          npm run validate
          npm run registry:validate
          npm run tech2:program:test
          npm run credential:tech2:test
      - name: Run complete deterministic suite
        run: npm test
      - name: Commit validated Technician II program shell
        run: |
          rm -f .github/workflows/build-tech2-program-shell-once.yml scripts/build-tech2-program-shell.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content docs package.json registry scripts .github/workflows
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat: build Technician II eight-course program shell'
          git push origin HEAD:feat/tech2-program-shell
