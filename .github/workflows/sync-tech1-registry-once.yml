name: Sync Technician I registry once

on:
  push:
    branches: [feat/tech1-courses-002-007-structure]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build canonical curriculum registry
        run: npm run registry:build
      - name: Commit generated registry and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-tech1-registry-once.yml
          git add registry/curriculum.json
          if git diff --cached --quiet; then
            echo "No registry change to commit."
            exit 0
          fi
          git commit -m "chore: synchronize Technician I curriculum registry"
          git push origin HEAD:feat/tech1-courses-002-007-structure
