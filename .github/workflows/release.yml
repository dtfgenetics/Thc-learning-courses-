name: Curriculum release audit

on:
  workflow_dispatch:
    inputs:
      course_id:
        description: Optional course ID to audit
        required: false
        default: COURSE-LH-TECH1-001
        type: string
      credential_id:
        description: Optional credential ID for context
        required: false
        type: string
  push:
    tags:
      - "academy-*"

permissions:
  contents: read

jobs:
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve audit scope
        id: scope
        shell: bash
        env:
          INPUT_COURSE_ID: ${{ inputs.course_id }}
          INPUT_CREDENTIAL_ID: ${{ inputs.credential_id }}
        run: |
          course="$INPUT_COURSE_ID"
          credential="$INPUT_CREDENTIAL_ID"
          if [[ -z "$course" ]]; then
            course="COURSE-LH-TECH1-001"
          fi
          echo "course=$course" >> "$GITHUB_OUTPUT"
          echo "credential=$credential" >> "$GITHUB_OUTPUT"
      - name: Run complete project quality suite
        run: npm test
      - name: Run production readiness gate
        env:
          RELEASE_COURSE_ID: ${{ steps.scope.outputs.course }}
          RELEASE_CREDENTIAL_ID: ${{ steps.scope.outputs.credential }}
        run: npm run production:readiness
      - name: Run release readiness gate
        env:
          RELEASE_COURSE_ID: ${{ steps.scope.outputs.course }}
          RELEASE_CREDENTIAL_ID: ${{ steps.scope.outputs.credential }}
        run: npm run release:check
