name: Production curriculum release gate

on:
  workflow_dispatch:
  push:
    tags:
      - "academy-*"

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run complete quality suite
        run: npm test
      - name: Enforce production publication gates
        run: npm run release:check
