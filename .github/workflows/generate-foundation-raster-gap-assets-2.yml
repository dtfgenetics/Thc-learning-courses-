name: Generate final foundation raster gap assets

on:
  push:
    branches:
      - feat/continuous-lesson-gap-audit-20261003
    paths:
      - scripts/generate-foundation-raster-gap-assets-2.py
      - .github/workflows/generate-foundation-raster-gap-assets-2.yml

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated-foundation-visuals-2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/continuous-lesson-gap-audit-20261003
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate and wire final visual assets
        run: python scripts/generate-foundation-raster-gap-assets-2.py
      - name: Verify generated WebP files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files=list(Path('apps/web/public/assets').glob('course*/foundation-*.webp'))
          if len(files) < 14:
              raise SystemExit(f'Expected at least 14 foundation WebPs, found {len(files)}')
          for p in files:
              with Image.open(p) as im:
                  if im.format != 'WEBP' or min(im.size) < 1600:
                      raise SystemExit(f'Invalid raster {p}: {im.format} {im.size}')
          print(f'Validated {len(files)} foundation WebPs.')
          PY
      - name: Commit generated binaries and metadata
        run: |
          git config user.name "dtf-course-automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/public/assets/course3/foundation-*.webp \
                  apps/web/public/assets/course4/foundation-*.webp \
                  apps/web/public/assets/course5/foundation-*.webp \
                  visuals/COURSE3-ASSET-REGISTRY.json visuals/COURSE4-ASSET-REGISTRY.json visuals/COURSE5-ASSET-REGISTRY.json \
                  content/lessons/LESSON-ENV-LEAF-VPD-003.json \
                  content/lessons/LESSON-NUTRITION-MICRO-003.json \
                  content/lessons/LESSON-PROP-001.json \
                  content/lessons/LESSON-CANOPY-001.json
          if git diff --cached --quiet; then echo "No generated changes."; exit 0; fi
          git commit -m "Produce final foundation raster visuals [generated-foundation-visuals-2]"
          git push origin HEAD:feat/continuous-lesson-gap-audit-20261003
