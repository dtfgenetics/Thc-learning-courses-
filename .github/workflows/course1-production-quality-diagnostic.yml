name: Course 1 production-quality diagnostic

on:
  push:
    branches:
      - 'feat/course1-raster-masters-001-014-20260922'
    paths:
      - '.github/workflows/course1-production-quality-diagnostic.yml'
      - 'scripts/check-course1-material-production-quality.mjs'
      - 'visuals/COURSE1-VISUAL-RELEASE-MANIFEST.json'
      - 'visuals/review-candidates/course1/production-masters/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run production-quality gate with captured output
        id: quality
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-course1-material-production-quality.mjs 2>&1 | tee course1-production-quality.log
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: course1-production-quality-diagnostic-log
          path: course1-production-quality.log
          if-no-files-found: error
          retention-days: 7
      - name: Preserve gate result
        if: steps.quality.outcome != 'success'
        run: exit 1
