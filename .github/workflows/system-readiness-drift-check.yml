name: System readiness assessment review drift check

on:
  push:
    branches: [fix/system-readiness-assessment-review-drift]
    paths:
      - registry/system-readiness.json
      - scripts/report-system-status.mjs
      - .github/workflows/system-readiness-drift-check.yml

permissions:
  contents: read

jobs:
  readiness-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/report-system-status.mjs
      - run: node scripts/report-system-status.mjs --check
      - run: node scripts/build-foundations-assessment-review-batch.mjs --check
      - run: node scripts/test-foundations-assessment-review-batch.mjs
