name: Foundations review batch check

on:
  push:
    branches: [feat/foundations-assessment-review-batch]
    paths:
      - scripts/build-foundations-assessment-review-batch.mjs
      - scripts/test-foundations-assessment-review-batch.mjs
      - .github/workflows/foundations-review-batch-check.yml

permissions:
  contents: read

jobs:
  review-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate focused Foundations assessment review batch
        run: node scripts/test-foundations-assessment-review-batch.mjs
