name: Patch learner progress semver (temporary)

on:
  push:
    branches:
      - fix/learner-progress-semver-api

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/learner-progress-semver-api
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply targeted API/test patch
        shell: python
        run: |
          from pathlib import Path

          server_path = Path('apps/api/src/server.mjs')
          text = server_path.read_text()
          import_anchor = "import { evaluateCredentialEligibility } from '../../../packages/domain/credential-eligibility.mjs';\n"
          import_line = "import { isValidCurriculumVersion } from '../../../packages/domain/learning-completion.mjs';\n"
          if import_line not in text:
              if import_anchor not in text: raise SystemExit('missing import anchor')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          cache_anchor = "const courseDefinitions = new Map();\n"
          cache_line = "const lessonDefinitions = new Map();\n"
          if cache_line not in text:
              if cache_anchor not in text: raise SystemExit('missing cache anchor')
              text = text.replace(cache_anchor, cache_anchor + cache_line, 1)

          function_anchor = "export function createDevelopmentCredentialStore() {"
          lesson_loader = """function loadLessonDefinition(id) {
            if (!/^LESSON-[A-Z0-9-]+$/.test(String(id ?? ''))) return null;
            if (lessonDefinitions.has(id)) return lessonDefinitions.get(id);
            const target = path.join(root, 'content/lessons', `${id}.json`);
            if (!fs.existsSync(target)) return null;
            const definition = JSON.parse(fs.readFileSync(target, 'utf8'));
            if (definition?.id !== id) return null;
            lessonDefinitions.set(id, definition);
            return definition;
          }

          """
          if 'function loadLessonDefinition(id)' not in text:
              if function_anchor not in text: raise SystemExit('missing function anchor')
              text = text.replace(function_anchor, lesson_loader + function_anchor, 1)

          old = """        const lessonVersion = String(body.lessonVersion ?? '').trim();
                  const status = String(body.status ?? '').trim();
                  if (!/^\\d+$/.test(lessonVersion) || !['not-started', 'in-progress', 'completed'].includes(status)) return json(res, 400, { error: 'invalid-lesson-progress', requestId });
                  const progress = await learnerStore.setLessonProgress(auth.subject, { lessonId: lessonProgressMatch[1], lessonVersion, status });
          """
          new = """        const lessonVersion = String(body.lessonVersion ?? '').trim();
                  const status = String(body.status ?? '').trim();
                  if (!isValidCurriculumVersion(lessonVersion) || !['not-started', 'in-progress', 'completed'].includes(status)) return json(res, 400, { error: 'invalid-lesson-progress', requestId });
                  const lesson = loadLessonDefinition(lessonProgressMatch[1]);
                  if (!lesson) return json(res, 404, { error: 'lesson-not-found', requestId });
                  if (String(lesson.version) !== lessonVersion) return json(res, 409, { error: 'lesson-version-mismatch', currentVersion: String(lesson.version), requestId });
                  const progress = await learnerStore.setLessonProgress(auth.subject, { lessonId: lesson.id, lessonVersion, status });
          """
          if old not in text:
              raise SystemExit('lesson progress block anchor mismatch')
          text = text.replace(old, new, 1)
          server_path.write_text(text)

          test_path = Path('scripts/test-learner-progress-api.mjs')
          test = test_path.read_text()
          test = test.replace("body: JSON.stringify({ lessonVersion: '1', status: 'completed' })", "body: JSON.stringify({ lessonVersion: '1.0.0', status: 'completed' })", 1)
          invalid_anchor = """  response = await fetch(`${base}/api/v1/me/lessons/LESSON-ENV-VPD-001`, {
              method: 'PUT',
              headers: { authorization: 'Bearer alice', 'content-type': 'application/json' },
              body: JSON.stringify({ lessonVersion: '1', status: 'passed' })
            });
            assert.equal(response.status, 400);
            assert.equal((await response.json()).error, 'invalid-lesson-progress');
          """
          replacement = """  response = await fetch(`${base}/api/v1/me/lessons/LESSON-ENV-VPD-001`, {
              method: 'PUT',
              headers: { authorization: 'Bearer alice', 'content-type': 'application/json' },
              body: JSON.stringify({ lessonVersion: '1.0.0', status: 'passed' })
            });
            assert.equal(response.status, 400);
            assert.equal((await response.json()).error, 'invalid-lesson-progress');

            response = await fetch(`${base}/api/v1/me/lessons/LESSON-ENV-VPD-001`, {
              method: 'PUT',
              headers: { authorization: 'Bearer alice', 'content-type': 'application/json' },
              body: JSON.stringify({ lessonVersion: '1.0.1', status: 'completed' })
            });
            assert.equal(response.status, 409);
            let mismatch = await response.json();
            assert.equal(mismatch.error, 'lesson-version-mismatch');
            assert.equal(mismatch.currentVersion, '1.0.0');

            response = await fetch(`${base}/api/v1/me/lessons/LESSON-NOT-REAL-999`, {
              method: 'PUT',
              headers: { authorization: 'Bearer alice', 'content-type': 'application/json' },
              body: JSON.stringify({ lessonVersion: '1.0.0', status: 'completed' })
            });
            assert.equal(response.status, 404);
            assert.equal((await response.json()).error, 'lesson-not-found');
          """
          if invalid_anchor not in test:
              raise SystemExit('test anchor mismatch')
          test = test.replace(invalid_anchor, replacement, 1)
          test_path.write_text(test)

          workflow = Path('.github/workflows/patch-learner-progress-semver-temp.yml')
          workflow.unlink()
      - run: npm run api:learner-progress:test
      - name: Commit targeted patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.mjs scripts/test-learner-progress-api.mjs .github/workflows/patch-learner-progress-semver-temp.yml
          git commit -m "Fix learner progress semantic version contract"
          git push origin HEAD:fix/learner-progress-semver-api
