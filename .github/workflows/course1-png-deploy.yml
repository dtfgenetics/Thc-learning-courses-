name: Deploy approved Course 1 raster replacements

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'visuals/COURSE1-VISUAL-RELEASE-MANIFEST.json'
      - 'visuals/ASSET-REGISTRY.json'
      - 'visuals/review-candidates/course1/production-masters/**'
      - '.github/workflows/course1-png-deploy.yml'

permissions:
  contents: write

concurrency:
  group: course1-approved-raster-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage only explicitly approved repository candidates
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const manifest = JSON.parse(fs.readFileSync('visuals/COURSE1-VISUAL-RELEASE-MANIFEST.json', 'utf8'));
          const releaseRows = [...(manifest.concepts || []), ...(manifest.supportingReplacements || [])];
          const approved = releaseRows.filter((row) => row.releaseApproved === true);

          if (approved.length === 0) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'approved_count=0\n');
            console.log('No Course 1 raster candidate is releaseApproved=true. Nothing will be published.');
            process.exit(0);
          }

          let copied = 0;
          for (const row of approved) {
            const candidate = row.candidate || {};
            const source = candidate.repositoryPath;
            const targetPublicPath = candidate.targetPublicPath;

            if (!source || !targetPublicPath) {
              throw new Error(`${(row.conceptId || row.assetId)}: approved candidate requires repositoryPath and targetPublicPath`);
            }
            if (!source.startsWith('visuals/review-candidates/course1/production-masters/')) {
              throw new Error(`${(row.conceptId || row.assetId)}: source must be a governed repository production master`);
            }
            if (!targetPublicPath.startsWith('/assets/course1/')) {
              throw new Error(`${(row.conceptId || row.assetId)}: targetPublicPath must stay inside /assets/course1/`);
            }
            if (!/\.(png|webp|jpe?g)$/i.test(source) || !/\.(png|webp|jpe?g)$/i.test(targetPublicPath)) {
              throw new Error(`${(row.conceptId || row.assetId)}: only governed raster formats may be deployed`);
            }
            if (!fs.existsSync(source)) {
              throw new Error(`${(row.conceptId || row.assetId)}: approved repository candidate does not exist: ${source}`);
            }

            const target = path.join('apps/web/public', targetPublicPath);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.copyFileSync(source, target);
            copied += 1;
            console.log(`staged ${(row.conceptId || row.assetId)}: ${source} -> ${target}`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `approved_count=${copied}\n`);
          NODE

      - name: Validate staged raster files
        if: steps.stage.outputs.approved_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const manifest = JSON.parse(fs.readFileSync('visuals/COURSE1-VISUAL-RELEASE-MANIFEST.json', 'utf8'));
          const releaseRows = [...(manifest.concepts || []), ...(manifest.supportingReplacements || [])];
          const approved = releaseRows.filter((row) => row.releaseApproved === true);

          for (const row of approved) {
            const target = path.join('apps/web/public', row.candidate.targetPublicPath);
            const bytes = fs.readFileSync(target);
            if (bytes.length < 100000) throw new Error(`${(row.conceptId || row.assetId)}: staged raster is unexpectedly small`);

            const ext = path.extname(target).toLowerCase();
            if (ext === '.png') {
              const magic = bytes.subarray(0, 8).toString('hex');
              if (magic !== '89504e470d0a1a0a') throw new Error(`${(row.conceptId || row.assetId)}: invalid PNG signature`);
            }
          }
          console.log(`Validated ${approved.length} explicitly approved Course 1 raster replacement(s).`);
          NODE

      - name: Commit approved public raster replacements
        if: steps.stage.outputs.approved_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/web/public/assets/course1; then
            echo 'Approved public assets already match repository candidates.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/public/assets/course1
          git commit -m 'assets: publish approved Course 1 raster replacements'
          git push
