name: Patch assessment attempt persistence (temporary)

on:
  push:
    branches:
      - feat/assessment-attempt-persistence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/assessment-attempt-persistence
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply targeted persistence patch
        shell: python
        run: |
          from pathlib import Path

          store_path = Path('apps/api/src/postgres-learner-store.mjs')
          text = store_path.read_text()

          mapper_anchor = "export function createPostgresLearnerStore({ query } = {}) {\n"
          mapper_block = """function assessmentAttemptRow(row, itemRows = [], externalSubject = null) {
            if (!row) return null;
            return {
              id: row.id,
              learnerId: externalSubject,
              assessmentId: row.assessment_id,
              assessmentVersion: String(row.assessment_version),
              formId: row.form_id,
              formHash: row.form_hash,
              status: row.status,
              startedAt: row.started_at ? new Date(row.started_at).toISOString() : null,
              submittedAt: row.submitted_at ? new Date(row.submitted_at).toISOString() : null,
              scoredAt: row.scored_at ? new Date(row.scored_at).toISOString() : null,
              scorePercent: row.score_percent == null ? null : Number(row.score_percent),
              passed: row.passed == null ? null : Boolean(row.passed),
              items: itemRows.map((item) => ({
                position: Number(item.position),
                itemId: item.item_id,
                itemVersion: Number(item.item_version),
                competency: item.competency_id,
                response: item.response_json ?? null,
                score: item.score == null ? null : Number(item.score),
                maxScore: Number(item.max_score ?? 1)
              }))
            };
          }

          export function createPostgresLearnerStore({ query, withTransaction } = {}) {
          """
          if mapper_anchor in text:
              text = text.replace(mapper_anchor, mapper_block, 1)
          elif 'assessmentAttemptRow(row' not in text:
              raise SystemExit('store signature anchor missing')

          query_guard = "  if (typeof query !== 'function') throw new Error('PostgreSQL learner store requires a query(text, params) function');\n"
          tx_guard = "  if (typeof withTransaction !== 'function') throw new Error('PostgreSQL learner store requires withTransaction(callback)');\n"
          if tx_guard not in text:
              if query_guard not in text: raise SystemExit('query guard anchor missing')
              text = text.replace(query_guard, query_guard + tx_guard, 1)

          text = text.replace('  async function ensureLearner(externalSubject) {\n', '  async function ensureLearner(externalSubject, runQuery = query) {\n', 1)
          ensure_segment_start = text.index('  async function ensureLearner(')
          learner_id_start = text.index('  async function learnerIdForSubject', ensure_segment_start)
          ensure_segment = text[ensure_segment_start:learner_id_start]
          ensure_segment = ensure_segment.replace('      query,\n', '      runQuery,\n', 1)
          text = text[:ensure_segment_start] + ensure_segment + text[learner_id_start:]

          text = text.replace('  async function learnerIdForSubject(externalSubject) {\n', '  async function learnerIdForSubject(externalSubject, runQuery = query) {\n', 1)
          learner_start = text.index('  async function learnerIdForSubject(')
          return_start = text.index('  return {\n', learner_start)
          learner_segment = text[learner_start:return_start]
          learner_segment = learner_segment.replace('      query,\n', '      runQuery,\n', 1)
          helper_block = """
            async function loadAssessmentAttempt(runQuery, externalSubject, attemptId) {
              const attemptResult = await queryOrUnavailable(
                runQuery,
                `select a.id, a.assessment_id, a.assessment_version, a.form_id, a.form_hash, a.status,
                        a.started_at, a.submitted_at, a.scored_at, a.score_percent, a.passed
                   from learners l
                   join assessment_attempts a on a.learner_id = l.id
                  where l.external_subject = $1 and a.id = $2
                  limit 1`,
                [externalSubject, attemptId]
              );
              const row = attemptResult.rows?.[0];
              if (!row) return null;
              const itemResult = await queryOrUnavailable(
                runQuery,
                `select position, item_id, item_version, competency_id, response_json, score, max_score
                   from assessment_attempt_items
                  where attempt_id = $1
                  order by position asc`,
                [attemptId]
              );
              return assessmentAttemptRow(row, itemResult.rows ?? [], externalSubject);
            }

          """
          if 'async function loadAssessmentAttempt' not in text:
              learner_segment = learner_segment + helper_block
          text = text[:learner_start] + learner_segment + text[return_start:]

          method_anchor = '    async recordPerformanceAssessmentResult(externalSubject, record = {}) {\n'
          methods = """    async createAssessmentAttempt(externalSubject, attempt = {}) {
              if (!externalSubject) throw new Error('externalSubject required');
              if (!attempt?.id || !attempt.assessmentId || !attempt.assessmentVersion || !attempt.formId || !attempt.formHash) throw new Error('assessment attempt identity required');
              if (attempt.status !== 'started') throw new Error('new assessment attempt must be started');
              if (!Array.isArray(attempt.items) || attempt.items.length === 0) throw new Error('assessment attempt items required');
              for (const item of attempt.items) {
                if (!item.itemId || item.itemVersion == null) throw new Error('assessment attempt item identity required');
                if (!String(item.competency ?? '').trim()) throw new Error('competency required');
              }
              return withTransaction(async (runQuery) => {
                const learner = await ensureLearner(externalSubject, runQuery);
                if (!learner?.id) throw new Error('learner-resolution-failed');
                await queryOrUnavailable(
                  runQuery,
                  `insert into assessment_attempts (
                     id, learner_id, assessment_id, assessment_version, form_id, form_hash, status, started_at
                   ) values ($1, $2, $3, $4, $5, $6, $7, $8)
                   returning id, assessment_id, assessment_version, form_id, form_hash, status,
                             started_at, submitted_at, scored_at, score_percent, passed`,
                  [attempt.id, learner.id, attempt.assessmentId, String(attempt.assessmentVersion), attempt.formId, attempt.formHash, 'started', attempt.startedAt ?? new Date().toISOString()]
                );
                for (const item of attempt.items) {
                  await queryOrUnavailable(
                    runQuery,
                    `insert into assessment_attempt_items (
                       attempt_id, position, item_id, item_version, competency_id, response_json, score, max_score
                     ) values ($1, $2, $3, $4, $5, $6::jsonb, $7, $8)`,
                    [attempt.id, Number(item.position), item.itemId, Number(item.itemVersion), item.competency, item.response == null ? null : JSON.stringify(item.response), item.score ?? null, Number(item.maxScore ?? 1)]
                  );
                }
                return loadAssessmentAttempt(runQuery, externalSubject, attempt.id);
              });
            },
            async getAssessmentAttempt(externalSubject, attemptId) {
              if (!externalSubject) throw new Error('externalSubject required');
              if (!attemptId) throw new Error('attemptId required');
              return loadAssessmentAttempt(query, externalSubject, attemptId);
            },
            async saveSubmittedAssessmentAttempt(externalSubject, attempt = {}) {
              if (!externalSubject) throw new Error('externalSubject required');
              if (!attempt?.id || attempt.status !== 'submitted' || !attempt.submittedAt) throw new Error('submitted assessment attempt required');
              if (!Array.isArray(attempt.items) || attempt.items.length === 0) throw new Error('assessment attempt items required');
              return withTransaction(async (runQuery) => {
                const learnerId = await learnerIdForSubject(externalSubject, runQuery);
                if (!learnerId) throw new Error('assessment-attempt-transition-conflict');
                const parent = await queryOrUnavailable(
                  runQuery,
                  `update assessment_attempts
                      set status = 'submitted', submitted_at = $3
                    where id = $1 and learner_id = $2 and status = 'started'
                    returning id, assessment_id, assessment_version, form_id, form_hash, status,
                              started_at, submitted_at, scored_at, score_percent, passed`,
                  [attempt.id, learnerId, attempt.submittedAt]
                );
                if (parent.rowCount !== 1) throw new Error('assessment-attempt-transition-conflict');
                for (const item of attempt.items) {
                  const updated = await queryOrUnavailable(
                    runQuery,
                    `update assessment_attempt_items
                        set response_json = $4::jsonb
                      where attempt_id = $1 and item_id = $2 and item_version = $3`,
                    [attempt.id, item.itemId, Number(item.itemVersion), item.response == null ? null : JSON.stringify(item.response)]
                  );
                  if (updated.rowCount !== 1) throw new Error(`assessment-attempt-item-mismatch:${item.itemId}@${item.itemVersion}`);
                }
                return loadAssessmentAttempt(runQuery, externalSubject, attempt.id);
              });
            },
            async saveScoredAssessmentAttempt(externalSubject, attempt = {}) {
              if (!externalSubject) throw new Error('externalSubject required');
              if (!attempt?.id || attempt.status !== 'scored' || !attempt.scoredAt) throw new Error('scored assessment attempt required');
              if (!Array.isArray(attempt.items) || attempt.items.length === 0) throw new Error('assessment attempt items required');
              const scorePercent = Number(attempt.scorePercent);
              if (!Number.isFinite(scorePercent) || scorePercent < 0 || scorePercent > 100) throw new Error('scorePercent must be between 0 and 100');
              if (typeof attempt.passed !== 'boolean') throw new Error('passed boolean required');
              return withTransaction(async (runQuery) => {
                const learnerId = await learnerIdForSubject(externalSubject, runQuery);
                if (!learnerId) throw new Error('assessment-attempt-transition-conflict');
                for (const item of attempt.items) {
                  if (item.score == null || !Number.isFinite(Number(item.score))) throw new Error(`assessment item score required:${item.itemId}`);
                  const updated = await queryOrUnavailable(
                    runQuery,
                    `update assessment_attempt_items
                        set score = $4
                      where attempt_id = $1 and item_id = $2 and item_version = $3`,
                    [attempt.id, item.itemId, Number(item.itemVersion), Number(item.score)]
                  );
                  if (updated.rowCount !== 1) throw new Error(`assessment-attempt-item-mismatch:${item.itemId}@${item.itemVersion}`);
                }
                const parent = await queryOrUnavailable(
                  runQuery,
                  `update assessment_attempts
                      set status = 'scored', scored_at = $3, score_percent = $4, passed = $5
                    where id = $1 and learner_id = $2 and status = 'submitted'
                    returning id, assessment_id, assessment_version, form_id, form_hash, status,
                              started_at, submitted_at, scored_at, score_percent, passed`,
                  [attempt.id, learnerId, attempt.scoredAt, scorePercent, attempt.passed]
                );
                if (parent.rowCount !== 1) throw new Error('assessment-attempt-transition-conflict');
                return loadAssessmentAttempt(runQuery, externalSubject, attempt.id);
              });
            },
          """
          if 'async createAssessmentAttempt' not in text:
              if method_anchor not in text: raise SystemExit('record performance method anchor missing')
              text = text.replace(method_anchor, methods + method_anchor, 1)
          store_path.write_text(text)

          adapter_path = Path('apps/api/src/postgres-persistence-adapter.mjs')
          adapter = adapter_path.read_text()
          old = 'learnerStore: createPostgresLearnerStore({ query }),'
          new = 'learnerStore: createPostgresLearnerStore({ query, withTransaction }),' 
          if old in adapter:
              adapter = adapter.replace(old, new, 1)
          elif new not in adapter:
              raise SystemExit('learner adapter anchor missing')
          adapter_path.write_text(adapter)

          package_path = Path('package.json')
          package_text = package_path.read_text()
          script_anchor = '    "production:persistence:test": "node scripts/test-production-persistence-adapter.mjs",\n'
          script_line = '    "assessment:persistence:test": "node scripts/test-assessment-attempt-persistence.mjs",\n'
          if script_line not in package_text:
              if script_anchor not in package_text: raise SystemExit('package script anchor missing')
              package_text = package_text.replace(script_anchor, script_anchor + script_line, 1)
          chain_anchor = 'npm run production:persistence:test && npm run api:learner-progress:test'
          chain_new = 'npm run production:persistence:test && npm run assessment:persistence:test && npm run api:learner-progress:test'
          if chain_new not in package_text:
              if chain_anchor not in package_text: raise SystemExit('package chain anchor missing')
              package_text = package_text.replace(chain_anchor, chain_new, 1)
          package_path.write_text(package_text)

          prod_test_path = Path('scripts/test-production-persistence-adapter.mjs')
          prod_test = prod_test_path.read_text()
          assertion_anchor = "assert.equal(typeof adapters.learnerStore.recordPerformanceAssessmentResult, 'function');\n"
          assertion_lines = """assert.equal(typeof adapters.learnerStore.createAssessmentAttempt, 'function');
          assert.equal(typeof adapters.learnerStore.getAssessmentAttempt, 'function');
          assert.equal(typeof adapters.learnerStore.saveSubmittedAssessmentAttempt, 'function');
          assert.equal(typeof adapters.learnerStore.saveScoredAssessmentAttempt, 'function');
          """
          if "adapters.learnerStore.createAssessmentAttempt" not in prod_test:
              if assertion_anchor not in prod_test: raise SystemExit('production test assertion anchor missing')
              prod_test = prod_test.replace(assertion_anchor, assertion_anchor + assertion_lines, 1)
          prod_test_path.write_text(prod_test)

          Path('.github/workflows/patch-assessment-attempt-persistence-temp.yml').unlink()
      - run: npm run assessment:persistence:test
      - run: npm run production:persistence:test
      - name: Commit persistence implementation and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/postgres-learner-store.mjs apps/api/src/postgres-persistence-adapter.mjs package.json scripts/test-assessment-attempt-persistence.mjs scripts/test-production-persistence-adapter.mjs .github/workflows/patch-assessment-attempt-persistence-temp.yml
          git commit -m "Persist assessment attempt lifecycle atomically"
          git push origin HEAD:feat/assessment-attempt-persistence
