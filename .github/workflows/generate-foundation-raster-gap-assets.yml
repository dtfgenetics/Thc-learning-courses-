name: Generate foundation raster gap assets

on:
  push:
    branches:
      - feat/continuous-lesson-gap-audit-20261003
    paths:
      - scripts/generate-foundation-raster-gap-assets.py
      - .github/workflows/generate-foundation-raster-gap-assets.yml

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated-foundation-visuals]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/continuous-lesson-gap-audit-20261003
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate and wire visual assets
        run: python scripts/generate-foundation-raster-gap-assets.py
      - name: Verify generated WebP files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files=list(Path('apps/web/public/assets').glob('course*/foundation-*.webp'))
          if len(files) < 10:
              raise SystemExit(f'Expected at least 10 generated foundation WebPs, found {len(files)}')
          for p in files:
              with Image.open(p) as im:
                  if im.format != 'WEBP' or min(im.size) < 1600:
                      raise SystemExit(f'Invalid generated raster {p}: {im.format} {im.size}')
          print(f'Validated {len(files)} generated foundation WebPs.')
          PY
      - name: Commit generated binaries and metadata
        run: |
          git config user.name "dtf-course-automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/public/assets/course3/foundation-*.webp \
                  apps/web/public/assets/course4/foundation-*.webp \
                  apps/web/public/assets/course5/foundation-*.webp \
                  apps/web/public/assets/course6/foundation-*.webp \
                  visuals/COURSE3-ASSET-REGISTRY.json visuals/COURSE4-ASSET-REGISTRY.json \
                  visuals/COURSE5-ASSET-REGISTRY.json visuals/COURSE6-ASSET-REGISTRY.json \
                  content/lessons/LESSON-LIGHT-001.json \
                  content/lessons/LESSON-LIGHT-DLI-003.json \
                  content/lessons/LESSON-ROOTZONE-001.json \
                  content/lessons/LESSON-ROOTZONE-MEDIA-002.json \
                  content/lessons/LESSON-NUTRITION-MACRO-002.json \
                  content/lessons/LESSON-PROP-CLONE-003.json \
                  content/lessons/LESSON-CANOPY-LST-002.json \
                  content/lessons/LESSON-CANOPY-HST-003.json \
                  content/lessons/LESSON-IPM-001.json \
                  content/lessons/LESSON-POSTHARVEST-STORAGE-003.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Produce remaining foundation raster visuals [generated-foundation-visuals]"
          git push origin HEAD:feat/continuous-lesson-gap-audit-20261003
