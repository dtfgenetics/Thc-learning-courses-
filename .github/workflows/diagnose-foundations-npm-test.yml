name: Diagnose Foundations npm test

on:
  push:
    branches: [content/foundations-depth-completion-01]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build working curriculum registry
        run: npm run registry:build
      - name: Capture complete npm test output
        shell: bash
        run: |
          set +e
          npm test > npm-test.log 2>&1
          status=$?
          echo "$status" > npm-test-exit.txt
          tail -n 250 npm-test.log
          exit 0
      - name: Upload npm test diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: foundations-npm-test-diagnostic
          path: |
            npm-test.log
            npm-test-exit.txt
          if-no-files-found: error
      - name: Preserve npm test result
        shell: bash
        run: exit "$(cat npm-test-exit.txt)"
