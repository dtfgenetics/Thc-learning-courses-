name: Build Technician I program release readiness once

on:
  push:
    branches: [feat/tech1-program-release-readiness]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Patch Technician I program release-readiness integration
        run: node scripts/build-tech1-program-release-readiness.mjs
      - name: Rebuild curriculum registry
        run: npm run registry:build
      - name: Validate Technician I release-readiness contract
        run: |
          npm run schema:validate
          npm run validate
          npm run registry:validate
          npm run tech1:program:test
          npm run tech1:course7:test
          npm run tech1:release-readiness:test
          npm run tech1:release-readiness
      - name: Run complete deterministic suite
        run: npm test
      - name: Commit validated Technician I program closeout source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-tech1-program-release-readiness-once.yml scripts/build-tech1-program-release-readiness.mjs
          git add content package.json registry scripts
          git commit -m "feat: harden Technician I program release readiness"
          git push origin HEAD:feat/tech1-program-release-readiness
