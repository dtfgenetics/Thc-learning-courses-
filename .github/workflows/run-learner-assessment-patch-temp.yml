name: Run learner assessment patch temporary

on:
  push:
    branches:
      - feat/learner-assessment-api

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/learner-assessment-api
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: python scripts/patch-learner-assessment-api-temp.py
      - run: npm run assessment:delivery:test
      - run: npm run api:learner-assessment:test
      - name: Commit permanent integration
        run: |
          rm .github/workflows/patch-learner-assessment-api-temp.yml
          rm .github/workflows/run-learner-assessment-patch-temp.yml
          rm scripts/patch-learner-assessment-api-temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.mjs package.json apps/api/src/assessment-delivery.mjs scripts/test-assessment-delivery-service.mjs scripts/test-learner-assessment-api.mjs .github/workflows/patch-learner-assessment-api-temp.yml .github/workflows/run-learner-assessment-patch-temp.yml scripts/patch-learner-assessment-api-temp.py
          git commit -m "Expose secure learner assessment lifecycle API"
          git push origin HEAD:feat/learner-assessment-api
