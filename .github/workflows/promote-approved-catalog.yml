name: Promote approved catalog

on:
  push:
    branches: [chore/promote-approved-catalog]
    paths:
      - .github/workflows/promote-approved-catalog.yml
      - scripts/promote-approved-catalog.mjs

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/promote-approved-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked validation dependencies
        run: npm ci --no-audit --no-fund
      - name: Preview approved catalog promotion
        run: node scripts/promote-approved-catalog.mjs
      - name: Apply approved catalog promotion
        run: node scripts/promote-approved-catalog.mjs --write --confirm-approved
      - name: Rebuild working curriculum registry
        run: npm run registry:build
      - name: Run complete curriculum and credential suite
        run: npm test
      - name: Commit promoted lifecycle state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content registry
          git diff --cached --exit-code && { echo "No promotion changes to commit"; exit 1; } || true
          git commit -m "Promote human-approved catalog lifecycle"
          git push origin HEAD:chore/promote-approved-catalog
