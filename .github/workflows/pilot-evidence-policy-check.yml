name: Pilot evidence quality policy check

on:
  push:
    branches: [feat/pilot-evidence-quality-policy]
    paths:
      - registry/pilot-evidence-policy.json
      - scripts/pilot-evidence-quality.mjs
      - scripts/test-pilot-evidence-quality-policy.mjs
      - scripts/validate-pilot-evidence.mjs
      - scripts/report-pilot-readiness.mjs
      - .github/workflows/pilot-evidence-policy-check.yml

permissions:
  contents: read

jobs:
  pilot-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/test-pilot-evidence-quality-policy.mjs
      - run: node scripts/validate-pilot-evidence.mjs
      - run: node scripts/report-pilot-readiness.mjs
