name: Sync Course1 convergence into dev once

on:
  push:
    branches:
      - sync/course1-convergence-into-dev

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Port validated Course 1 convergence from staging
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin staging
          git checkout origin/staging -- \
            .github/workflows/course1-png-deploy.yml \
            .github/workflows/validate.yml \
            apps/web/public/assets/course1/data-integrity-record-lifecycle.svg \
            apps/web/public/assets/course1/maintenance-fault-report.svg \
            apps/web/public/assets/course1/operator-care-servicing-boundary.svg \
            apps/web/public/assets/course1/shift-handoff-model.svg \
            content/lessons/LESSON-LH-TECH1-001-16.json \
            docs/learning-hub/tech1/course-001/COURSE1-LESSON-PRACTICE-MAP.json \
            docs/learning-hub/tech1/course-001/assets/visuals/COURSE1-VISUAL-FINAL-CANDIDATES-13-18.md \
            scripts/check-course1-project-alignment.mjs \
            scripts/check-course1-visual-concept-coverage.mjs \
            visuals/COURSE1-PNG-DEPLOYMENT-STAGING.json \
            visuals/COURSE1-VISUAL-CONCEPT-COVERAGE.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild generated registry from combined dev content
        run: |
          npm run course1:publication:sync
          npm run registry:build
      - name: Verify combined Course 1 gates
        run: |
          node scripts/check-course1-project-alignment.mjs
          node scripts/check-course1-visual-concept-coverage.mjs
      - name: Run complete deterministic suite on combined content
        run: npm test
      - name: Commit combined tree and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-course1-convergence-into-dev-once.yml
          git add .github/workflows/course1-png-deploy.yml \
            .github/workflows/validate.yml \
            apps/web/public/assets/course1/data-integrity-record-lifecycle.svg \
            apps/web/public/assets/course1/maintenance-fault-report.svg \
            apps/web/public/assets/course1/operator-care-servicing-boundary.svg \
            apps/web/public/assets/course1/shift-handoff-model.svg \
            content/lessons/LESSON-LH-TECH1-001-16.json \
            docs/learning-hub/tech1/course-001/COURSE1-LESSON-PRACTICE-MAP.json \
            docs/learning-hub/tech1/course-001/assets/visuals/COURSE1-VISUAL-FINAL-CANDIDATES-13-18.md \
            scripts/check-course1-project-alignment.mjs \
            scripts/check-course1-visual-concept-coverage.mjs \
            visuals/COURSE1-PNG-DEPLOYMENT-STAGING.json \
            visuals/COURSE1-VISUAL-CONCEPT-COVERAGE.json \
            registry/curriculum.json
          git commit -m 'Sync repaired Course 1 convergence into dev'
          git push origin HEAD:sync/course1-convergence-into-dev
