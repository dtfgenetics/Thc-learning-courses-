<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" role="img" aria-labelledby="title desc">
  <title id="title">Photo evidence audit practice worksheet</title>
  <desc id="desc">Printable learner worksheet with four simplified example crop-photo sets to evaluate for context, whole-plant coverage, close detail, identity and time, comparison value, lighting consistency, image fidelity, and whether a retake or additional image is needed.</desc>
  <rect width="816" height="1056" fill="#ffffff"/>
  <text x="42" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#173d2b">Photo Evidence Audit Practice</text>
  <text x="42" y="88" font-family="Arial, sans-serif" font-size="15" fill="#365b48">Course 2 • Lesson 4 • Evaluate evidence quality before drawing conclusions.</text>
  <line x1="42" y1="108" x2="774" y2="108" stroke="#6f927d" stroke-width="2"/>

  <text x="42" y="137" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#173d2b">Learner:</text>
  <line x1="110" y1="139" x2="330" y2="139" stroke="#9aa9a0"/>
  <text x="360" y="137" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#173d2b">Date:</text>
  <line x1="405" y1="139" x2="555" y2="139" stroke="#9aa9a0"/>
  <text x="585" y="137" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#173d2b">Scenario:</text>
  <line x1="660" y1="139" x2="774" y2="139" stroke="#9aa9a0"/>

  <text x="42" y="177" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#173d2b">Instructions</text>
  <text x="42" y="200" font-family="Arial, sans-serif" font-size="14" fill="#365b48">For each example, decide what the image set supports, what is missing, and what should be retaken or added.</text>
  <text x="42" y="221" font-family="Arial, sans-serif" font-size="14" fill="#365b48">Do not diagnose the plant. Audit the quality and reconstructability of the photographic evidence.</text>

  <!-- Set A -->
  <rect x="42" y="250" width="350" height="260" rx="16" fill="#f7f4e8" stroke="#6f927d" stroke-width="2"/>
  <text x="58" y="279" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173d2b">Set A — Close-up only</text>
  <rect x="60" y="295" width="145" height="125" rx="10" fill="#eaf1ec" stroke="#5c7d69"/>
  <path d="M133 403 C92 370 95 320 133 305 C171 320 174 370 133 403 Z" fill="#8db79b" stroke="#365b48" stroke-width="2"/>
  <circle cx="118" cy="350" r="12" fill="none" stroke="#b36b32" stroke-width="4"/>
  <text x="222" y="318" font-family="Arial, sans-serif" font-size="13" fill="#365b48">Known:</text>
  <text x="222" y="340" font-family="Arial, sans-serif" font-size="13" fill="#365b48">• sharp close detail</text>
  <text x="222" y="362" font-family="Arial, sans-serif" font-size="13" fill="#365b48">• no room/plant identity</text>
  <text x="222" y="384" font-family="Arial, sans-serif" font-size="13" fill="#365b48">• no context/whole-plant view</text>
  <text x="58" y="447" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173d2b">What should be added or retaken?</text>
  <line x1="58" y1="470" x2="375" y2="470" stroke="#9aa9a0"/>
  <line x1="58" y1="493" x2="375" y2="493" stroke="#9aa9a0"/>

  <!-- Set B -->
  <rect x="424" y="250" width="350" height="260" rx="16" fill="#f7f4e8" stroke="#6f927d" stroke-width="2"/>
  <text x="440" y="279" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173d2b">Set B — Context without detail</text>
  <rect x="442" y="295" width="145" height="125" rx="10" fill="#eaf1ec" stroke="#5c7d69"/>
  <g fill="#8db79b" stroke="#365b48"><circle cx="472" cy="330" r="12"/><circle cx="515" cy="330" r="12"/><circle cx="558" cy="330" r="12"/><circle cx="472" cy="378" r="12"/><circle cx="515" cy="378" r="12"/><circle cx="558" cy="378" r="12"/></g>
  <text x="604" y="318" font-family="Arial, sans-serif" font-size="13" fill="#365b48">Known:</text>
  <text x="604" y="340" font-family="Arial, sans-serif" font-size="13" fill="#365b48">• room/zone visible</text>
  <text x="604" y="362" font-family="Arial, sans-serif" font-size="13" fill="#365b48">• distribution partly visible</text>
  <text x="604" y="384" font-family="Arial, sans-serif" font-size="13" fill="#365b48">• feature too small to review</text>
  <text x="440" y="447" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173d2b">What additional view would improve evidence?</text>
  <line x1="440" y1="470" x2="757" y2="470" stroke="#9aa9a0"/>
  <line x1="440" y1="493" x2="757" y2="493" stroke="#9aa9a0"/>

  <!-- Set C -->
  <rect x="42" y="530" width="350" height="260" rx="16" fill="#f7f4e8" stroke="#6f927d" stroke-width="2"/>
  <text x="58" y="559" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173d2b">Set C — Complete sequence</text>
  <g>
    <rect x="58" y="575" width="90" height="90" rx="8" fill="#eaf1ec" stroke="#5c7d69"/><g fill="#8db79b" stroke="#365b48"><circle cx="80" cy="605" r="8"/><circle cx="105" cy="605" r="8"/><circle cx="130" cy="605" r="8"/><circle cx="80" cy="638" r="8"/><circle cx="105" cy="638" r="8"/><circle cx="130" cy="638" r="8"/></g>
    <rect x="160" y="575" width="90" height="90" rx="8" fill="#eaf1ec" stroke="#5c7d69"/><line x1="205" y1="650" x2="205" y2="600" stroke="#365b48" stroke-width="4"/><line x1="205" y1="615" x2="185" y2="603" stroke="#365b48" stroke-width="3"/><line x1="205" y1="628" x2="225" y2="615" stroke="#365b48" stroke-width="3"/>
    <rect x="262" y="575" width="90" height="90" rx="8" fill="#eaf1ec" stroke="#5c7d69"/><path d="M307 648 C280 625 282 592 307 582 C332 592 334 625 307 648 Z" fill="#8db79b" stroke="#365b48" stroke-width="2"/><circle cx="297" cy="616" r="8" fill="none" stroke="#b36b32" stroke-width="3"/>
  </g>
  <text x="58" y="692" font-family="Arial, sans-serif" font-size="13" fill="#365b48">Context → representative whole plant → close detail</text>
  <text x="58" y="716" font-family="Arial, sans-serif" font-size="13" fill="#365b48">Identity/time supplied; similar lighting; original files retained.</text>
  <text x="58" y="750" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173d2b">What does this set support—and what does it still not prove?</text>
  <line x1="58" y1="773" x2="375" y2="773" stroke="#9aa9a0"/>

  <!-- Set D -->
  <rect x="424" y="530" width="350" height="260" rx="16" fill="#fffaf0" stroke="#b36b32" stroke-width="2"/>
  <text x="440" y="559" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#6d3c18">Set D — Altered color</text>
  <rect x="442" y="575" width="145" height="125" rx="10" fill="#efe2c8" stroke="#b36b32"/>
  <path d="M514 685 C474 652 476 602 514 587 C552 602 554 652 514 685 Z" fill="#c6aa45" stroke="#6d3c18" stroke-width="2"/>
  <text x="604" y="598" font-family="Arial, sans-serif" font-size="13" fill="#5f4a3c">Known:</text>
  <text x="604" y="620" font-family="Arial, sans-serif" font-size="13" fill="#5f4a3c">• strong color adjustment used</text>
  <text x="604" y="642" font-family="Arial, sans-serif" font-size="13" fill="#5f4a3c">• original not attached</text>
  <text x="604" y="664" font-family="Arial, sans-serif" font-size="13" fill="#5f4a3c">• color is part of observation</text>
  <text x="440" y="727" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#6d3c18">Retain, retake, or use with limitation?</text>
  <line x1="440" y1="750" x2="757" y2="750" stroke="#9aa9a0"/>
  <line x1="440" y1="773" x2="757" y2="773" stroke="#9aa9a0"/>

  <rect x="42" y="812" width="732" height="160" rx="16" fill="#eaf1ec" stroke="#5c7d69" stroke-width="2"/>
  <text x="58" y="842" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173d2b">Audit checklist — mark Yes / No / Needs follow-up</text>
  <text x="58" y="870" font-family="Arial, sans-serif" font-size="13" fill="#365b48">□ Context/location is understandable   □ Representative whole-plant view exists   □ Relevant close detail is sharp</text>
  <text x="58" y="897" font-family="Arial, sans-serif" font-size="13" fill="#365b48">□ Crop/plant identity and time are linked   □ Comparison view adds value when needed   □ Lighting is usable/consistent</text>
  <text x="58" y="924" font-family="Arial, sans-serif" font-size="13" fill="#365b48">□ No edit materially changes evidence   □ Original file is preserved   □ Retake/additional image need is documented</text>
  <text x="58" y="951" font-family="Arial, sans-serif" font-size="13" fill="#365b48">□ The record states what the images show without treating photographs alone as diagnostic proof</text>

  <text x="42" y="1002" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#173d2b">Reviewer / receiving-person question:</text>
  <text x="42" y="1025" font-family="Arial, sans-serif" font-size="13" fill="#365b48">What additional evidence would you request before making a stronger interpretation?</text>
  <line x1="405" y1="1027" x2="774" y2="1027" stroke="#9aa9a0"/>

  <text x="42" y="1048" font-family="Arial, sans-serif" font-size="10" fill="#56685e">Teaching worksheet. Example drawings are synthetic and do not represent a diagnosis. Exact photo/record requirements remain procedure-specific.</text>
</svg>
