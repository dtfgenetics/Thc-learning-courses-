<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Representative crop-walk route and sample context</title>
  <desc id="desc">A simplified cultivation room diagram showing a repeatable observation route crossing edge, center, and process zones, with numbered observation points and an example record of four affected plants out of twenty-four inspected. The diagram emphasizes that exact route and sample size follow the facility plan.</desc>
  <rect width="1200" height="720" rx="32" fill="#f7f4e8"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#173d2b">Representative crop walk: route + denominator + location</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="20" fill="#365b48">Observe the crop systematically before making a room-level statement.</text>

  <rect x="60" y="145" width="780" height="470" rx="24" fill="#ffffff" stroke="#5c7d69" stroke-width="4"/>
  <text x="85" y="185" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173d2b">ROOM / ZONE MAP</text>
  <line x1="320" y1="145" x2="320" y2="615" stroke="#d7dfd9" stroke-width="3"/>
  <line x1="580" y1="145" x2="580" y2="615" stroke="#d7dfd9" stroke-width="3"/>
  <text x="180" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5a6d61">Zone A</text>
  <text x="450" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5a6d61">Zone B</text>
  <text x="710" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5a6d61">Zone C</text>

  <g fill="#8db79b" stroke="#365b48" stroke-width="2">
    <circle cx="145" cy="235" r="20"/><circle cx="225" cy="235" r="20"/><circle cx="405" cy="235" r="20"/><circle cx="485" cy="235" r="20"/><circle cx="665" cy="235" r="20"/><circle cx="745" cy="235" r="20"/>
    <circle cx="145" cy="335" r="20"/><circle cx="225" cy="335" r="20"/><circle cx="405" cy="335" r="20"/><circle cx="485" cy="335" r="20"/><circle cx="665" cy="335" r="20"/><circle cx="745" cy="335" r="20"/>
    <circle cx="145" cy="435" r="20"/><circle cx="225" cy="435" r="20"/><circle cx="405" cy="435" r="20"/><circle cx="485" cy="435" r="20"/><circle cx="665" cy="435" r="20"/><circle cx="745" cy="435" r="20"/>
    <circle cx="145" cy="535" r="20"/><circle cx="225" cy="535" r="20"/><circle cx="405" cy="535" r="20"/><circle cx="485" cy="535" r="20"/><circle cx="665" cy="535" r="20"/><circle cx="745" cy="535" r="20"/>
  </g>

  <polyline points="100,520 145,435 225,335 405,235 485,335 665,435 745,535 790,420 745,235 665,335 485,435 405,535 225,435 145,235" fill="none" stroke="#b36b32" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 12"/>
  <g fill="#173d2b" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="145" cy="435" r="15" fill="#ffffff" stroke="#173d2b" stroke-width="3"/><text x="145" y="441">1</text>
    <circle cx="405" cy="235" r="15" fill="#ffffff" stroke="#173d2b" stroke-width="3"/><text x="405" y="241">2</text>
    <circle cx="665" cy="435" r="15" fill="#ffffff" stroke="#173d2b" stroke-width="3"/><text x="665" y="441">3</text>
    <circle cx="745" cy="235" r="15" fill="#ffffff" stroke="#173d2b" stroke-width="3"/><text x="745" y="241">4</text>
    <circle cx="485" cy="435" r="15" fill="#ffffff" stroke="#173d2b" stroke-width="3"/><text x="485" y="441">5</text>
    <circle cx="225" cy="435" r="15" fill="#ffffff" stroke="#173d2b" stroke-width="3"/><text x="225" y="441">6</text>
  </g>
  <text x="90" y="640" font-family="Arial, sans-serif" font-size="17" fill="#365b48">Example only: the actual route and sample size come from the supplied facility plan.</text>

  <rect x="875" y="145" width="265" height="205" rx="22" fill="#eaf1ec" stroke="#5c7d69" stroke-width="3"/>
  <text x="905" y="190" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173d2b">Record the denominator</text>
  <text x="905" y="248" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#173d2b">4 / 24</text>
  <text x="905" y="282" font-family="Arial, sans-serif" font-size="18" fill="#365b48">affected / inspected</text>
  <text x="905" y="318" font-family="Arial, sans-serif" font-size="16" fill="#365b48">A count without the number inspected</text>
  <text x="905" y="342" font-family="Arial, sans-serif" font-size="16" fill="#365b48">cannot describe the sampled proportion.</text>

  <rect x="875" y="380" width="265" height="235" rx="22" fill="#fffaf0" stroke="#b36b32" stroke-width="3"/>
  <text x="905" y="425" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#6d3c18">Before a room-level claim</text>
  <text x="905" y="466" font-family="Arial, sans-serif" font-size="17" fill="#5f4a3c">• Confirm purpose and identity</text>
  <text x="905" y="500" font-family="Arial, sans-serif" font-size="17" fill="#5f4a3c">• Follow a representative route</text>
  <text x="905" y="534" font-family="Arial, sans-serif" font-size="17" fill="#5f4a3c">• Preserve location and pattern</text>
  <text x="905" y="568" font-family="Arial, sans-serif" font-size="17" fill="#5f4a3c">• Record number inspected</text>
  <text x="905" y="602" font-family="Arial, sans-serif" font-size="17" fill="#5f4a3c">• Keep abnormal follow-ups separate</text>

  <text x="60" y="690" font-family="Arial, sans-serif" font-size="16" fill="#56685e">Teaching diagram — not a universal sampling prescription.</text>
</svg>
