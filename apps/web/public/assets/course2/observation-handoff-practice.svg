<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" role="img" aria-labelledby="title desc">
  <title id="title">Observation record and handoff practice worksheet</title>
  <desc id="desc">Printable worksheet for practicing reconstructable crop records and shift handoffs, with fields for identity, timing, developmental context, direct observations, spatial pattern, photo evidence, relevant context, actions, uncertainty, escalation, next check, receiving-person cross-check, and correction history.</desc>
  <rect width="816" height="1056" fill="#fffdf5"/>
  <text x="48" y="58" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#173d2b">Observation Record &amp; Handoff Practice</text>
  <text x="48" y="88" font-family="Arial, sans-serif" font-size="15" fill="#365b48">Course 2 practice sheet — preserve enough evidence and continuity for another qualified person to reconstruct the work.</text>

  <g font-family="Arial, sans-serif" fill="#173d2b" font-size="14">
    <text x="48" y="130" font-weight="700">Room/zone:</text><line x1="128" y1="134" x2="300" y2="134" stroke="#657b6c"/>
    <text x="330" y="130" font-weight="700">Crop / lot / plant ID:</text><line x1="470" y1="134" x2="768" y2="134" stroke="#657b6c"/>
    <text x="48" y="162" font-weight="700">Observation date/time:</text><line x1="185" y1="166" x2="385" y2="166" stroke="#657b6c"/>
    <text x="415" y="162" font-weight="700">Developmental context:</text><line x1="572" y1="166" x2="768" y2="166" stroke="#657b6c"/>
  </g>

  <rect x="48" y="195" width="720" height="142" rx="16" fill="#ffffff" stroke="#6f927d" stroke-width="2"/>
  <text x="64" y="225" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173d2b">1. Direct observation and pattern</text>
  <text x="64" y="250" font-family="Arial, sans-serif" font-size="13" fill="#56685e">Write what was seen/measured before assigning a cause.</text>
  <line x1="64" y1="278" x2="752" y2="278" stroke="#98aa9e"/><line x1="64" y1="304" x2="752" y2="304" stroke="#98aa9e"/>
  <text x="64" y="326" font-family="Arial, sans-serif" font-size="12" fill="#365b48">Sample: _____ inspected   Finding count: _____   Pattern: ________________________________</text>

  <rect x="48" y="358" width="720" height="132" rx="16" fill="#ffffff" stroke="#6f927d" stroke-width="2"/>
  <text x="64" y="388" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173d2b">2. Photo evidence</text>
  <text x="64" y="416" font-family="Arial, sans-serif" font-size="13" fill="#365b48">Context view:</text><rect x="150" y="402" width="14" height="14" fill="none" stroke="#657b6c"/>
  <text x="190" y="416" font-family="Arial, sans-serif" font-size="13" fill="#365b48">Whole-plant view:</text><rect x="305" y="402" width="14" height="14" fill="none" stroke="#657b6c"/>
  <text x="345" y="416" font-family="Arial, sans-serif" font-size="13" fill="#365b48">Close detail:</text><rect x="430" y="402" width="14" height="14" fill="none" stroke="#657b6c"/>
  <text x="470" y="416" font-family="Arial, sans-serif" font-size="13" fill="#365b48">Comparison:</text><rect x="550" y="402" width="14" height="14" fill="none" stroke="#657b6c"/>
  <text x="590" y="416" font-family="Arial, sans-serif" font-size="13" fill="#365b48">Identity/time linked:</text><rect x="704" y="402" width="14" height="14" fill="none" stroke="#657b6c"/>
  <text x="64" y="452" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173d2b">Photo notes / limitations:</text>
  <line x1="215" y1="456" x2="752" y2="456" stroke="#98aa9e"/><line x1="64" y1="478" x2="752" y2="478" stroke="#98aa9e"/>

  <rect x="48" y="511" width="720" height="128" rx="16" fill="#ffffff" stroke="#6f927d" stroke-width="2"/>
  <text x="64" y="541" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173d2b">3. Relevant context — not automatic proof of cause</text>
  <text x="64" y="568" font-family="Arial, sans-serif" font-size="13" fill="#56685e">Examples: recent work, environmental readings, schedule context, supplied process history.</text>
  <line x1="64" y1="596" x2="752" y2="596" stroke="#98aa9e"/><line x1="64" y1="622" x2="752" y2="622" stroke="#98aa9e"/>

  <rect x="48" y="660" width="720" height="155" rx="16" fill="#ffffff" stroke="#6f927d" stroke-width="2"/>
  <text x="64" y="690" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173d2b">4. Action, escalation, and uncertainty</text>
  <text x="64" y="721" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173d2b">What was checked or done?</text><line x1="225" y1="725" x2="752" y2="725" stroke="#98aa9e"/>
  <text x="64" y="751" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173d2b">Who was notified?</text><line x1="178" y1="755" x2="752" y2="755" stroke="#98aa9e"/>
  <text x="64" y="781" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173d2b">What remains unresolved?</text><line x1="225" y1="785" x2="752" y2="785" stroke="#98aa9e"/>

  <rect x="48" y="836" width="720" height="146" rx="16" fill="#eef4ef" stroke="#5c7d69" stroke-width="2"/>
  <text x="64" y="866" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173d2b">5. Shift handoff and next check</text>
  <text x="64" y="895" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173d2b">Priority / next required check:</text><line x1="250" y1="899" x2="752" y2="899" stroke="#98aa9e"/>
  <text x="64" y="925" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173d2b">Receiving-person question / cross-check:</text><line x1="292" y1="929" x2="752" y2="929" stroke="#98aa9e"/>
  <text x="64" y="955" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173d2b">Correction history, if any:</text><line x1="220" y1="959" x2="752" y2="959" stroke="#98aa9e"/>

  <rect x="48" y="1002" width="720" height="32" rx="10" fill="#fff2df"/>
  <text x="60" y="1023" font-family="Arial, sans-serif" font-size="12" fill="#6d3c18">Practice principle: preserve identity, time, evidence, action, uncertainty, escalation, and the next check. Do not fill missing information with a guess.</text>
</svg>
