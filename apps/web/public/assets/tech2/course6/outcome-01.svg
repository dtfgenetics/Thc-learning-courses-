<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Containment and fact baseline before causal conclusions</title><desc id="desc">A postharvest deviation workflow starts with material identity and containment, then preserves the event timeline, product observations, room or process history and current status before hypotheses or disposition decisions are considered.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Contain first. Build facts before the cause story.</text><g font-family="system-ui,sans-serif"><rect x="80" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="105" y="202" font-size="23" font-weight="800" fill="#173f2f">Identity</text><text x="105" y="242" font-size="18" fill="#29483b">lot • rack • room • status</text><rect x="365" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="390" y="202" font-size="23" font-weight="800" fill="#173f2f">Containment</text><text x="390" y="242" font-size="18" fill="#29483b">hold • segregate • preserve</text><rect x="650" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="675" y="202" font-size="23" font-weight="800" fill="#173f2f">Timeline</text><text x="675" y="242" font-size="18" fill="#29483b">movement • measurements</text><rect x="935" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="960" y="202" font-size="23" font-weight="800" fill="#173f2f">Facts / hypotheses</text><text x="960" y="242" font-size="18" fill="#29483b">keep them separate</text><path d="M330 230h35M615 230h35M900 230h35" stroke="#386a50" stroke-width="5"/><rect x="150" y="410" width="980" height="170" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="185" y="452" font-size="26" font-weight="800" fill="#6e481c">Containment is not disposition</text><text x="185" y="495" font-size="20" fill="#5a472f">A hold protects material and evidence while the authorized role evaluates release, rework or destruction.</text><text x="185" y="535" font-size="20" fill="#5a472f">Do not blend uncertain material into normal product or write the suspected cause as a fact before the evidence supports it.</text></g></svg>