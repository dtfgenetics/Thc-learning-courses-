<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Controlled deviation review and disposition handoff</title><desc id="desc">A deviation review workflow identifies the governing procedure version at the time of the event, preserves planned versus actual execution and original corrections, summarizes facts, genealogy and measurements, and hands unresolved disposition questions to the authorized QA or management role rather than releasing product independently.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Preserve historical truth before disposition</text><g font-family="system-ui,sans-serif"><rect x="75" y="160" width="250" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="100" y="202" font-size="23" font-weight="800" fill="#173f2f">Governing version</text><text x="100" y="242" font-size="18" fill="#29483b">effective SOP / instruction</text><rect x="355" y="160" width="250" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="380" y="202" font-size="23" font-weight="800" fill="#173f2f">Planned vs actual</text><text x="380" y="242" font-size="18" fill="#29483b">keep both visible</text><rect x="635" y="160" width="250" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="660" y="202" font-size="23" font-weight="800" fill="#173f2f">Evidence package</text><text x="660" y="242" font-size="18" fill="#29483b">facts • timeline • scope</text><rect x="915" y="160" width="290" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="940" y="202" font-size="23" font-weight="800" fill="#173f2f">Disposition owner</text><text x="940" y="242" font-size="18" fill="#29483b">QA / authorized role</text><path d="M325 232h30M605 232h30M885 232h30" stroke="#386a50" stroke-width="5"/><rect x="145" y="420" width="990" height="165" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="180" y="462" font-size="26" font-weight="800" fill="#6e481c">Investigation supports disposition; it does not replace authority</text><text x="180" y="505" font-size="20" fill="#5a472f">Use the procedure version that actually governed the event and preserve original values when corrections are made.</text><text x="180" y="548" font-size="20" fill="#5a472f">Technician II may recommend verification and summarize risk, but final release/rework/destruction decisions remain with the authorized role.</text></g></svg>