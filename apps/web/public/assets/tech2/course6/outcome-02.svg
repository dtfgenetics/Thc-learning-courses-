<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Room conditions do not equal product state</title><desc id="desc">A drying-process diagram separates room temperature and relative humidity from representative product measurements such as moisture content and water activity, and adds rack position, loading, airflow and time so spatial and temporal differences can be evaluated without substituting one measure for another.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Drying: environment and product are related, not interchangeable</text><g font-family="system-ui,sans-serif"><rect x="95" y="160" width="300" height="160" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="125" y="202" font-size="24" font-weight="800" fill="#173f2f">Room / process history</text><text x="125" y="242" font-size="18" fill="#29483b">temperature • RH • airflow</text><text x="125" y="272" font-size="18" fill="#29483b">loading • time</text><rect x="490" y="160" width="300" height="160" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="520" y="202" font-size="24" font-weight="800" fill="#173f2f">Representative positions</text><text x="520" y="242" font-size="18" fill="#29483b">rack • zone • lot • sample</text><text x="520" y="272" font-size="18" fill="#29483b">repeatable time points</text><rect x="885" y="160" width="300" height="160" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="915" y="202" font-size="24" font-weight="800" fill="#173f2f">Product measurements</text><text x="915" y="242" font-size="18" fill="#29483b">moisture content</text><text x="915" y="272" font-size="18" fill="#29483b">water activity</text><path d="M395 240h95M790 240h95" stroke="#386a50" stroke-width="5"/><rect x="160" y="425" width="960" height="160" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="195" y="468" font-size="26" font-weight="800" fill="#6e481c">Do not substitute measures</text><text x="195" y="510" font-size="20" fill="#5a472f">Room RH is not product water activity. Moisture content and water activity answer different questions.</text><text x="195" y="548" font-size="20" fill="#5a472f">One convenient sample cannot establish whole-lot uniformity; use mapped positions and repeated time points.</text></g></svg>