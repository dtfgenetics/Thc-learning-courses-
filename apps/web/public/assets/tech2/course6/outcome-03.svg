<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Lot genealogy and evidence-bounded affected scope</title><desc id="desc">A lot genealogy flow traces source harvest identity through racks, rooms, movements and downstream lot identifiers, then uses shared exposure, position, timing and product evidence to include or exclude material from the affected scope without making the investigation automatically facility-wide or artificially narrow.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Affected scope follows genealogy and shared exposure</text><g font-family="system-ui,sans-serif"><rect x="80" y="165" width="220" height="125" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="105" y="208" font-size="22" font-weight="800" fill="#173f2f">Harvest source</text><text x="105" y="248" font-size="18" fill="#29483b">original identity</text><rect x="345" y="165" width="220" height="125" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="370" y="208" font-size="22" font-weight="800" fill="#173f2f">Rack / container</text><text x="370" y="248" font-size="18" fill="#29483b">downstream identity</text><rect x="610" y="165" width="220" height="125" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="635" y="208" font-size="22" font-weight="800" fill="#173f2f">Room / exposure</text><text x="635" y="248" font-size="18" fill="#29483b">time • position • process</text><rect x="875" y="165" width="300" height="125" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="900" y="208" font-size="22" font-weight="800" fill="#173f2f">Current lot / status</text><text x="900" y="248" font-size="18" fill="#29483b">sampling • hold • destination</text><path d="M300 228h45M565 228h45M830 228h45" stroke="#386a50" stroke-width="5"/><rect x="130" y="395" width="1020" height="190" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="165" y="438" font-size="26" font-weight="800" fill="#6e481c">Scope decision must cite evidence</text><text x="165" y="480" font-size="20" fill="#5a472f">Include material when identity, shared exposure, position, timing or product evidence supports inclusion.</text><text x="165" y="518" font-size="20" fill="#5a472f">Exclude material only when evidence supports exclusion—not to improve apparent results.</text><text x="165" y="556" font-size="20" fill="#5a472f">New downstream identifiers extend source genealogy; they do not erase it.</text></g></svg>