<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Integrated traceability metrics and shift handoff</title><desc id="desc">An integrated records workflow reconciles physical and controlled identities, preserves planned-versus-actual history, calculates KPIs from stable definitions and denominators, supports peers using the current procedure, then ranks unresolved work and assigns a decision owner without unauthorized record edits or supervisory overreach.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Records station: reconcile → calculate → prioritize → hand off</text><g font-family="system-ui,sans-serif"><rect x="75" y="165" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="100" y="207" font-size="23" font-weight="800" fill="#173f2f">Reconcile identity</text><text x="100" y="247" font-size="18" fill="#29483b">physical vs controlled record</text><rect x="355" y="165" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="380" y="207" font-size="23" font-weight="800" fill="#173f2f">Preserve history</text><text x="380" y="247" font-size="18" fill="#29483b">planned vs actual</text><rect x="635" y="165" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="660" y="207" font-size="23" font-weight="800" fill="#173f2f">Calculate KPI</text><text x="660" y="247" font-size="18" fill="#29483b">stable denominator / window</text><rect x="915" y="165" width="290" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="940" y="207" font-size="23" font-weight="800" fill="#173f2f">Priority handoff</text><text x="940" y="247" font-size="18" fill="#29483b">next action • owner</text><path d="M325 235h30M605 235h30M885 235h30" stroke="#386a50" stroke-width="5"/><rect x="145" y="410" width="990" height="175" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="180" y="452" font-size="26" font-weight="800" fill="#6e481c">Do not manufacture a clean record</text><text x="180" y="495" font-size="20" fill="#5a472f">Do not invent movements, overwrite planned values or change KPI denominators after seeing the result.</text><text x="180" y="535" font-size="20" fill="#5a472f">Peer support can clarify the current SOP; it does not create controlled-record approval or formal supervisory authority.</text></g></svg>