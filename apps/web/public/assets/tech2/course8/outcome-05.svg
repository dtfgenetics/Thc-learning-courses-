<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Integrated IPM propagation and canopy evidence</title><desc id="desc">An integrated plant-health and performance workflow combines comparable multi-round IPM sampling, biosecurity controls, donor or batch evidence, canopy and flowering context, and uncertainty while keeping regulated treatment decisions and unsupported contamination or genotype claims outside Technician II authority.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Plant-health station: compare evidence across systems</text><g font-family="system-ui,sans-serif"><rect x="95" y="160" width="300" height="150" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="125" y="202" font-size="23" font-weight="800" fill="#173f2f">IPM trend evidence</text><text x="125" y="242" font-size="18" fill="#29483b">sampling • scope • severity</text><text x="125" y="272" font-size="18" fill="#29483b">multi-round outcome</text><rect x="490" y="160" width="300" height="150" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="520" y="202" font-size="23" font-weight="800" fill="#173f2f">Propagation evidence</text><text x="520" y="242" font-size="18" fill="#29483b">donor • batch • handling</text><text x="520" y="272" font-size="18" fill="#29483b">sanitation • timing</text><rect x="885" y="160" width="300" height="150" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="915" y="202" font-size="23" font-weight="800" fill="#173f2f">Canopy / flower context</text><text x="915" y="242" font-size="18" fill="#29483b">stage • cultivar • mapped response</text><path d="M395 235h95M790 235h95" stroke="#386a50" stroke-width="5"/><rect x="150" y="420" width="980" height="170" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="185" y="462" font-size="26" font-weight="800" fill="#6e481c">Keep biosecurity and authority boundaries active</text><text x="185" y="505" font-size="20" fill="#5a472f">One favorable observation does not override a contradictory multi-round trend.</text><text x="185" y="542" font-size="20" fill="#5a472f">Do not claim contamination, genotype causation or regulated treatment need without supporting evidence and authority.</text></g></svg>