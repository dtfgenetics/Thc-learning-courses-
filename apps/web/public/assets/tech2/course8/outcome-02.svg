<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Integrated diagnostic workup from verified evidence</title><desc id="desc">A diagnostic workup flow separates verified observations from context, ranks multiple hypotheses, identifies uncertainty and the next discriminating check, then updates the ranking without converting a plausible explanation into a confirmed cause.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Verified evidence → ranked hypotheses → next check</text><g font-family="system-ui,sans-serif"><rect x="80" y="165" width="250" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="105" y="207" font-size="23" font-weight="800" fill="#173f2f">Verified observations</text><text x="105" y="247" font-size="18" fill="#29483b">pattern • timing • measurements</text><rect x="365" y="165" width="250" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="390" y="207" font-size="23" font-weight="800" fill="#173f2f">Context</text><text x="390" y="247" font-size="18" fill="#29483b">crop • environment • history</text><rect x="650" y="165" width="250" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="675" y="207" font-size="23" font-weight="800" fill="#173f2f">Ranked hypotheses</text><text x="675" y="247" font-size="18" fill="#29483b">leading + alternatives</text><rect x="935" y="165" width="250" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="960" y="207" font-size="23" font-weight="800" fill="#173f2f">Next check</text><text x="960" y="247" font-size="18" fill="#29483b">what changes the ranking?</text><path d="M330 237h35M615 237h35M900 237h35" stroke="#386a50" stroke-width="5"/><rect x="155" y="420" width="970" height="160" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="190" y="463" font-size="26" font-weight="800" fill="#6e481c">Keep uncertainty visible</text><text x="190" y="505" font-size="20" fill="#5a472f">Observed facts, hypotheses and confirmed causes are different record categories.</text><text x="190" y="543" font-size="20" fill="#5a472f">The next test should reduce uncertainty, not merely add more data.</text></g></svg>