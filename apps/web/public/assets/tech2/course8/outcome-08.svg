<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Senior Technician Diagnostic Shift evidence packet</title><desc id="desc">A capstone evidence model requires each of seven practicals plus the integrated capstone to independently meet its standard with no critical error, links evaluator observations to rubric domains and candidate artifacts, and routes failed evidence to remediation and an equivalent reassessment rather than compensatory averaging.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Capstone evidence is non-compensatory</text><g font-family="system-ui,sans-serif"><rect x="90" y="150" width="300" height="160" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="120" y="195" font-size="24" font-weight="800" fill="#173f2f">Practicals A–G</text><text x="120" y="235" font-size="18" fill="#29483b">each meets its standard</text><text x="120" y="265" font-size="18" fill="#29483b">no critical error</text><rect x="490" y="150" width="300" height="160" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="520" y="195" font-size="24" font-weight="800" fill="#173f2f">Integrated capstone</text><text x="520" y="235" font-size="18" fill="#29483b">priority • evidence • handoff</text><text x="520" y="265" font-size="18" fill="#29483b">no critical error</text><rect x="890" y="150" width="300" height="160" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="920" y="195" font-size="24" font-weight="800" fill="#173f2f">Evaluator evidence</text><text x="920" y="235" font-size="18" fill="#29483b">observed behavior • artifacts</text><text x="920" y="265" font-size="18" fill="#29483b">rubric • accommodation</text><path d="M390 230h100M790 230h100" stroke="#386a50" stroke-width="5"/><rect x="145" y="405" width="990" height="190" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="180" y="448" font-size="26" font-weight="800" fill="#6e481c">A stronger score elsewhere cannot erase failed evidence</text><text x="180" y="490" font-size="20" fill="#5a472f">Failed practical or critical error → remediation → equivalent reassessment.</text><text x="180" y="528" font-size="20" fill="#5a472f">The public readiness assessment supports preparation but is not credential evidence.</text><text x="180" y="566" font-size="20" fill="#5a472f">Secure/live forms, evaluator validation and final credential release remain separately gated.</text></g></svg>