<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Integrated shift priority triage</title><desc id="desc">A priority triage framework ranks competing Technician II deviations by immediate safety, containment, data validity, crop or lot consequence, timing dependency and assigned authority before convenience or optimization work.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Triage before diagnosis</text><g font-family="system-ui,sans-serif"><rect x="100" y="160" width="1080" height="110" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="135" y="202" font-size="24" font-weight="800" fill="#173f2f">Priority order is evidence- and consequence-based</text><text x="135" y="242" font-size="19" fill="#29483b">safety → containment / identity → data validity → crop / lot consequence → timing dependency → routine optimization</text><rect x="120" y="355" width="300" height="150" rx="18" fill="#f0f4f2" stroke="#70897d" stroke-width="2"/><text x="150" y="398" font-size="23" font-weight="800" fill="#29483b">Immediate stop?</text><text x="150" y="438" font-size="18" fill="#456054">unsafe condition</text><text x="150" y="468" font-size="18" fill="#456054">urgent containment</text><rect x="490" y="355" width="300" height="150" rx="18" fill="#f0f4f2" stroke="#70897d" stroke-width="2"/><text x="520" y="398" font-size="23" font-weight="800" fill="#29483b">Decision-blocking?</text><text x="520" y="438" font-size="18" fill="#456054">invalid data • identity gap</text><text x="520" y="468" font-size="18" fill="#456054">downstream dependency</text><rect x="860" y="355" width="300" height="150" rx="18" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="890" y="398" font-size="23" font-weight="800" fill="#6e481c">Who owns the next action?</text><text x="890" y="438" font-size="18" fill="#5a472f">Technician II?</text><text x="890" y="468" font-size="18" fill="#5a472f">or escalation?</text><text x="155" y="595" font-size="21" fill="#365b4c">Do not delay a required stop or containment action while collecting optional diagnostic detail.</text></g></svg>