<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Integrated fertigation and root-zone station</title><desc id="desc">A station workflow verifies approved recipe and material identity, measuring-system readiness, irrigation delivery, root-zone trend and crop context before a bounded troubleshooting recommendation, with unauthorized recipe redesign or major chemistry decisions routed to escalation.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Fertigation station: verify before interpreting</text><g font-family="system-ui,sans-serif"><rect x="80" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="105" y="202" font-size="23" font-weight="800" fill="#173f2f">Approved batch</text><text x="105" y="242" font-size="18" fill="#29483b">recipe • materials • sequence</text><rect x="365" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="390" y="202" font-size="23" font-weight="800" fill="#173f2f">Measurement quality</text><text x="390" y="242" font-size="18" fill="#29483b">sample • meter • verification</text><rect x="650" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="675" y="202" font-size="23" font-weight="800" fill="#173f2f">Delivery / root zone</text><text x="675" y="242" font-size="18" fill="#29483b">volume • timing • pH / EC</text><rect x="935" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="960" y="202" font-size="23" font-weight="800" fill="#173f2f">Crop context</text><text x="960" y="242" font-size="18" fill="#29483b">media • stage • demand</text><path d="M330 230h35M615 230h35M900 230h35" stroke="#386a50" stroke-width="5"/><rect x="150" y="410" width="980" height="170" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="185" y="452" font-size="26" font-weight="800" fill="#6e481c">Bounded recommendation</text><text x="185" y="495" font-size="20" fill="#5a472f">Interpret root-zone and irrigation trends in context; do not copy universal dryback targets across systems.</text><text x="185" y="535" font-size="20" fill="#5a472f">Troubleshooting skill does not grant independent recipe-design or unauthorized chemistry authority.</text></g></svg>