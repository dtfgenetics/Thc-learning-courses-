<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Invalid data blocks consequential equipment action</title><desc id="desc">A sensor and equipment decision flow verifies measurement validity and independent process response before any consequential setpoint, irrigation or equipment action, separating safe operator checks from maintenance escalation and rejecting major corrective action based on data known to be invalid.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Known-invalid data cannot justify major correction</text><g font-family="system-ui,sans-serif"><rect x="90" y="160" width="260" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="115" y="202" font-size="23" font-weight="800" fill="#173f2f">Measurement valid?</text><text x="115" y="242" font-size="18" fill="#29483b">placement • comparison</text><text x="115" y="272" font-size="18" fill="#29483b">calibration context</text><rect x="400" y="160" width="260" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="425" y="202" font-size="23" font-weight="800" fill="#173f2f">Physical response?</text><text x="425" y="242" font-size="18" fill="#29483b">command vs measured</text><rect x="710" y="160" width="260" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="735" y="202" font-size="23" font-weight="800" fill="#173f2f">Safe operator check?</text><text x="735" y="242" font-size="18" fill="#29483b">assigned procedure only</text><rect x="1020" y="160" width="180" height="145" rx="18" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="1045" y="202" font-size="23" font-weight="800" fill="#6e481c">Escalate</text><text x="1045" y="242" font-size="18" fill="#5a472f">service / repair</text><path d="M350 232h50M660 232h50M970 232h50" stroke="#386a50" stroke-width="5"/><rect x="160" y="420" width="960" height="165" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="195" y="462" font-size="26" font-weight="800" fill="#6e481c">Data-validity gate</text><text x="195" y="505" font-size="20" fill="#5a472f">Sensor disagreement, implausible values or missing calibration context require verification first.</text><text x="195" y="545" font-size="20" fill="#5a472f">Do not turn a suspect reading into a major setpoint, irrigation or chemical change.</text></g></svg>