<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Integrated postharvest deviation scope</title><desc id="desc">A postharvest station workflow separates room history from product measurements, contains suspect material, traces lot genealogy and shared exposure, defines evidence-bounded affected scope, and hands unresolved disposition decisions to the authorized role.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Postharvest station: product evidence + genealogy + scope</text><g font-family="system-ui,sans-serif"><rect x="80" y="160" width="250" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="105" y="202" font-size="23" font-weight="800" fill="#173f2f">Product evidence</text><text x="105" y="242" font-size="18" fill="#29483b">representative measurements</text><rect x="365" y="160" width="250" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="390" y="202" font-size="23" font-weight="800" fill="#173f2f">Room / process history</text><text x="390" y="242" font-size="18" fill="#29483b">time • position • conditions</text><rect x="650" y="160" width="250" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="675" y="202" font-size="23" font-weight="800" fill="#173f2f">Genealogy</text><text x="675" y="242" font-size="18" fill="#29483b">source • movement • lot</text><rect x="935" y="160" width="250" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="960" y="202" font-size="23" font-weight="800" fill="#173f2f">Affected scope</text><text x="960" y="242" font-size="18" fill="#29483b">evidence-supported only</text><path d="M330 232h35M615 232h35M900 232h35" stroke="#386a50" stroke-width="5"/><rect x="150" y="420" width="980" height="165" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="185" y="462" font-size="26" font-weight="800" fill="#6e481c">Containment does not equal disposition</text><text x="185" y="505" font-size="20" fill="#5a472f">Room RH does not substitute for required product measurements, and affected scope should be neither broader nor narrower than genealogy and evidence support.</text><text x="185" y="548" font-size="20" fill="#5a472f">Final release, rework or destruction remains an authorized disposition decision.</text></g></svg>