<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Verify performance without crossing the service boundary</title>
<desc id="desc">An irrigation and equipment verification flow measures installed performance, checks pressure or distribution evidence, identifies the last authorized operator action, then stops and escalates when protected access, disassembly, hazardous energy, pressure release, or unassigned servicing is required.</desc>
<rect width="1280" height="720" fill="#fffdf7"/>
<text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Verify performance — stay inside authority</text>
<g font-family="system-ui,sans-serif">
<rect x="85" y="155" width="275" height="150" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="110" y="200" font-size="24" font-weight="800" fill="#173f2f">Measure installed output</text><text x="110" y="240" font-size="19" fill="#29483b">catch volumes • pressure</text><text x="110" y="270" font-size="19" fill="#29483b">position • filtration</text>
<rect x="500" y="155" width="275" height="150" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="525" y="200" font-size="24" font-weight="800" fill="#173f2f">Compare to procedure</text><text x="525" y="240" font-size="19" fill="#29483b">What checks / resets /</text><text x="525" y="270" font-size="19" fill="#29483b">cleaning are assigned?</text>
<rect x="915" y="155" width="275" height="150" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="940" y="200" font-size="24" font-weight="800" fill="#173f2f">Boundary cue?</text><text x="940" y="240" font-size="19" fill="#29483b">protected access • energy</text><text x="940" y="270" font-size="19" fill="#29483b">pressure • disassembly</text>
<path d="M360 230h140M775 230h140" stroke="#386a50" stroke-width="5"/>
<rect x="135" y="405" width="430" height="160" rx="22" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="170" y="450" font-size="26" font-weight="800" fill="#173f2f">Within assigned operator care</text><text x="170" y="492" font-size="20" fill="#29483b">Complete the authorized check.</text><text x="170" y="528" font-size="20" fill="#29483b">Measure the response again.</text>
<rect x="715" y="405" width="430" height="160" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="750" y="450" font-size="26" font-weight="800" fill="#6e481c">Outside assigned authority</text><text x="750" y="492" font-size="20" fill="#5a472f">Preserve safe status and stop.</text><text x="750" y="528" font-size="20" fill="#5a472f">Escalate with measured evidence.</text>
<text x="175" y="645" font-size="20" fill="#365b4c">Normal shutdown is not automatically hazardous-energy isolation for servicing.</text>
</g></svg>