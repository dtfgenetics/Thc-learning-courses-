<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Controlled fertigation batch readiness</title><desc id="desc">A pre-batch readiness flow verifies the effective recipe, source water, material identity, target volume, calculation inputs, sequence, measuring tools, PPE and authorization before mixing, with any mismatch routed to hold and escalation rather than improvisation.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Controlled batch readiness before mixing</text><g font-family="system-ui,sans-serif"><rect x="80" y="155" width="250" height="140" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="105" y="198" font-size="23" font-weight="800" fill="#173f2f">1. Effective instruction</text><text x="105" y="235" font-size="18" fill="#29483b">recipe/version • target</text><text x="105" y="265" font-size="18" fill="#29483b">volume • sequence</text><rect x="365" y="155" width="250" height="140" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="390" y="198" font-size="23" font-weight="800" fill="#173f2f">2. Inputs</text><text x="390" y="235" font-size="18" fill="#29483b">source water • material ID</text><text x="390" y="265" font-size="18" fill="#29483b">calculation inputs</text><rect x="650" y="155" width="250" height="140" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="675" y="198" font-size="23" font-weight="800" fill="#173f2f">3. Safety / tools</text><text x="675" y="235" font-size="18" fill="#29483b">PPE • SDS • meters</text><text x="675" y="265" font-size="18" fill="#29483b">spill response • status</text><rect x="935" y="155" width="250" height="140" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="960" y="198" font-size="23" font-weight="800" fill="#173f2f">4. Authority check</text><text x="960" y="235" font-size="18" fill="#29483b">all identities match?</text><text x="960" y="265" font-size="18" fill="#29483b">authorized to proceed?</text><path d="M330 225h35M615 225h35M900 225h35" stroke="#386a50" stroke-width="5"/><rect x="155" y="410" width="440" height="155" rx="22" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="190" y="455" font-size="26" font-weight="800" fill="#173f2f">All controls verified</text><text x="190" y="495" font-size="20" fill="#29483b">Proceed with the approved sequence.</text><text x="190" y="530" font-size="20" fill="#29483b">Record actual execution.</text><rect x="685" y="410" width="440" height="155" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="720" y="455" font-size="26" font-weight="800" fill="#6e481c">Mismatch or uncertainty</text><text x="720" y="495" font-size="20" fill="#5a472f">Hold the batch.</text><text x="720" y="530" font-size="20" fill="#5a472f">Resolve / escalate — do not improvise.</text></g></svg>