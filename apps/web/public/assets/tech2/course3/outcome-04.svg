<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Bounded fertigation and root-zone troubleshooting</title><desc id="desc">A diagnostic workflow compares measurement, irrigation delivery, timing, accumulation, nutrient supply, root condition and crop demand hypotheses, selects a discriminating check, then routes to an authorized correction with post-action verification or to hold and escalation when chemistry, equipment, safety or recipe authority is exceeded.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Troubleshoot to a bounded next decision</text><g font-family="system-ui,sans-serif"><rect x="95" y="150" width="1090" height="115" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="125" y="195" font-size="25" font-weight="800" fill="#173f2f">Rank plausible causes together</text><text x="125" y="235" font-size="19" fill="#29483b">measurement • delivery • timing • accumulation • nutrient supply • roots • crop demand / environment</text><path d="M640 265v55" stroke="#386a50" stroke-width="5"/><rect x="425" y="320" width="430" height="120" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="460" y="365" font-size="25" font-weight="800" fill="#173f2f">Choose a discriminating check</text><text x="460" y="405" font-size="19" fill="#29483b">Which result would change the ranking?</text><path d="M530 440l-150 80M750 440l150 80" stroke="#386a50" stroke-width="5"/><rect x="120" y="520" width="430" height="125" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="155" y="565" font-size="24" font-weight="800" fill="#173f2f">Authorized correction</text><text x="155" y="605" font-size="19" fill="#29483b">act → verify response → document</text><rect x="730" y="520" width="430" height="125" rx="20" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="765" y="565" font-size="24" font-weight="800" fill="#6e481c">Hold / escalate</text><text x="765" y="605" font-size="19" fill="#5a472f">recipe • chemistry • safety • equipment authority</text></g></svg>