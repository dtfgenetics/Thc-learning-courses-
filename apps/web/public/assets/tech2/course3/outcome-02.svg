<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Measurement quality and accept-hold decision</title><desc id="desc">A final-batch verification workflow checks sample identity, meter identity and status, reference or standard verification, probe condition and repeat measurement before comparing the verified result with the controlled range and choosing accept, authorized adjustment, hold or escalation.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Verify the measurement before changing the batch</text><g font-family="system-ui,sans-serif"><rect x="80" y="160" width="245" height="135" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="105" y="202" font-size="23" font-weight="800" fill="#173f2f">Sample identity</text><text x="105" y="242" font-size="18" fill="#29483b">correct batch • timestamp</text><rect x="360" y="160" width="245" height="135" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="385" y="202" font-size="23" font-weight="800" fill="#173f2f">Meter status</text><text x="385" y="242" font-size="18" fill="#29483b">device ID • probe condition</text><rect x="640" y="160" width="245" height="135" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="665" y="202" font-size="23" font-weight="800" fill="#173f2f">Reference check</text><text x="665" y="242" font-size="18" fill="#29483b">standard • stabilization</text><rect x="920" y="160" width="245" height="135" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="945" y="202" font-size="23" font-weight="800" fill="#173f2f">Verified result</text><text x="945" y="242" font-size="18" fill="#29483b">compare controlled range</text><path d="M325 228h35M605 228h35M885 228h35" stroke="#386a50" stroke-width="5"/><rect x="100" y="400" width="310" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="130" y="445" font-size="25" font-weight="800" fill="#173f2f">Within range</text><text x="130" y="485" font-size="19" fill="#29483b">Accept per procedure</text><rect x="485" y="400" width="310" height="140" rx="18" fill="#f5f2e8" stroke="#8b7a44" stroke-width="3"/><text x="515" y="445" font-size="25" font-weight="800" fill="#65551d">Authorized correction</text><text x="515" y="485" font-size="19" fill="#514727">Only if the controlled</text><text x="515" y="515" font-size="19" fill="#514727">instruction permits it</text><rect x="870" y="400" width="310" height="140" rx="18" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="900" y="445" font-size="25" font-weight="800" fill="#6e481c">Hold / escalate</text><text x="900" y="485" font-size="19" fill="#5a472f">Preserve original value</text><text x="900" y="515" font-size="19" fill="#5a472f">and disposition evidence</text></g></svg>