<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Root-zone trends need system context</title><desc id="desc">A connected-system diagram links measured irrigation delivery, media and container context, crop demand and environment, root-zone moisture or dryback, and pH or EC trends, emphasizing that no single dryback percentage or EC value is a universal diagnosis.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Interpret root-zone trends as a connected system</text><g font-family="system-ui,sans-serif"><rect x="80" y="170" width="240" height="130" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="105" y="212" font-size="23" font-weight="800" fill="#173f2f">Irrigation delivery</text><text x="105" y="250" font-size="18" fill="#29483b">volume • timing • uniformity</text><rect x="365" y="170" width="240" height="130" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="390" y="212" font-size="23" font-weight="800" fill="#173f2f">Root-zone context</text><text x="390" y="250" font-size="18" fill="#29483b">media • container • roots</text><rect x="650" y="170" width="240" height="130" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="675" y="212" font-size="23" font-weight="800" fill="#173f2f">Crop demand</text><text x="675" y="250" font-size="18" fill="#29483b">stage • size • light • VPD</text><rect x="935" y="170" width="240" height="130" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="960" y="212" font-size="23" font-weight="800" fill="#173f2f">Measured trends</text><text x="960" y="250" font-size="18" fill="#29483b">moisture • pH • EC</text><path d="M320 235h45M605 235h45M890 235h45" stroke="#386a50" stroke-width="5"/><rect x="155" y="410" width="970" height="170" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="190" y="452" font-size="26" font-weight="800" fill="#6e481c">Avoid one-number diagnosis</text><text x="190" y="492" font-size="20" fill="#5a472f">• no universal dryback target across media, container, stage and environment</text><text x="190" y="528" font-size="20" fill="#5a472f">• EC describes ionic concentration, not which nutrient changed</text><text x="190" y="564" font-size="20" fill="#5a472f">• compare trends with installed delivery and crop response before corrective action</text></g></svg>