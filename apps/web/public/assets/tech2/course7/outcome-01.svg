<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Traceability reconciliation without forced agreement</title><desc id="desc">A reconciliation flow compares physical identity, controlled record identity, current status and location, preserves discrepancies, traces genealogy through splits and moves, and routes corrections through an authorized process without fabricating transactions or overwriting history.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Reconcile evidence — do not force agreement</text><g font-family="system-ui,sans-serif"><rect x="80" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="105" y="202" font-size="23" font-weight="800" fill="#173f2f">Physical evidence</text><text x="105" y="242" font-size="18" fill="#29483b">identity • count • location</text><rect x="365" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="390" y="202" font-size="23" font-weight="800" fill="#173f2f">Controlled record</text><text x="390" y="242" font-size="18" fill="#29483b">expected identity / status</text><rect x="650" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="675" y="202" font-size="23" font-weight="800" fill="#173f2f">Genealogy</text><text x="675" y="242" font-size="18" fill="#29483b">split • move • harvest • lot</text><rect x="935" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="960" y="202" font-size="23" font-weight="800" fill="#173f2f">Correction path</text><text x="960" y="242" font-size="18" fill="#29483b">authorized + auditable</text><path d="M330 230h35M615 230h35M900 230h35" stroke="#386a50" stroke-width="5"/><rect x="145" y="410" width="990" height="170" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="180" y="452" font-size="26" font-weight="800" fill="#6e481c">The discrepancy is evidence</text><text x="180" y="495" font-size="20" fill="#5a472f">Do not invent a movement record, new identity or timestamp just to make the physical and electronic records match.</text><text x="180" y="535" font-size="20" fill="#5a472f">New identifiers extend genealogy; controlled corrections preserve the original record, reason and attribution.</text></g></svg>