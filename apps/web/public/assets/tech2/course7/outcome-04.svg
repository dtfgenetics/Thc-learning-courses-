<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Priority-ranked senior technician handoff</title><desc id="desc">A shift handoff framework ranks unresolved work by safety, quarantine, identity and traceability risk, crop or lot consequence, timing dependency and downstream blocking, while preserving planned versus actual history and assigning a next action and decision owner.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Prioritize by consequence and dependency</text><g font-family="system-ui,sans-serif"><rect x="90" y="150" width="1100" height="120" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="125" y="192" font-size="24" font-weight="800" fill="#173f2f">Priority cues</text><text x="125" y="232" font-size="19" fill="#29483b">safety • quarantine • identity / traceability • crop / lot consequence • timing • downstream blocker</text><rect x="100" y="350" width="245" height="145" rx="18" fill="#f0f4f2" stroke="#70897d" stroke-width="2"/><text x="125" y="392" font-size="22" font-weight="800" fill="#29483b">Evidence</text><text x="125" y="432" font-size="18" fill="#456054">current condition</text><text x="125" y="462" font-size="18" fill="#456054">what is unresolved?</text><rect x="390" y="350" width="245" height="145" rx="18" fill="#f0f4f2" stroke="#70897d" stroke-width="2"/><text x="415" y="392" font-size="22" font-weight="800" fill="#29483b">Planned vs actual</text><text x="415" y="432" font-size="18" fill="#456054">preserve both dates / values</text><rect x="680" y="350" width="245" height="145" rx="18" fill="#f0f4f2" stroke="#70897d" stroke-width="2"/><text x="705" y="392" font-size="22" font-weight="800" fill="#29483b">Next action</text><text x="705" y="432" font-size="18" fill="#456054">verification / containment</text><rect x="970" y="350" width="245" height="145" rx="18" fill="#f0f4f2" stroke="#70897d" stroke-width="2"/><text x="995" y="392" font-size="22" font-weight="800" fill="#29483b">Decision owner</text><text x="995" y="432" font-size="18" fill="#456054">who must decide?</text><rect x="170" y="555" width="940" height="95" rx="18" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="205" y="610" font-size="22" font-weight="700" fill="#6e481c">Do not overwrite the plan to make execution look on schedule; hand off the variance and downstream dependency.</text></g></svg>