<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">SOP-based peer support without supervisory overreach</title><desc id="desc">A peer-support workflow anchors coaching to the current controlled procedure, identifies an observable execution difference, demonstrates or clarifies the approved method, verifies the result, and escalates unresolved authority or record-change questions without creating disciplinary or policy authority.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Peer support follows the SOP — authority stays bounded</text><g font-family="system-ui,sans-serif"><rect x="90" y="160" width="260" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="115" y="202" font-size="23" font-weight="800" fill="#173f2f">Verify current version</text><text x="115" y="242" font-size="18" fill="#29483b">effective SOP / instruction</text><rect x="405" y="160" width="260" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="430" y="202" font-size="23" font-weight="800" fill="#173f2f">Describe difference</text><text x="430" y="242" font-size="18" fill="#29483b">observable step / value</text><rect x="720" y="160" width="260" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="745" y="202" font-size="23" font-weight="800" fill="#173f2f">Coach / demonstrate</text><text x="745" y="242" font-size="18" fill="#29483b">approved method only</text><rect x="1035" y="160" width="170" height="145" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="1060" y="202" font-size="23" font-weight="800" fill="#173f2f">Verify</text><text x="1060" y="242" font-size="18" fill="#29483b">result / escalation</text><path d="M350 232h55M665 232h55M980 232h55" stroke="#386a50" stroke-width="5"/><rect x="145" y="420" width="990" height="165" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="180" y="462" font-size="26" font-weight="800" fill="#6e481c">Peer support does not create formal supervisory authority</text><text x="180" y="505" font-size="20" fill="#5a472f">Do not teach personal preference as policy, authorize controlled-record edits, discipline peers or locally rewrite an incomplete procedure.</text><text x="180" y="548" font-size="20" fill="#5a472f">Escalate approval, staffing, policy and unresolved record-authority questions to the designated role.</text></g></svg>