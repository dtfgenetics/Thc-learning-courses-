<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">KPI definition before interpretation</title><desc id="desc">A KPI workflow defines numerator, denominator, eligible population, time window and exclusions before calculation, then checks comparability across cycles and treats one-cycle movement as a signal rather than a confirmed process trend.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Define the KPI before interpreting the number</text><g font-family="system-ui,sans-serif"><rect x="75" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="100" y="202" font-size="23" font-weight="800" fill="#173f2f">Numerator</text><text x="100" y="242" font-size="18" fill="#29483b">what counts as success?</text><rect x="355" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="380" y="202" font-size="23" font-weight="800" fill="#173f2f">Denominator</text><text x="380" y="242" font-size="18" fill="#29483b">eligible population</text><rect x="635" y="160" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="660" y="202" font-size="23" font-weight="800" fill="#173f2f">Window / exclusions</text><text x="660" y="242" font-size="18" fill="#29483b">same rules each cycle</text><rect x="915" y="160" width="290" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="940" y="202" font-size="23" font-weight="800" fill="#173f2f">Comparable trend?</text><text x="940" y="242" font-size="18" fill="#29483b">same definition + context</text><path d="M325 230h30M605 230h30M885 230h30" stroke="#386a50" stroke-width="5"/><rect x="145" y="410" width="990" height="170" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="180" y="452" font-size="26" font-weight="800" fill="#6e481c">Do not improve the KPI by changing the denominator</text><text x="180" y="495" font-size="20" fill="#5a472f">If eligibility, time window or exclusions change, the result may no longer be directly comparable.</text><text x="180" y="535" font-size="20" fill="#5a472f">A single cycle is context; repeated comparable periods are needed before calling a stable trend.</text></g></svg>