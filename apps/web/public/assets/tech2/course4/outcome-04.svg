<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Containment, authority and IPM handoff</title><desc id="desc">A plant-health decision flow preserves quarantine and clean-to-dirty movement controls, checks whether an action is within the technician's role and applicable label or facility authorization, and routes unresolved or regulated treatment decisions to an authorized role with an evidence-rich handoff.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Strong evidence does not create treatment authority</text><g font-family="system-ui,sans-serif"><rect x="90" y="155" width="280" height="150" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="120" y="198" font-size="24" font-weight="800" fill="#173f2f">Preserve containment</text><text x="120" y="238" font-size="19" fill="#29483b">quarantine • sanitation</text><text x="120" y="268" font-size="19" fill="#29483b">clean → dirty movement</text><rect x="500" y="155" width="280" height="150" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="530" y="198" font-size="24" font-weight="800" fill="#173f2f">Check authority</text><text x="530" y="238" font-size="19" fill="#29483b">role • label • facility</text><text x="530" y="268" font-size="19" fill="#29483b">authorized action?</text><rect x="910" y="155" width="280" height="150" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="940" y="198" font-size="24" font-weight="800" fill="#173f2f">Handoff evidence</text><text x="940" y="238" font-size="19" fill="#29483b">scope • trend • history</text><text x="940" y="268" font-size="19" fill="#29483b">uncertainty • next decision</text><path d="M370 230h130M780 230h130" stroke="#386a50" stroke-width="5"/><rect x="160" y="420" width="960" height="170" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="195" y="463" font-size="26" font-weight="800" fill="#6e481c">Escalate rather than bypass</text><text x="195" y="505" font-size="20" fill="#5a472f">Do not select or apply a regulated treatment merely because the diagnosis is persuasive.</text><text x="195" y="542" font-size="20" fill="#5a472f">Do not break containment for convenience sampling; escalate the method instead.</text><text x="195" y="577" font-size="20" fill="#5a472f">Preserve negative and conflicting findings in the handoff.</text></g></svg>