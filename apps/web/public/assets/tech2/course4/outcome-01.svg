<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Comparable scouting requires a stable measurement system</title><desc id="desc">A scouting-quality diagram links route and zones, sample denominator, fixed trap or location identity, incidence and severity definitions, and preserved method deviations so repeated rounds can be compared without confusing sampling changes for biological trends.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Comparable scouting starts with comparable methods</text><g font-family="system-ui,sans-serif"><rect x="80" y="160" width="245" height="135" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="105" y="202" font-size="23" font-weight="800" fill="#173f2f">Route / zones</text><text x="105" y="242" font-size="18" fill="#29483b">repeatable locations</text><rect x="360" y="160" width="245" height="135" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="385" y="202" font-size="23" font-weight="800" fill="#173f2f">Denominator</text><text x="385" y="242" font-size="18" fill="#29483b">how many units checked?</text><rect x="640" y="160" width="245" height="135" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="665" y="202" font-size="23" font-weight="800" fill="#173f2f">Definitions</text><text x="665" y="242" font-size="18" fill="#29483b">incidence • severity</text><rect x="920" y="160" width="245" height="135" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="945" y="202" font-size="23" font-weight="800" fill="#173f2f">Identity / history</text><text x="945" y="242" font-size="18" fill="#29483b">traps • crop • observer</text><path d="M325 228h35M605 228h35M885 228h35" stroke="#386a50" stroke-width="5"/><rect x="150" y="400" width="980" height="175" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="185" y="445" font-size="26" font-weight="800" fill="#6e481c">Interpret negatives and trends with sampling effort</text><text x="185" y="487" font-size="20" fill="#5a472f">5 plants with no detection ≠ 100 representative plants + fixed traps with no detection.</text><text x="185" y="525" font-size="20" fill="#5a472f">If route, denominator or scale changes, preserve and document the method change.</text><text x="185" y="560" font-size="20" fill="#5a472f">Do not erase conflicting observations to make the trend cleaner.</text></g></svg>