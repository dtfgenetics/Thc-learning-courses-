<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Intervention follow-up against a comparable baseline</title><desc id="desc">An IPM follow-up flow defines the baseline and intended outcome before intervention, repeats comparable measurements across enough rounds, records confounders such as sampling changes or overlapping controls, and classifies the outcome as improving, unchanged, worsening or unresolved.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Intervention completed ≠ intervention proven effective</text><g font-family="system-ui,sans-serif"><rect x="80" y="160" width="250" height="135" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="105" y="202" font-size="23" font-weight="800" fill="#173f2f">Baseline</text><text x="105" y="242" font-size="18" fill="#29483b">scope • incidence • severity</text><rect x="365" y="160" width="250" height="135" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="390" y="202" font-size="23" font-weight="800" fill="#173f2f">Expected outcome</text><text x="390" y="242" font-size="18" fill="#29483b">what should improve?</text><rect x="650" y="160" width="250" height="135" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="675" y="202" font-size="23" font-weight="800" fill="#173f2f">Comparable rounds</text><text x="675" y="242" font-size="18" fill="#29483b">same method / enough time</text><rect x="935" y="160" width="250" height="135" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="960" y="202" font-size="23" font-weight="800" fill="#173f2f">Confounders</text><text x="960" y="242" font-size="18" fill="#29483b">sampling • removal • climate</text><path d="M330 228h35M615 228h35M900 228h35" stroke="#386a50" stroke-width="5"/><rect x="150" y="405" width="980" height="170" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="185" y="448" font-size="26" font-weight="800" fill="#6e481c">Outcome classification</text><text x="185" y="490" font-size="20" fill="#5a472f">Improving • unchanged • worsening • unresolved</text><text x="185" y="528" font-size="20" fill="#5a472f">When multiple controls or method changes overlap, limit causal claims to what the evidence supports.</text><text x="185" y="562" font-size="20" fill="#5a472f">One low trap count or one clean leaf is not enough if the multi-round pattern disagrees.</text></g></svg>