<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Spatial and temporal plant-health trend</title><desc id="desc">A trend interpretation model compares mapped scope, incidence, severity, chronology and movement pathways across repeated scouting rounds so a flat total does not hide spread into new zones or worsening severity.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Trend = count + scope + severity + time</text><g font-family="system-ui,sans-serif"><rect x="95" y="150" width="315" height="160" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="125" y="195" font-size="25" font-weight="800" fill="#173f2f">Round 1</text><text x="125" y="235" font-size="19" fill="#29483b">one cluster • defined baseline</text><text x="125" y="270" font-size="19" fill="#29483b">incidence + severity</text><rect x="485" y="150" width="315" height="160" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="515" y="195" font-size="25" font-weight="800" fill="#173f2f">Round 2</text><text x="515" y="235" font-size="19" fill="#29483b">persistent / new / resolved</text><text x="515" y="270" font-size="19" fill="#29483b">same map + denominator</text><rect x="875" y="150" width="315" height="160" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="905" y="195" font-size="25" font-weight="800" fill="#173f2f">Round 3</text><text x="905" y="235" font-size="19" fill="#29483b">spread or contraction?</text><text x="905" y="270" font-size="19" fill="#29483b">movement pathway?</text><path d="M410 230h75M800 230h75" stroke="#386a50" stroke-width="5"/><rect x="145" y="410" width="990" height="160" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="180" y="455" font-size="26" font-weight="800" fill="#6e481c">A flat total can still mean worse scope</text><text x="180" y="497" font-size="20" fill="#5a472f">One contained cluster and four distant low-level zones can have the same count.</text><text x="180" y="535" font-size="20" fill="#5a472f">Track incidence and severity separately, then connect plausible crop, traffic, airflow, irrigation or propagation pathways.</text></g></svg>