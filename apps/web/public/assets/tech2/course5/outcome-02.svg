<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Propagation underperformance differential</title><desc id="desc">A differential diagnosis matrix compares donor condition, sanitation, environment, handling, media, timing and plant-health explanations, emphasizing evidence for and against each option and a discriminating next check rather than unsupported contamination or genotype claims.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Poor rooting pattern ≠ proven cause</text><g font-family="system-ui,sans-serif"><text x="80" y="135" font-size="22" font-weight="800" fill="#173f2f">Hypothesis families</text><rect x="80" y="165" width="225" height="310" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="110" y="205" font-size="21" font-weight="700" fill="#173f2f">Donor condition</text><text x="110" y="250" font-size="21" font-weight="700" fill="#173f2f">Sanitation</text><text x="110" y="295" font-size="21" font-weight="700" fill="#173f2f">Environment</text><text x="110" y="340" font-size="21" font-weight="700" fill="#173f2f">Handling</text><text x="110" y="385" font-size="21" font-weight="700" fill="#173f2f">Media</text><text x="110" y="430" font-size="21" font-weight="700" fill="#173f2f">Timing / health</text><rect x="360" y="165" width="370" height="310" rx="18" fill="#f0f4f2" stroke="#70897d" stroke-width="2"/><text x="390" y="207" font-size="24" font-weight="800" fill="#29483b">Evidence</text><text x="390" y="250" font-size="19" fill="#456054">What supports it?</text><text x="390" y="290" font-size="19" fill="#456054">What weakens it?</text><text x="390" y="330" font-size="19" fill="#456054">What context differs?</text><text x="390" y="370" font-size="19" fill="#456054">What is still unknown?</text><rect x="785" y="165" width="415" height="310" rx="18" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="815" y="207" font-size="24" font-weight="800" fill="#6e481c">Next discriminating check</text><text x="815" y="250" font-size="19" fill="#5a472f">Choose one check whose result</text><text x="815" y="285" font-size="19" fill="#5a472f">changes the ranking.</text><text x="815" y="340" font-size="19" fill="#5a472f">Do not change multiple process</text><text x="815" y="375" font-size="19" fill="#5a472f">variables at once.</text><text x="815" y="430" font-size="19" fill="#5a472f">Pattern guides investigation;</text><text x="815" y="462" font-size="19" fill="#5a472f">it does not prove genotype.</text><text x="140" y="585" font-size="21" fill="#365b4c">Keep sanitation history, scouting and timing evidence in the same differential.</text></g></svg>