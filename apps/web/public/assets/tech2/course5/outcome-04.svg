<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Integrated propagation and canopy performance handoff</title><desc id="desc">A supervisor handoff workflow preserves donor, batch, cultivar and zone identity, comparable performance metrics, leading and alternative explanations, biosecurity status, authorized actions, role boundaries and the next required verification without deleting contrary evidence.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Make the performance review decision-ready</text><g font-family="system-ui,sans-serif"><rect x="80" y="160" width="245" height="150" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="105" y="202" font-size="23" font-weight="800" fill="#173f2f">Traceable scope</text><text x="105" y="242" font-size="18" fill="#29483b">donor • batch • cultivar</text><text x="105" y="272" font-size="18" fill="#29483b">zone • work order</text><rect x="360" y="160" width="245" height="150" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="385" y="202" font-size="23" font-weight="800" fill="#173f2f">Comparable evidence</text><text x="385" y="242" font-size="18" fill="#29483b">metrics • maps • timing</text><text x="385" y="272" font-size="18" fill="#29483b">contrary findings</text><rect x="640" y="160" width="245" height="150" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="665" y="202" font-size="23" font-weight="800" fill="#173f2f">Boundaries</text><text x="665" y="242" font-size="18" fill="#29483b">biosecurity • role</text><text x="665" y="272" font-size="18" fill="#29483b">authorized action only</text><rect x="920" y="160" width="245" height="150" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="945" y="202" font-size="23" font-weight="800" fill="#173f2f">Next owner</text><text x="945" y="242" font-size="18" fill="#29483b">verification • decision</text><text x="945" y="272" font-size="18" fill="#29483b">unresolved uncertainty</text><path d="M325 235h35M605 235h35M885 235h35" stroke="#386a50" stroke-width="5"/><rect x="150" y="420" width="980" height="165" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="185" y="462" font-size="26" font-weight="800" fill="#6e481c">Do not trade traceability or biosecurity for convenience</text><text x="185" y="505" font-size="20" fill="#5a472f">Keep questionable material inside its controls, preserve contrary evidence and do not convert a strong hypothesis into unauthorized high-risk intervention.</text><text x="185" y="550" font-size="20" fill="#5a472f">The handoff should make the next decision easier without pretending uncertainty is gone.</text></g></svg>