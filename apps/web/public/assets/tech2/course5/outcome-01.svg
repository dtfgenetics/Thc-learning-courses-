<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Comparable propagation performance evidence</title><desc id="desc">A propagation performance diagram aligns donor or batch identity, starting denominator, rooted and loss counts, observation time point, operator and environment so success percentages are compared only across valid groups and hidden weak donors or trays are not averaged away.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Propagation percentages need traceable denominators</text><g font-family="system-ui,sans-serif"><rect x="80" y="155" width="250" height="140" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="105" y="198" font-size="23" font-weight="800" fill="#173f2f">Identity</text><text x="105" y="238" font-size="18" fill="#29483b">donor • batch • tray</text><rect x="365" y="155" width="250" height="140" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="390" y="198" font-size="23" font-weight="800" fill="#173f2f">Denominator</text><text x="390" y="238" font-size="18" fill="#29483b">eligible starting units</text><rect x="650" y="155" width="250" height="140" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="675" y="198" font-size="23" font-weight="800" fill="#173f2f">Outcome timing</text><text x="675" y="238" font-size="18" fill="#29483b">rooted • lost • day scored</text><rect x="935" y="155" width="250" height="140" rx="20" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="960" y="198" font-size="23" font-weight="800" fill="#173f2f">Context</text><text x="960" y="238" font-size="18" fill="#29483b">operator • media • zone</text><path d="M330 225h35M615 225h35M900 225h35" stroke="#386a50" stroke-width="5"/><rect x="145" y="405" width="990" height="170" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="180" y="450" font-size="26" font-weight="800" fill="#6e481c">Stratify before averaging</text><text x="180" y="492" font-size="20" fill="#5a472f">Compare donors, trays, operators, media lots and zones before relying on one facility average.</text><text x="180" y="530" font-size="20" fill="#5a472f">A result scored at day 7 is not directly comparable with day 14 without context.</text><text x="180" y="565" font-size="20" fill="#5a472f">Preserve exclusions and corrections rather than rewriting the batch history.</text></g></svg>