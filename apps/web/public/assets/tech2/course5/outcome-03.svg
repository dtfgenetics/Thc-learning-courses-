<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Canopy performance is planned-versus-actual evidence</title><desc id="desc">A canopy review workflow compares the authorized work order with mapped pre-work conditions, actual work completed, spatial post-work observations and recovery over time, while retaining cultivar and stage as context rather than assuming genotype causation.</desc><rect width="1280" height="720" fill="#fffdf7"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#173f2f">Judge canopy work by outcome, not technique name</text><g font-family="system-ui,sans-serif"><rect x="75" y="165" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="100" y="208" font-size="23" font-weight="800" fill="#173f2f">Work order</text><text x="100" y="248" font-size="18" fill="#29483b">stage • area • intended action</text><rect x="355" y="165" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="380" y="208" font-size="23" font-weight="800" fill="#173f2f">Pre-work map</text><text x="380" y="248" font-size="18" fill="#29483b">height • density • gaps</text><rect x="635" y="165" width="250" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="660" y="208" font-size="23" font-weight="800" fill="#173f2f">Actual work</text><text x="660" y="248" font-size="18" fill="#29483b">extent • exceptions</text><rect x="915" y="165" width="290" height="140" rx="18" fill="#edf6ef" stroke="#386a50" stroke-width="3"/><text x="940" y="208" font-size="23" font-weight="800" fill="#173f2f">Post-work recovery</text><text x="940" y="248" font-size="18" fill="#29483b">mapped response • timing</text><path d="M325 235h30M605 235h30M885 235h30" stroke="#386a50" stroke-width="5"/><rect x="145" y="405" width="990" height="175" rx="22" fill="#f7efe0" stroke="#9b6b2f" stroke-width="3"/><text x="180" y="450" font-size="26" font-weight="800" fill="#6e481c">Use spatial and contextual evidence</text><text x="180" y="492" font-size="20" fill="#5a472f">A center-room photo cannot prove canopy uniformity.</text><text x="180" y="530" font-size="20" fill="#5a472f">Map edge and interior response, stage, cultivar and starting condition.</text><text x="180" y="565" font-size="20" fill="#5a472f">A cultivar difference is a hypothesis until context and repeated evidence support it.</text></g></svg>