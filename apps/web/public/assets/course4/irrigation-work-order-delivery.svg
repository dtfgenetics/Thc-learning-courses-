<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Irrigation work order and representative delivery verification</title><desc id="d">A work-order execution flow from identity verification through readiness and irrigation to representative delivery checks. A zone map shows several check points including one failed point, emphasizing that controller completion is not proof of crop delivery.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173b2c}.title{font-size:44px;font-weight:700}.sub{font-size:22px;fill:#496256}.h{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#496256}.box{fill:#fffdf7;stroke:#b9c8bf;stroke-width:2}.accent{fill:#e8f1eb;stroke:#4e7f63;stroke-width:2}.warn{fill:#fff3de;stroke:#b77b2d;stroke-width:2}.cool{fill:#edf4f8;stroke:#4b7186;stroke-width:2}.line{stroke:#4e7f63;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1600" height="1000" fill="#f7f4ea"/><text x="70" y="82" class="title">Work order → execution → representative delivery</text><text x="70" y="122" class="sub">A controller event is not proof that the intended crop area actually received irrigation.</text><g transform="translate(70,180)"><rect class="accent" x="0" y="0" width="250" height="125" rx="22"/><text x="26" y="44" class="h">1. Match work order</text><text x="26" y="82" class="body">room / zone / source</text><text x="26" y="108" class="small">current instruction</text><path class="line" d="M260 62 H315"/><path d="M315 62 l-15 -10 v20 z" fill="#4e7f63"/><rect class="box" x="335" y="0" width="250" height="125" rx="22"/><text x="361" y="44" class="h">2. Readiness</text><text x="361" y="82" class="body">permitted equipment</text><text x="361" y="108" class="small">work-area check</text><path class="line" d="M595 62 H650"/><path d="M650 62 l-15 -10 v20 z" fill="#4e7f63"/><rect class="cool" x="670" y="0" width="250" height="125" rx="22"/><text x="696" y="44" class="h">3. Execute</text><text x="696" y="82" class="body">assigned sequence</text><text x="696" y="108" class="small">inside authorization</text><path class="line" d="M930 62 H985"/><path d="M985 62 l-15 -10 v20 z" fill="#4e7f63"/><rect class="accent" x="1005" y="0" width="315" height="125" rx="22"/><text x="1031" y="44" class="h">4. Verify delivery</text><text x="1031" y="82" class="body">procedure-defined points</text><text x="1031" y="108" class="small">actual output / crop delivery</text></g><g transform="translate(95,380)"><rect class="box" x="0" y="0" width="760" height="420" rx="28"/><text x="30" y="48" class="h">Representative zone check</text><rect x="70" y="95" width="620" height="250" fill="#edf4f8" stroke="#4b7186" stroke-width="2" rx="18"/><text x="90" y="125" class="small">Zone A</text><g fill="#4e7f63"><circle cx="170" cy="180" r="18"/><circle cx="370" cy="180" r="18"/><circle cx="570" cy="180" r="18"/><circle cx="170" cy="285" r="18"/><circle cx="370" cy="285" r="18"/></g><circle cx="570" cy="285" r="18" fill="#a94c4c"/><text x="598" y="292" class="body">failed / low delivery</text><text x="72" y="385" class="small">Green points show verified sample points; red shows a local deviation. Example only.</text></g><g transform="translate(900,380)"><rect class="warn" x="0" y="0" width="610" height="190" rx="26"/><text x="28" y="48" class="h">Deviation found?</text><text x="28" y="88" class="body">Record the exact point / zone and observed result.</text><text x="28" y="124" class="body">Use only permitted routine checks or corrections.</text><text x="28" y="160" class="body">Stop / isolate / escalate when the procedure requires.</text><rect class="accent" x="0" y="230" width="610" height="190" rx="26"/><text x="28" y="278" class="h">Completion means verified completion</text><text x="28" y="318" class="body">Planned task ≠ controller status ≠ verified delivery.</text><text x="28" y="354" class="body">Do not mark a missed zone or unresolved fault complete.</text><text x="28" y="390" class="small">Do not redesign timing, recipe, programming or protected settings unless authorized.</text></g><rect class="cool" x="95" y="845" width="1415" height="95" rx="22"/><text x="125" y="888" class="h">Record: work order • actual execution • representative checks • deviations • permitted actions • unresolved handoff</text></svg>