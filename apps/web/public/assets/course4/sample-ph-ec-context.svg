<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Sample identity, pH and EC measurement context</title><desc id="d">A six-step measurement workflow moving from work order and sample identity through meter readiness, pH and EC measurement, contextual recording, verification and escalation. It emphasizes that pH and EC values are evidence, not nutrient-specific diagnoses.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173b2c}.title{font-size:44px;font-weight:700}.sub{font-size:22px;fill:#496256}.h{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#496256}.box{fill:#fffdf7;stroke:#b9c8bf;stroke-width:2}.accent{fill:#e8f1eb;stroke:#4e7f63;stroke-width:2}.warn{fill:#fff3de;stroke:#b77b2d;stroke-width:2}.cool{fill:#edf4f8;stroke:#4b7186;stroke-width:2}.line{stroke:#4e7f63;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1600" height="1000" fill="#f7f4ea"/><text x="70" y="82" class="title">Sample identity → pH/EC → usable evidence</text><text x="70" y="122" class="sub">Measure the correct sample with a fit-for-task instrument before interpreting the number.</text><g transform="translate(70,185)"><rect class="accent" x="0" y="0" width="220" height="150" rx="24"/><text x="24" y="45" class="h">1. Work order</text><text x="24" y="82" class="body">What sample is</text><text x="24" y="112" class="body">actually required?</text><path class="line" d="M230 75 H280"/><path d="M280 75 l-16 -10 v20 z" fill="#4e7f63"/><rect class="box" x="300" y="0" width="220" height="150" rx="24"/><text x="324" y="45" class="h">2. Identity</text><text x="324" y="82" class="body">Type • source • zone</text><text x="324" y="112" class="body">time • batch/context</text><path class="line" d="M530 75 H580"/><path d="M580 75 l-16 -10 v20 z" fill="#4e7f63"/><rect class="cool" x="600" y="0" width="220" height="150" rx="24"/><text x="624" y="45" class="h">3. Meter ready?</text><text x="624" y="82" class="body">Status • rinse • probe</text><text x="624" y="112" class="body">verification/calibration</text><path class="line" d="M830 75 H880"/><path d="M880 75 l-16 -10 v20 z" fill="#4e7f63"/><rect class="accent" x="900" y="0" width="220" height="150" rx="24"/><text x="924" y="45" class="h">4. Measure</text><text x="924" y="82" class="body">pH + EC</text><text x="924" y="112" class="body">method + units</text><path class="line" d="M1130 75 H1180"/><path d="M1180 75 l-16 -10 v20 z" fill="#4e7f63"/><rect class="box" x="1200" y="0" width="260" height="150" rx="24"/><text x="1224" y="45" class="h">5. Record context</text><text x="1224" y="82" class="body">value + sample + time</text><text x="1224" y="112" class="body">meter/method + status</text></g><g transform="translate(70,405)"><rect class="warn" x="0" y="0" width="670" height="230" rx="26"/><text x="30" y="48" class="h">If the reading is surprising</text><text x="30" y="88" class="body">• Confirm sample identity and method.</text><text x="30" y="124" class="body">• Repeat or verify only within the supplied procedure.</text><text x="30" y="160" class="body">• Keep the original result and verification status visible.</text><text x="30" y="196" class="body">• Escalate unresolved meter or process questions.</text><rect class="cool" x="730" y="0" width="660" height="230" rx="26"/><text x="760" y="48" class="h">What pH / EC can and cannot establish</text><text x="760" y="88" class="body">Useful: acidity/basicity context, overall ionic conductivity, trends.</text><text x="760" y="132" class="body">Not proven by one number: a specific nutrient deficiency,</text><text x="760" y="166" class="body">root disease, irrigation failure, or exact dissolved-ion mixture.</text><text x="760" y="204" class="small">Sample method matters: unlike methods are not automatically interchangeable.</text></g><g transform="translate(70,700)"><rect class="accent" x="0" y="0" width="1390" height="180" rx="26"/><text x="30" y="50" class="h">Reconstructable measurement record</text><text x="30" y="92" class="body">Sample identity + location + collection time + meter ID/status + method + pH + EC + units + verification action + unresolved condition.</text><text x="30" y="135" class="body">Keep planned recipe/work-order values separate from what was actually measured.</text></g><text x="70" y="950" class="small">Course 4 • Technician I scope • No universal pH/EC target is prescribed by this visual.</text></svg>