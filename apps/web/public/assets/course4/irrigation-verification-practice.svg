<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Irrigation delivery and root-zone verification practice worksheet</title><desc id="d">A printable worksheet for irrigation work-order verification, representative delivery checks, root-zone trend observations, bounded nutrition context, deviation handling and shift handoff.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173b2c}.title{font-size:44px;font-weight:700}.sub{font-size:22px;fill:#496256}.h{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#496256}.box{fill:#fffdf7;stroke:#b9c8bf;stroke-width:2}.accent{fill:#e8f1eb;stroke:#4e7f63;stroke-width:2}.cool{fill:#edf4f8;stroke:#4b7186;stroke-width:2}.warn{fill:#fff3de;stroke:#b77b2d;stroke-width:2}.thin{stroke:#9eb2a6;stroke-width:2}</style><rect width="1600" height="1000" fill="#fffdf7"/><text x="65" y="72" class="title">Irrigation / root-zone verification practice</text><text x="65" y="108" class="sub">Course 4 • Verify actual delivery and preserve incomplete or unresolved work.</text><g transform="translate(65,150)"><rect class="box" x="0" y="0" width="1470" height="120" rx="20"/><text x="25" y="40" class="h">Work order / identity</text><text x="25" y="80" class="body">Work order: __________________  Room/zone: __________________  Solution/source: __________________  Time: ____________</text><rect class="accent" x="0" y="150" width="1470" height="245" rx="20"/><text x="25" y="192" class="h">Representative delivery checks</text><text x="25" y="232" class="body">Check point / location        Expected task        Observed delivery        Status / deviation</text><line x1="25" y1="250" x2="1435" y2="250" class="thin"/><text x="25" y="286" class="body">1. ____________________      ________________     ____________________     ____________________</text><text x="25" y="326" class="body">2. ____________________      ________________     ____________________     ____________________</text><text x="25" y="366" class="body">3. ____________________      ________________     ____________________     ____________________</text><rect class="box" x="0" y="425" width="720" height="235" rx="20"/><text x="25" y="467" class="h">Root-zone / trend context</text><text x="25" y="507" class="body">Moisture / saturation / drainage observation:</text><text x="25" y="543" class="body">________________________________________________________</text><text x="25" y="583" class="body">Comparable prior condition / dryback trend:</text><text x="25" y="619" class="body">________________________________________________________</text><text x="25" y="650" class="small">Use repeated comparable evidence; do not invent a universal dryback target.</text><rect class="cool" x="750" y="425" width="720" height="235" rx="20"/><text x="775" y="467" class="h">Nutrition-context observation</text><text x="775" y="507" class="body">Symptom pattern / stage: __________________________________</text><text x="775" y="547" class="body">pH / EC / sample-method context: ___________________________</text><text x="775" y="587" class="body">Possible explanations remain: ______________________________</text><text x="775" y="627" class="body">Supported diagnosis?  □ no  □ qualified review required</text><rect class="warn" x="0" y="690" width="1470" height="175" rx="20"/><text x="25" y="732" class="h">Deviation / action / handoff</text><text x="25" y="772" class="body">Fault or incomplete work: __________________________________________________________________________</text><text x="25" y="812" class="body">Permitted check/correction completed: _______________________________________________________________</text><text x="25" y="852" class="body">Unresolved condition + who was notified + next action: ______________________________________________</text></g><text x="65" y="970" class="small">Do not mark controller completion as verified crop delivery. Do not perform unauthorized repair or recipe/process redesign.</text></svg>