<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Nutrition-context differential without unsupported diagnosis</title><desc id="d">A symptom observation is placed at the center of six evidence domains: developmental stage, symptom pattern and progression, pH and sample method, EC and sample method, root-zone condition, and irrigation/environment history. These support a bounded interpretation and escalation rather than a nutrient diagnosis from appearance alone.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173b2c}.title{font-size:44px;font-weight:700}.sub{font-size:22px;fill:#496256}.h{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#496256}.box{fill:#fffdf7;stroke:#b9c8bf;stroke-width:2}.accent{fill:#e8f1eb;stroke:#4e7f63;stroke-width:2}.warn{fill:#fff3de;stroke:#b77b2d;stroke-width:2}.cool{fill:#edf4f8;stroke:#4b7186;stroke-width:2}.line{stroke:#4e7f63;stroke-width:4;fill:none}.thin{stroke:#9eb2a6;stroke-width:2;fill:none}</style><rect width="1600" height="1000" fill="#f7f4ea"/><text x="70" y="82" class="title">A symptom starts the investigation—it does not finish it</text><text x="70" y="122" class="sub">Combine context before a qualified person assigns nutrient cause.</text><circle cx="800" cy="450" r="150" fill="#fff3de" stroke="#b77b2d" stroke-width="3"/><text x="675" y="420" class="h">Observed symptom</text><text x="692" y="458" class="body">location • pattern</text><text x="700" y="490" class="body">progression • severity</text><rect class="box" x="90" y="210" width="360" height="150" rx="24"/><text x="118" y="254" class="h">Developmental stage</text><text x="118" y="294" class="body">New growth? older tissue?</text><text x="118" y="326" class="body">normal senescence context?</text><rect class="box" x="90" y="465" width="360" height="150" rx="24"/><text x="118" y="509" class="h">pH + sample method</text><text x="118" y="549" class="body">What was sampled?</text><text x="118" y="581" class="body">When / how / which meter?</text><rect class="box" x="90" y="720" width="360" height="150" rx="24"/><text x="118" y="764" class="h">EC + method / trend</text><text x="118" y="804" class="body">Overall ionic conductivity,</text><text x="118" y="836" class="body">not a nutrient-specific assay.</text><rect class="cool" x="1150" y="210" width="360" height="150" rx="24"/><text x="1178" y="254" class="h">Root-zone condition</text><text x="1178" y="294" class="body">Moisture • saturation</text><text x="1178" y="326" class="body">drainage • root observations</text><rect class="cool" x="1150" y="465" width="360" height="150" rx="24"/><text x="1178" y="509" class="h">Irrigation history</text><text x="1178" y="549" class="body">Delivery verified?</text><text x="1178" y="581" class="body">missed zone / recent change?</text><rect class="cool" x="1150" y="720" width="360" height="150" rx="24"/><text x="1178" y="764" class="h">Environment / crop</text><text x="1178" y="804" class="body">Light • humidity • temperature</text><text x="1178" y="836" class="body">crop demand / recent events</text><path class="thin" d="M450 285 L655 390 M450 540 L635 465 M450 795 L665 540 M1150 285 L945 390 M1150 540 L965 465 M1150 795 L935 540"/><rect class="accent" x="520" y="675" width="560" height="120" rx="24"/><text x="550" y="720" class="h">Bounded interpretation</text><text x="550" y="758" class="body">State what the evidence supports and what remains uncertain.</text><path class="line" d="M800 795 V850"/><path d="M800 865 l-10 -18 h20 z" fill="#4e7f63"/><rect class="warn" x="520" y="870" width="560" height="90" rx="22"/><text x="550" y="910" class="h">Escalate diagnosis / recipe / treatment decisions</text><text x="550" y="942" class="small">Appearance alone does not prove deficiency, excess or antagonism.</text></svg>