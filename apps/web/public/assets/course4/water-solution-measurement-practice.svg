<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Water and nutrient-solution measurement practice worksheet</title><desc id="d">A printable worksheet with fields for work order, sample identity, collection context, meter readiness, pH and EC results, method, repeat verification, evidence interpretation and escalation.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173b2c}.title{font-size:44px;font-weight:700}.sub{font-size:22px;fill:#496256}.h{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#496256}.box{fill:#fffdf7;stroke:#b9c8bf;stroke-width:2}.cool{fill:#edf4f8;stroke:#4b7186;stroke-width:2}.warn{fill:#fff3de;stroke:#b77b2d;stroke-width:2}.thin{stroke:#9eb2a6;stroke-width:2}</style><rect width="1600" height="1000" fill="#fffdf7"/><text x="65" y="72" class="title">Water / solution measurement practice</text><text x="65" y="108" class="sub">Course 4 • Use supplied procedure and scenario targets. Record what was measured, not what was expected.</text><g transform="translate(65,150)"><rect class="box" x="0" y="0" width="1470" height="130" rx="20"/><text x="25" y="40" class="h">Identity</text><text x="25" y="80" class="body">Work order: __________________________   Room/zone: ______________________   Date/time: ____________________</text><text x="25" y="115" class="body">Sample type/source: ______________________________   Batch/reservoir/context: ______________________________</text><rect class="box" x="0" y="160" width="720" height="260" rx="20"/><text x="25" y="202" class="h">Meter readiness</text><text x="25" y="242" class="body">Meter ID: ____________________  Probe/status: ____________________</text><text x="25" y="282" class="body">Calibration / verification current?  □ yes  □ no  □ unknown</text><text x="25" y="322" class="body">Permitted prep / rinse / check completed: _________________________</text><text x="25" y="362" class="body">Any reason to question the instrument? ___________________________</text><text x="25" y="402" class="body">Action if suspect: ______________________________________________</text><rect class="box" x="750" y="160" width="720" height="260" rx="20"/><text x="775" y="202" class="h">Measurement</text><text x="775" y="242" class="body">pH result: ____________   Method/context: _________________________</text><text x="775" y="282" class="body">EC result: ____________  Units: __________  Method: ______________</text><text x="775" y="322" class="body">Reading stabilized / procedure condition met? _____________________</text><text x="775" y="362" class="body">Repeat / verification result if needed: ___________________________</text><text x="775" y="402" class="body">Planned target or work-order value (separate): ____________________</text><rect class="cool" x="0" y="450" width="1470" height="215" rx="20"/><text x="25" y="492" class="h">Evidence interpretation</text><text x="25" y="532" class="body">What does the measurement directly show? ____________________________________________________________</text><text x="25" y="572" class="body">What does it NOT prove by itself? __________________________________________________________________</text><text x="25" y="612" class="body">Related root-zone / crop / irrigation context: ______________________________________________________</text><text x="25" y="650" class="body">Comparable prior result / trend: __________________________________________________________________</text><rect class="warn" x="0" y="695" width="1470" height="160" rx="20"/><text x="25" y="737" class="h">Unresolved / escalation</text><text x="25" y="777" class="body">Unresolved condition: ______________________________________________________________________________</text><text x="25" y="817" class="body">Who was notified / next action: ____________________________________________________________________</text></g><text x="65" y="970" class="small">Worksheet does not prescribe universal pH/EC targets or authorize recipe/treatment changes.</text></svg>