<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Irrigation fault, verification and shift handoff workflow</title><desc id="d">A workflow for meter, irrigation, delivery or symptom uncertainty. It separates observed evidence from verification actions, authorized correction, unresolved conditions, escalation and receiving-shift handoff.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173b2c}.title{font-size:44px;font-weight:700}.sub{font-size:22px;fill:#496256}.h{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#496256}.box{fill:#fffdf7;stroke:#b9c8bf;stroke-width:2}.accent{fill:#e8f1eb;stroke:#4e7f63;stroke-width:2}.warn{fill:#fff3de;stroke:#b77b2d;stroke-width:2}.cool{fill:#edf4f8;stroke:#4b7186;stroke-width:2}.line{stroke:#4e7f63;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1600" height="1000" fill="#f7f4ea"/><text x="70" y="82" class="title">Fault or uncertainty → verify → record → hand off</text><text x="70" y="122" class="sub">Preserve the original condition and keep “resolved” separate from “acknowledged.”</text><g transform="translate(90,190)"><rect class="warn" x="0" y="0" width="360" height="220" rx="26"/><text x="30" y="48" class="h">Observed issue</text><text x="30" y="88" class="body">• suspect meter / sample</text><text x="30" y="122" class="body">• leak / clog / missed zone</text><text x="30" y="156" class="body">• abnormal moisture / EC trend</text><text x="30" y="190" class="body">• symptom with uncertain cause</text><path class="line" d="M370 110 H440"/><path d="M440 110 l-16 -10 v20 z" fill="#4e7f63"/><rect class="box" x="460" y="0" width="350" height="220" rx="26"/><text x="490" y="48" class="h">Permitted verification</text><text x="490" y="88" class="body">identity • meter status</text><text x="490" y="122" class="body">representative delivery</text><text x="490" y="156" class="body">trend / root-zone context</text><text x="490" y="190" class="body">only authorized checks</text><path class="line" d="M820 110 H890"/><path d="M890 110 l-16 -10 v20 z" fill="#4e7f63"/><rect class="accent" x="910" y="0" width="430" height="220" rx="26"/><text x="940" y="48" class="h">Record evidence</text><text x="940" y="88" class="body">target / work order</text><text x="940" y="122" class="body">actual measurement / delivery</text><text x="940" y="156" class="body">verification action + outcome</text><text x="940" y="190" class="body">what remains unresolved</text></g><g transform="translate(230,510)"><rect class="cool" x="0" y="0" width="500" height="210" rx="26"/><text x="30" y="48" class="h">Resolved within authority?</text><text x="30" y="92" class="body">If yes: document what was actually corrected</text><text x="30" y="128" class="body">and verify completion as required.</text><text x="30" y="174" class="small">Do not infer root cause beyond the evidence.</text><rect class="warn" x="640" y="0" width="500" height="210" rx="26"/><text x="670" y="48" class="h">Still unresolved / outside scope?</text><text x="670" y="92" class="body">Escalate to the assigned role.</text><text x="670" y="128" class="body">Name the affected zone, evidence, checks,</text><text x="670" y="164" class="body">priority and next required action.</text></g><path class="line" d="M800 720 V790"/><path d="M800 805 l-10 -18 h20 z" fill="#4e7f63"/><rect class="accent" x="230" y="820" width="1140" height="110" rx="24"/><text x="260" y="865" class="h">Receiving shift can reconstruct the situation without guessing</text><text x="260" y="902" class="body">Identity • time • target • actual • method • verification • incomplete work • notification • next action</text></svg>