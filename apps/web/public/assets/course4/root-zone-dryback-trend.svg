<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Root-zone moisture, drainage and dryback as a trend</title><desc id="d">A conceptual moisture trend showing irrigation, drainage and dryback over repeated time points. It contrasts a repeated trajectory with a single isolated reading and pairs moisture trends with comparable EC and crop context.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173b2c}.title{font-size:44px;font-weight:700}.sub{font-size:22px;fill:#496256}.h{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#496256}.box{fill:#fffdf7;stroke:#b9c8bf;stroke-width:2}.accent{fill:#e8f1eb;stroke:#4e7f63;stroke-width:2}.warn{fill:#fff3de;stroke:#b77b2d;stroke-width:2}.cool{fill:#edf4f8;stroke:#4b7186;stroke-width:2}.thin{stroke:#9eb2a6;stroke-width:2;fill:none}.dash{stroke:#9eb2a6;stroke-width:2;stroke-dasharray:8 8;fill:none}</style><rect width="1600" height="1000" fill="#f7f4ea"/><text x="70" y="82" class="title">Root-zone work is trend work</text><text x="70" y="122" class="sub">Saturation, drainage and dryback are trajectories—not a stopwatch rule or one spot reading.</text><g transform="translate(90,205)"><rect class="box" x="0" y="0" width="900" height="500" rx="28"/><text x="35" y="48" class="h">Conceptual repeated observation</text><line x1="100" y1="420" x2="830" y2="420" class="thin"/><line x1="100" y1="90" x2="100" y2="420" class="thin"/><text x="38" y="110" class="small">wetter</text><text x="38" y="420" class="small">drier</text><text x="760" y="462" class="small">time →</text><path d="M110 145 C180 160 225 235 300 265 C370 292 430 330 500 350 L520 135 C600 150 645 230 710 270 C765 300 800 330 825 350" fill="none" stroke="#3d6c8d" stroke-width="8"/><circle cx="110" cy="145" r="10" fill="#3d6c8d"/><circle cx="300" cy="265" r="10" fill="#3d6c8d"/><circle cx="500" cy="350" r="10" fill="#3d6c8d"/><circle cx="520" cy="135" r="10" fill="#3d6c8d"/><circle cx="710" cy="270" r="10" fill="#3d6c8d"/><circle cx="825" cy="350" r="10" fill="#3d6c8d"/><line x1="110" y1="120" x2="110" y2="400" class="dash"/><line x1="520" y1="120" x2="520" y2="400" class="dash"/><text x="120" y="118" class="small">irrigation</text><text x="530" y="108" class="small">next irrigation</text><text x="175" y="205" class="small">drainage</text><text x="335" y="320" class="small">dryback</text><text x="645" y="220" class="small">drainage</text><text x="735" y="330" class="small">dryback</text></g><g transform="translate(1040,205)"><rect class="warn" x="0" y="0" width="470" height="225" rx="24"/><text x="28" y="46" class="h">One point ≠ trajectory</text><text x="28" y="88" class="body">A single moisture value cannot show</text><text x="28" y="120" class="body">how quickly the root zone changed.</text><text x="28" y="164" class="body">Compare repeated observations made</text><text x="28" y="196" class="body">with the same defined method.</text><rect class="cool" x="0" y="270" width="470" height="230" rx="24"/><text x="28" y="316" class="h">Add context before conclusions</text><text x="28" y="358" class="body">Comparable EC trend</text><text x="28" y="392" class="body">Crop stage / canopy demand</text><text x="28" y="426" class="body">Media + container + environment</text><text x="28" y="460" class="body">Irrigation amount / delivery history</text></g><g transform="translate(90,760)"><rect class="accent" x="0" y="0" width="1420" height="145" rx="24"/><text x="30" y="47" class="h">Technician I statement</text><text x="30" y="88" class="body">“The defined root-zone condition is changing faster/slower than the previous comparable period.”</text><text x="30" y="122" class="body">Then preserve the evidence and route it for authorized irrigation review—do not invent a universal dryback target.</text></g></svg>