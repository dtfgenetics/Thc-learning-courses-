<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Controlled harvest to dry-room receiving workflow</title><desc id="d">A controlled harvest workflow moves identified material through clean handling, contamination screening, verified destination, dry-room receiving, and monitored postharvest context while suspect material is held outside normal flow.</desc><rect width="1200" height="800" fill="#f7f4ea"/><g font-family="Arial"><text x="60" y="72" font-size="36" font-weight="700" fill="#173f2a">Harvest to receiving: protect condition, identity and flow</text><g fill="#e5efe7" stroke="#35664a" stroke-width="3"><rect x="60" y="145" width="200" height="115" rx="18"/><rect x="300" y="145" width="200" height="115" rx="18"/><rect x="540" y="145" width="200" height="115" rx="18"/><rect x="780" y="145" width="200" height="115" rx="18"/></g><text x="98" y="188" font-size="21" font-weight="700" fill="#173f2a">AUTHORIZED CUT</text><text x="95" y="222" font-size="16" fill="#35493d">Clean tools • gentle handling</text><text x="338" y="188" font-size="21" font-weight="700" fill="#173f2a">TRANSFER</text><text x="335" y="222" font-size="16" fill="#35493d">Lot remains identified</text><text x="573" y="188" font-size="21" font-weight="700" fill="#173f2a">RECEIVE</text><text x="570" y="222" font-size="16" fill="#35493d">Verified clean rack/location</text><text x="818" y="188" font-size="21" font-weight="700" fill="#173f2a">MONITOR</text><text x="813" y="222" font-size="16" fill="#35493d">Environment + product condition</text><path d="M260 202H300M500 202H540M740 202H780" stroke="#35664a" stroke-width="5"/><path d="M420 260V355" stroke="#9b4438" stroke-width="5"/><polygon points="420,370 408,346 432,346" fill="#9b4438"/><rect x="160" y="375" width="520" height="155" rx="20" fill="#f8e5df" stroke="#9b4438" stroke-width="3"/><text x="205" y="418" font-size="25" font-weight="700" fill="#8a2f25">SUSPECT / CONTAMINATION CONDITION</text><text x="205" y="458" font-size="19" fill="#5a3934">Hold or isolate according to procedure.</text><text x="205" y="491" font-size="19" fill="#5a3934">Preserve identity. Do not blend into normal flow.</text><rect x="745" y="385" width="385" height="220" rx="20" fill="#fff" stroke="#9c6d36" stroke-width="3"/><text x="780" y="430" font-size="24" font-weight="700" fill="#7b4d1f">Drying is monitored</text><text x="780" y="470" font-size="18" fill="#4d473f">• temperature / RH context</text><text x="780" y="505" font-size="18" fill="#4d473f">• airflow and load context</text><text x="780" y="540" font-size="18" fill="#4d473f">• identified rack / lot condition</text><text x="780" y="575" font-size="18" fill="#4d473f">• elapsed time is not enough alone</text><text x="80" y="705" font-size="19" fill="#6a645c">Technician I records and escalates meaningful deviations; independent product release or disposition authority is not conferred.</text></g></svg>