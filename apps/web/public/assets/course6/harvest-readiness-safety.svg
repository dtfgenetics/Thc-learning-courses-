<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Harvest authorization, safety and readiness workflow</title><desc id="d">A harvest readiness flow covering authorization and identity, PPE and pathways, clean tools and receiving equipment, labels, reassessment during work, and stop or escalation for unresolved safety, identity, sanitation or destination conflicts.</desc><rect width="1200" height="800" fill="#f7f4ea"/><text x="60" y="72" font-family="Arial" font-size="36" font-weight="700" fill="#173f2a">Harvest readiness: verify before material moves</text><text x="60" y="112" font-family="Arial" font-size="20" fill="#405247">Authorization + identity + safety + sanitation + destination</text><g font-family="Arial"><g fill="#e5efe7" stroke="#35664a" stroke-width="3"><rect x="65" y="170" width="205" height="160" rx="18"/><rect x="300" y="170" width="205" height="160" rx="18"/><rect x="535" y="170" width="205" height="160" rx="18"/><rect x="770" y="170" width="205" height="160" rx="18"/></g><g fill="#173f2a" font-size="23" font-weight="700"><text x="92" y="210">1. Authorization</text><text x="326" y="210">2. Safety</text><text x="560" y="210">3. Clean setup</text><text x="797" y="210">4. Labels &amp; destination</text></g><g fill="#35493d" font-size="17"><text x="92" y="246">Room / batch / work order</text><text x="92" y="276">Current receiving plan</text><text x="326" y="246">PPE / pathways / hazards</text><text x="326" y="276">Ergonomic/task controls</text><text x="560" y="246">Tools / carts / racks</text><text x="560" y="276">Sanitary surfaces</text><text x="797" y="246">Output IDs staged</text><text x="797" y="276">Receiving location verified</text></g><rect x="1000" y="170" width="145" height="160" rx="18" fill="#fff" stroke="#9c6d36" stroke-width="3"/><text x="1025" y="213" font-size="22" font-weight="700" fill="#7b4d1f">RECHECK</text><text x="1025" y="250" font-size="16" fill="#4d473f">When conditions</text><text x="1025" y="275" font-size="16" fill="#4d473f">change during work</text><rect x="105" y="420" width="990" height="235" rx="22" fill="#fff" stroke="#9c6d36" stroke-width="3"/><text x="145" y="468" font-size="27" font-weight="700" fill="#7b4d1f">Unresolved conflict?</text><text x="145" y="515" font-size="21" fill="#4d473f">Blocked path • damaged tool • dirty cart/rack • identity conflict • unavailable destination • new hazard</text><text x="145" y="555" font-size="21" fill="#4d473f">Apply only the supplied routine control. If the condition remains unsafe, uncertain, dirty, unlabeled, or unauthorized:</text><text x="145" y="600" font-size="24" font-weight="700" fill="#173f2a">STOP / HOLD → preserve identity and current state → document → escalate</text><text x="145" y="635" font-size="16" fill="#6a645c">The work order does not authorize continuing through a new uncontrolled hazard or inventing a destination.</text></g></svg>