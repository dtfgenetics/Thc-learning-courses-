<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Source-to-output harvest genealogy</title><desc id="d">A traceability diagram linking identified source plants and batch to harvest containers, receiving lots, dry-room racks, quantities, holds and waste so new identifiers extend rather than erase source genealogy.</desc><rect width="1200" height="800" fill="#f7f4ea"/><text x="60" y="72" font-family="Arial" font-size="36" font-weight="700" fill="#173f2a">Harvest genealogy: new IDs extend the source chain</text><g font-family="Arial"><rect x="65" y="155" width="250" height="165" rx="20" fill="#e5efe7" stroke="#35664a" stroke-width="3"/><text x="95" y="200" font-size="25" font-weight="700" fill="#173f2a">SOURCE</text><text x="95" y="240" font-size="18" fill="#35493d">Room / plant / batch</text><text x="95" y="272" font-size="18" fill="#35493d">Harvest authorization</text><path d="M315 235H420" stroke="#35664a" stroke-width="6"/><rect x="420" y="155" width="300" height="165" rx="20" fill="#fff" stroke="#9c6d36" stroke-width="3"/><text x="455" y="200" font-size="25" font-weight="700" fill="#7b4d1f">TRANSFORMATION</text><text x="455" y="240" font-size="18" fill="#4d473f">Cut / container / lot creation</text><text x="455" y="272" font-size="18" fill="#4d473f">Source → output link recorded</text><path d="M720 235H825" stroke="#35664a" stroke-width="6"/><rect x="825" y="155" width="310" height="165" rx="20" fill="#e5efe7" stroke="#35664a" stroke-width="3"/><text x="858" y="200" font-size="25" font-weight="700" fill="#173f2a">RECEIVING</text><text x="858" y="240" font-size="18" fill="#35493d">Output ID / rack / location</text><text x="858" y="272" font-size="18" fill="#35493d">Quantity / status / condition</text><rect x="105" y="400" width="990" height="250" rx="22" fill="#fff" stroke="#35664a" stroke-width="3"/><text x="145" y="446" font-size="26" font-weight="700" fill="#173f2a">Genealogy remains reconstructable when every branch preserves:</text><g fill="#35493d" font-size="20"><text x="145" y="492">• source identity and event time</text><text x="145" y="528">• each new container / harvest lot / receiving identifier</text><text x="145" y="564">• destination and quantity</text><text x="145" y="600">• hold, waste or other controlled status instead of letting diverted material disappear</text></g><text x="145" y="635" font-size="16" fill="#6a645c">A correct new label is not enough unless the record links it to the correct source transformation.</text></g></svg>