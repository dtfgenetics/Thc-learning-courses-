<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" role="img" aria-labelledby="t d"><title id="t">Dry-room receiving and shift handoff practice worksheet</title><desc id="d">A printable worksheet for recording source and output identity, destination, quantity and reconciliation, product and environmental condition, sanitation and hold status, deviations, authorized actions, escalation, and receiving-shift next actions.</desc><rect width="1200" height="950" fill="#fffdf6"/><g font-family="Arial"><text x="55" y="62" font-size="34" font-weight="700" fill="#173f2a">Dry-room receiving &amp; shift handoff practice</text><text x="55" y="95" font-size="17" fill="#5c645f">A useful handoff keeps normal receiving, partial completion, holds and unresolved conditions visible at the same time.</text><g fill="none" stroke="#35664a" stroke-width="2"><rect x="55" y="130" width="1090" height="120" rx="12"/><rect x="55" y="275" width="1090" height="210" rx="12"/><rect x="55" y="510" width="1090" height="205" rx="12"/><rect x="55" y="740" width="1090" height="150" rx="12"/></g><g font-size="19" fill="#173f2a" font-weight="700"><text x="80" y="168">IDENTITY / RECEIVING</text><text x="80" y="313">QUANTITY / CONDITION / STATUS</text><text x="80" y="548">DEVIATION / ACTION / ESCALATION</text><text x="80" y="778">RECEIVING-SHIFT HANDOFF</text></g><g font-size="16" fill="#35493d"><text x="80" y="202">Authorization/source identity: _____________________________  Output/lot ID: __________________________</text><text x="80" y="230">Verified destination/rack: ________________________________  Time received: _________________________</text><text x="80" y="352">Outgoing quantity: __________  Receiving quantity: __________  Units/method: __________________________</text><text x="80" y="390">Reconciliation status: ☐ matched  ☐ discrepancy open  ☐ discrepancy resolved</text><text x="80" y="428">Product condition observation: _________________________________________________________________</text><text x="80" y="460">Dry-room/environment context supplied: _________________________________________________________</text><text x="80" y="587">Sanitation/hold status: ______________________________________________________________________</text><text x="80" y="625">Deviation or unresolved issue: _________________________________________________________________</text><text x="80" y="663">Authorized action actually taken: ______________________________________________________________</text><text x="80" y="697">Escalation / role notified: __________________________________________________________________</text><text x="80" y="817">Task status: ☐ complete  ☐ partial  ☐ held  ☐ not started      Follow-up owner/role: __________________</text><text x="80" y="850">Next required action: ________________________________________________________________________</text></g><text x="55" y="928" font-size="15" fill="#6a645c">Do not invent root cause, final disposition, release status or completion. Technician I preserves unresolved conditions for qualified follow-up.</text></g></svg>