<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" role="img" aria-labelledby="t d"><title id="t">Dry-room receiving, reconciliation and handoff practice worksheet</title><desc id="d">Printable worksheet for dry-room receiving identity, destination, quantity, environmental and product-condition notes, holds, outgoing versus receiving reconciliation, discrepancy preservation, escalation and next-shift handoff.</desc><rect width="816" height="1056" fill="#fff"/><text x="48" y="58" font-family="Arial" font-size="28" font-weight="700" fill="#173f2a">Dry-Room Receiving &amp; Handoff Practice</text><text x="48" y="88" font-family="Arial" font-size="14" fill="#526158">Course 6 • Receiving, reconciliation, holds and shift handoff</text><g font-family="Arial" font-size="14" fill="#26382f" stroke="#8da095" stroke-width="1.5"><rect x="48" y="118" width="720" height="125" fill="#f7f4ea"/><text x="62" y="143" stroke="none" font-weight="700">RECEIVING IDENTITY &amp; LOCATION</text><text x="62" y="172" stroke="none">Source/batch ID: _________________________ Output/lot ID: ______________________________</text><text x="62" y="202" stroke="none">Dry room / rack / location: __________________________ Receiving status: _____________________</text><text x="62" y="230" stroke="none">Lot separation / label check: ____________________________________________________________</text><rect x="48" y="263" width="720" height="175" fill="#fff"/><text x="62" y="288" stroke="none" font-weight="700">CONDITION &amp; ENVIRONMENT CONTEXT</text><text x="62" y="318" stroke="none">Product condition observation: __________________________________________________________</text><text x="62" y="350" stroke="none">Temperature: __________  RH: __________  Airflow / load context: ______________________________</text><text x="62" y="382" stroke="none">Nonuniform rack/container condition: _____________________________________________________</text><text x="62" y="414" stroke="none">Follow-up needed? ☐ no ☐ yes — reason: ________________________________________________</text><rect x="48" y="458" width="720" height="205" fill="#f7f4ea"/><text x="62" y="483" stroke="none" font-weight="700">QUANTITY RECONCILIATION</text><text x="62" y="514" stroke="none">Outgoing quantity: __________ units ________  Receiving quantity: __________ units ________</text><text x="62" y="546" stroke="none">Held / waste / diverted quantity: __________  Status/location: _____________________________</text><text x="62" y="578" stroke="none">Do attributable values match? ☐ yes ☐ no   Difference: _________________________________</text><text x="62" y="610" stroke="none">Verification performed: _________________________________________________________________</text><text x="62" y="642" stroke="none">Preserve both original values. Do not overwrite, average or force a false match.</text><rect x="48" y="683" width="720" height="295" fill="#fff"/><text x="62" y="708" stroke="none" font-weight="700">HOLD / DEVIATION / HANDOFF</text><text x="62" y="740" stroke="none">Task status: ☐ complete ☐ partial ☐ held ☐ unresolved</text><text x="62" y="772" stroke="none">Sanitation / hold status: ________________________________________________________________</text><text x="62" y="804" stroke="none">Deviation / discrepancy: ________________________________________________________________</text><text x="62" y="836" stroke="none">Authorized action completed: ____________________________________________________________</text><text x="62" y="868" stroke="none">Escalated to / reason: _________________________________________________________________</text><text x="62" y="900" stroke="none">Unresolved condition: __________________________________________________________________</text><text x="62" y="932" stroke="none">Next action / receiving shift: ___________________________________________________________</text><text x="62" y="964" stroke="none">Independent release/disposition decision made? ☐ NO — outside Technician I authority</text></g><text x="48" y="1020" font-family="Arial" font-size="12" fill="#6a645c">Drying is monitored using identified environmental and product evidence; this worksheet does not define a universal fixed-day drying rule.</text></svg>