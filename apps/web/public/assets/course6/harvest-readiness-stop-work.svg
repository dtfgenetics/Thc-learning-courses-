<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Harvest readiness and stop-work decision flow</title><desc id="d">A harvest readiness flow verifies authorization and batch identity, destination, PPE and pathways, clean tools and receiving equipment, and labels before work begins, with stop or escalation when identity, safety, sanitation, or destination conflicts remain unresolved.</desc><rect width="1200" height="800" fill="#f7f4ea"/><g font-family="Arial"><text x="60" y="72" font-size="36" font-weight="700" fill="#173f2a">Harvest readiness: verify before material moves</text><g fill="#e5efe7" stroke="#35664a" stroke-width="3"><rect x="70" y="130" width="310" height="120" rx="18"/><rect x="445" y="130" width="310" height="120" rx="18"/><rect x="820" y="130" width="310" height="120" rx="18"/></g><text x="105" y="175" font-size="23" font-weight="700" fill="#173f2a">1. AUTHORIZATION</text><text x="105" y="210" font-size="18" fill="#35493d">Room • batch • work order</text><text x="485" y="175" font-size="23" font-weight="700" fill="#173f2a">2. DESTINATION</text><text x="485" y="210" font-size="18" fill="#35493d">Rack • receiving area • labels</text><text x="860" y="175" font-size="23" font-weight="700" fill="#173f2a">3. READINESS</text><text x="860" y="210" font-size="18" fill="#35493d">PPE • tools • carts • pathways</text><path d="M380 190H445M755 190H820" stroke="#35664a" stroke-width="5"/><rect x="150" y="330" width="900" height="160" rx="22" fill="#fff" stroke="#9c6d36" stroke-width="3"/><text x="190" y="375" font-size="26" font-weight="700" fill="#7b4d1f">Reassess when conditions change</text><text x="190" y="415" font-size="20" fill="#4d473f">Spill • blocked aisle • damaged tool • alarm • dirty cart/rack • destination unavailable</text><text x="190" y="452" font-size="18" fill="#6a645c">The original work order does not authorize continuing through a new uncontrolled condition.</text><g><rect x="170" y="575" width="370" height="125" rx="20" fill="#e5efe7" stroke="#35664a" stroke-width="3"/><rect x="660" y="575" width="370" height="125" rx="20" fill="#f8e5df" stroke="#9b4438" stroke-width="3"/><text x="220" y="620" font-size="25" font-weight="700" fill="#173f2a">PROCEED</text><text x="220" y="657" font-size="18" fill="#35493d">All controlled conditions verified</text><text x="705" y="620" font-size="25" font-weight="700" fill="#8a2f25">STOP / HOLD / ESCALATE</text><text x="705" y="657" font-size="18" fill="#5a3934">Any unresolved safety, identity, sanitation</text><text x="705" y="682" font-size="18" fill="#5a3934">or destination conflict</text></g></g></svg>