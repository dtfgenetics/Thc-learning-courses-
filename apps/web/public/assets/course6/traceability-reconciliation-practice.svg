<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" role="img" aria-labelledby="t d"><title id="t">Harvest genealogy and reconciliation practice worksheet</title><desc id="d">A printable worksheet for mapping source identity to output containers, destinations and hold status, recording outgoing and receiving quantities, preserving both original measurements, documenting discrepancy evidence, and recording reconciliation status without forcing a false match.</desc><rect width="1200" height="950" fill="#fffdf6"/><g font-family="Arial"><text x="55" y="62" font-size="34" font-weight="700" fill="#173f2a">Harvest genealogy &amp; reconciliation practice</text><text x="55" y="96" font-size="17" fill="#5c645f">Keep original evidence visible. A discrepancy is recorded and resolved through process—not edited away.</text><g fill="none" stroke="#35664a" stroke-width="2"><rect x="55" y="130" width="1090" height="120" rx="12"/><rect x="55" y="275" width="1090" height="260" rx="12"/><rect x="55" y="560" width="1090" height="190" rx="12"/><rect x="55" y="775" width="1090" height="120" rx="12"/></g><g font-size="19" fill="#173f2a" font-weight="700"><text x="80" y="168">SOURCE / TRANSFORMATION EVENT</text><text x="80" y="313">OUTPUT GENEALOGY</text><text x="80" y="598">QUANTITY RECONCILIATION</text><text x="80" y="813">DISCREPANCY STATUS / HANDOFF</text></g><g font-size="16" fill="#35493d"><text x="80" y="202">Source room/batch/lot: ______________________________  Harvest event/time: _______________________</text><text x="80" y="230">Authorization/work order: ____________________________  Responsible record: ______________________</text><text x="80" y="352">Output A ID: __________________  Destination: __________________  Quantity: __________  Status: __________</text><text x="80" y="392">Output B ID: __________________  Destination: __________________  Quantity: __________  Status: __________</text><text x="80" y="432">Output C ID: __________________  Destination: __________________  Quantity: __________  Status: __________</text><text x="80" y="472">Held/waste/diverted identity and reason: _________________________________________________________</text><text x="80" y="510">How does each output link back to the source? ____________________________________________________</text><text x="80" y="638">Outgoing quantity: __________________ units/method: __________________ time: __________________</text><text x="80" y="676">Receiving quantity: _________________ units/method: __________________ time: __________________</text><text x="80" y="714">Difference: _________________________  Are both original records preserved? ☐ yes ☐ no</text><text x="80" y="850">Evidence checked / explanation supported: _______________________________________________________</text><text x="80" y="880">Status: ☐ open  ☐ explained  ☐ resolved   Escalation/next action: _________________________________</text></g><text x="55" y="930" font-size="15" fill="#6a645c">Do not overwrite, average or select a preferred value solely to make physical and digital records agree.</text></g></svg>