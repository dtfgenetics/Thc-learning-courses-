<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Quantity reconciliation and discrepancy control</title><desc id="d">A reconciliation diagram compares outgoing and receiving quantities, preserves both attributable measurements when they differ, routes the mismatch into a controlled discrepancy process, and prohibits editing or averaging original records to force a match.</desc><rect width="1200" height="800" fill="#f7f4ea"/><g font-family="Arial"><text x="60" y="72" font-size="36" font-weight="700" fill="#173f2a">Reconcile reality — never force the records to match</text><rect x="95" y="155" width="330" height="150" rx="22" fill="#e5efe7" stroke="#35664a" stroke-width="3"/><rect x="775" y="155" width="330" height="150" rx="22" fill="#e5efe7" stroke="#35664a" stroke-width="3"/><text x="145" y="205" font-size="25" font-weight="700" fill="#173f2a">OUTGOING RECORD</text><text x="145" y="245" font-size="21" fill="#35493d">18.4 kg</text><text x="145" y="276" font-size="17" fill="#35493d">Source, time, method retained</text><text x="825" y="205" font-size="25" font-weight="700" fill="#173f2a">RECEIVING RECORD</text><text x="825" y="245" font-size="21" fill="#35493d">17.9 kg</text><text x="825" y="276" font-size="17" fill="#35493d">Destination, time, method retained</text><path d="M425 230H540M660 230H775" stroke="#35664a" stroke-width="5"/><rect x="540" y="175" width="120" height="110" rx="55" fill="#fff" stroke="#9b4438" stroke-width="4"/><text x="565" y="240" font-size="27" font-weight="700" fill="#8a2f25">≠</text><rect x="225" y="390" width="750" height="155" rx="22" fill="#f8e5df" stroke="#9b4438" stroke-width="3"/><text x="270" y="435" font-size="26" font-weight="700" fill="#8a2f25">DISCREPANCY — preserve both original results</text><text x="270" y="476" font-size="19" fill="#5a3934">Open the controlled reconciliation process. Account for hold, waste, movement, scale/method</text><text x="270" y="507" font-size="19" fill="#5a3934">or other supported evidence without changing history.</text><g><rect x="130" y="620" width="285" height="90" rx="18" fill="#fff" stroke="#9c6d36" stroke-width="3"/><rect x="460" y="620" width="285" height="90" rx="18" fill="#fff" stroke="#9c6d36" stroke-width="3"/><rect x="790" y="620" width="285" height="90" rx="18" fill="#fff" stroke="#9c6d36" stroke-width="3"/><text x="168" y="658" font-size="20" font-weight="700" fill="#7b4d1f">DO NOT overwrite</text><text x="168" y="687" font-size="16" fill="#4d473f">original attributable values</text><text x="500" y="658" font-size="20" font-weight="700" fill="#7b4d1f">DO NOT average</text><text x="500" y="687" font-size="16" fill="#4d473f">to create a false agreement</text><text x="828" y="658" font-size="20" font-weight="700" fill="#7b4d1f">DO record status</text><text x="828" y="687" font-size="16" fill="#4d473f">open, explained, resolved</text></g></g></svg>