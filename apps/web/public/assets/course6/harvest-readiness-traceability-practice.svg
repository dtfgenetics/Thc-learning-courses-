<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" role="img" aria-labelledby="t d"><title id="t">Harvest readiness and traceability practice worksheet</title><desc id="d">Printable worksheet for harvest authorization, batch identity, PPE, pathways, hazards, tools, sanitation, destination, output identifiers, source-to-output genealogy, holds and escalation.</desc><rect width="816" height="1056" fill="#fff"/><text x="48" y="58" font-family="Arial" font-size="28" font-weight="700" fill="#173f2a">Harvest Readiness &amp; Traceability Practice</text><text x="48" y="88" font-family="Arial" font-size="14" fill="#526158">Course 6 • Development training aid</text><g font-family="Arial" font-size="14" fill="#26382f" stroke="#8da095" stroke-width="1.5"><rect x="48" y="118" width="720" height="125" fill="#f7f4ea"/><text x="62" y="143" stroke="none" font-weight="700">AUTHORIZATION / IDENTITY / DESTINATION</text><text x="62" y="172" stroke="none">Work order: _____________________ Room/batch: _____________________ Destination: _____________</text><text x="62" y="202" stroke="none">Source identity verified? ☐ yes ☐ conflict   Output labels staged? ☐ yes ☐ no</text><text x="62" y="230" stroke="none">Conflict / hold note: __________________________________________________________________</text><rect x="48" y="263" width="720" height="160" fill="#fff"/><text x="62" y="288" stroke="none" font-weight="700">SAFETY &amp; CLEAN-WORK READINESS</text><text x="62" y="317" stroke="none">☐ PPE verified  ☐ Pathway clear  ☐ Task hazards reviewed  ☐ Tools fit for use</text><text x="62" y="347" stroke="none">☐ Cart/container clean  ☐ Receiving rack/surface clean  ☐ Routine controls in place</text><text x="62" y="379" stroke="none">Changed condition during work: __________________________________________________________</text><text x="62" y="409" stroke="none">Decision: ☐ routine control ☐ stop/hold ☐ escalate   Reason: ______________________________</text><rect x="48" y="443" width="720" height="250" fill="#f7f4ea"/><text x="62" y="468" stroke="none" font-weight="700">SOURCE → OUTPUT GENEALOGY</text><text x="62" y="498" stroke="none">Source plant/batch ID: _________________________________________________________________</text><text x="62" y="530" stroke="none">Transformation/event: __________________________________________________________________</text><text x="62" y="562" stroke="none">New harvest/container/lot ID: ___________________________________________________________</text><text x="62" y="594" stroke="none">Destination/rack: __________________________  Quantity: __________  Units: __________</text><text x="62" y="626" stroke="none">Hold/waste/diverted quantity and status: __________________________________________________</text><text x="62" y="658" stroke="none">Source-to-output relationship verified before old identity obscured? ☐ yes ☐ unresolved</text><rect x="48" y="713" width="720" height="265" fill="#fff"/><text x="62" y="738" stroke="none" font-weight="700">EXCEPTION / ESCALATION / HANDOFF</text><text x="62" y="770" stroke="none">Identity / destination / safety / sanitation conflict: _________________________________________</text><text x="62" y="802" stroke="none">Authorized action taken: ______________________________________________________________</text><text x="62" y="834" stroke="none">Material/status preserved as: ☐ normal flow ☐ held ☐ isolated ☐ incomplete</text><text x="62" y="866" stroke="none">Escalated to / reason: _________________________________________________________________</text><text x="62" y="898" stroke="none">Unresolved condition: __________________________________________________________________</text><text x="62" y="930" stroke="none">Next action / receiving role: ____________________________________________________________</text><text x="62" y="962" stroke="none">Do not improvise a destination, identity, repair or product-release decision.</text></g><text x="48" y="1020" font-family="Arial" font-size="12" fill="#6a645c">Preserve identity and current state whenever an unresolved safety, sanitation, destination or genealogy conflict stops normal movement.</text></svg>