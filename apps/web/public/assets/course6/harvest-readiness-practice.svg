<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Harvest readiness practice worksheet</title><desc id="d">A printable worksheet for recording harvest authorization, source identity, destination, PPE, pathways, tool and cart sanitation, labels, changed conditions, stop or hold decisions, escalation, and readiness status.</desc><rect width="1200" height="900" fill="#fffdf6"/><g font-family="Arial"><text x="55" y="65" font-size="34" font-weight="700" fill="#173f2a">Harvest readiness practice</text><text x="55" y="98" font-size="17" fill="#5c645f">Record supplied facts. Do not invent authorization, destination, identity or release status.</text><g fill="none" stroke="#35664a" stroke-width="2"><rect x="55" y="135" width="1090" height="115" rx="12"/><rect x="55" y="275" width="1090" height="195" rx="12"/><rect x="55" y="495" width="1090" height="170" rx="12"/><rect x="55" y="690" width="1090" height="145" rx="12"/></g><g font-size="19" fill="#173f2a" font-weight="700"><text x="80" y="172">IDENTITY &amp; AUTHORIZATION</text><text x="80" y="312">READINESS CHECK</text><text x="80" y="532">CHANGED CONDITION / EXCEPTION</text><text x="80" y="727">DECISION &amp; HANDOFF</text></g><g font-size="16" fill="#35493d"><text x="80" y="205">Work order: __________________________   Room/batch: __________________________</text><text x="80" y="232">Assigned destination: ______________________________   Time: ________________</text><text x="80" y="350">PPE: ☐ verified  ☐ issue noted       Pathways: ☐ clear  ☐ issue noted</text><text x="80" y="382">Tools: ☐ ready/clean  ☐ issue noted   Cart/container: ☐ ready/clean  ☐ issue noted</text><text x="80" y="414">Receiving location: ☐ verified/ready  ☐ unavailable/dirty/other exception</text><text x="80" y="446">Labels/output IDs staged: ☐ yes  ☐ no      Other required checks: __________________________</text><text x="80" y="570">What changed or conflicted? _________________________________________________________</text><text x="80" y="603">Observed evidence: _________________________________________________________________</text><text x="80" y="636">Routine control permitted by procedure: ______________________________________________</text><text x="80" y="764">Decision: ☐ proceed  ☐ stop  ☐ hold  ☐ escalate      Who/role notified: ___________________</text><text x="80" y="797">Condition required before work resumes: ______________________________________________</text><text x="80" y="824">Final readiness status: ______________________________________________________________</text></g><text x="55" y="875" font-size="15" fill="#6a645c">Technician I applies authorized routine controls and stops or escalates unresolved safety, identity, sanitation or destination conflicts.</text></g></svg>