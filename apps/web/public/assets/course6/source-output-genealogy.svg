<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Source-to-output harvest genealogy</title><desc id="d">A traceability diagram links an authorized source batch through a harvest transformation event to multiple identified output containers and dry-room destinations, including a held output, while preserving source identity, time, quantity, location, and status.</desc><rect width="1200" height="800" fill="#f7f4ea"/><g font-family="Arial"><text x="60" y="72" font-size="36" font-weight="700" fill="#173f2a">Harvest genealogy: new identifiers extend the source chain</text><rect x="80" y="160" width="270" height="145" rx="20" fill="#e5efe7" stroke="#35664a" stroke-width="3"/><text x="120" y="205" font-size="24" font-weight="700" fill="#173f2a">SOURCE BATCH</text><text x="120" y="242" font-size="18" fill="#35493d">Room / plant / batch identity</text><text x="120" y="273" font-size="18" fill="#35493d">Authorization + source quantity</text><rect x="465" y="160" width="270" height="145" rx="20" fill="#fff" stroke="#9c6d36" stroke-width="3"/><text x="500" y="205" font-size="24" font-weight="700" fill="#7b4d1f">TRANSFORMATION</text><text x="500" y="242" font-size="18" fill="#4d473f">Harvest event • time • operator</text><text x="500" y="273" font-size="18" fill="#4d473f">Source → output link recorded</text><path d="M350 232H465" stroke="#35664a" stroke-width="5"/><g fill="#e5efe7" stroke="#35664a" stroke-width="3"><rect x="835" y="110" width="290" height="120" rx="18"/><rect x="835" y="280" width="290" height="120" rx="18"/></g><rect x="835" y="450" width="290" height="120" rx="18" fill="#f8e5df" stroke="#9b4438" stroke-width="3"/><path d="M735 232H790V170H835M790 232V340H835M790 232V510H835" fill="none" stroke="#35664a" stroke-width="5"/><text x="875" y="150" font-size="21" font-weight="700" fill="#173f2a">OUTPUT A</text><text x="875" y="184" font-size="17" fill="#35493d">Container / lot ID • Rack 1</text><text x="875" y="211" font-size="17" fill="#35493d">Quantity + received status</text><text x="875" y="320" font-size="21" font-weight="700" fill="#173f2a">OUTPUT B</text><text x="875" y="354" font-size="17" fill="#35493d">Container / lot ID • Rack 2</text><text x="875" y="381" font-size="17" fill="#35493d">Quantity + received status</text><text x="875" y="490" font-size="21" font-weight="700" fill="#8a2f25">OUTPUT C — HOLD</text><text x="875" y="524" font-size="17" fill="#5a3934">Identity and quantity retained</text><text x="875" y="551" font-size="17" fill="#5a3934">Hold reason + next review</text><rect x="110" y="585" width="980" height="125" rx="20" fill="#fff" stroke="#9c6d36" stroke-width="3"/><text x="150" y="628" font-size="23" font-weight="700" fill="#7b4d1f">Every output keeps the relationship to the source</text><text x="150" y="665" font-size="18" fill="#4d473f">Identity • event • time • source/destination • quantity • status • responsible record</text><text x="150" y="694" font-size="17" fill="#6a645c">A new label is not traceability unless the record connects it to the correct source transformation.</text></g></svg>