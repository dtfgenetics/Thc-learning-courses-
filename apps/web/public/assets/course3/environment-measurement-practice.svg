<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1540" role="img" aria-labelledby="title desc">
<title id="title">Environmental measurement record practice worksheet</title>
<desc id="desc">Printable practice worksheet for recording temperature, relative humidity, VPD, target or limit, measured values, sensor identity, location, time, alarm state, verification actions, uncertainty and escalation without inventing missing data.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#17352b}.h1{font-size:34px;font-weight:800}.h2{font-size:22px;font-weight:750}.body{font-size:18px}.small{font-size:15px}.label{font-size:16px;font-weight:750}.box{fill:#fff;stroke:#355f50;stroke-width:2}.soft{fill:#eef5ed;stroke:#55786b;stroke-width:1.5}.line{stroke:#7f9188;stroke-width:1.5}.check{fill:none;stroke:#355f50;stroke-width:2}
</style>
<rect width="1200" height="1540" fill="#f7f3e8"/>
<text x="60" y="65" class="h1">Environmental measurement record — practice sheet</text>
<text x="60" y="100" class="body">Practice separating supplied targets from observed values while preserving enough context to reconstruct the reading.</text>
<rect x="60" y="135" width="1080" height="145" rx="20" class="box"/><text x="85" y="172" class="h2">A · Observation context</text>
<text x="85" y="210" class="label">Room / zone / asset:</text><line x1="260" y1="214" x2="530" y2="214" class="line"/><text x="570" y="210" class="label">Date / time:</text><line x1="690" y1="214" x2="1085" y2="214" class="line"/>
<text x="85" y="250" class="label">Sensor / instrument ID:</text><line x1="280" y1="254" x2="530" y2="254" class="line"/><text x="570" y="250" class="label">Exact location / height:</text><line x1="760" y1="254" x2="1085" y2="254" class="line"/>
<rect x="60" y="310" width="1080" height="310" rx="20" class="box"/><text x="85" y="350" class="h2">B · Keep target and measurement separate</text>
<rect x="85" y="380" width="320" height="195" rx="16" class="soft"/><text x="110" y="415" class="h2">SUPPLIED TARGET / LIMIT</text><text x="110" y="453" class="label">Temperature:</text><line x1="225" y1="457" x2="365" y2="457" class="line"/><text x="110" y="493" class="label">RH:</text><line x1="155" y1="497" x2="365" y2="497" class="line"/><text x="110" y="533" class="label">VPD / other:</text><line x1="220" y1="537" x2="365" y2="537" class="line"/>
<rect x="440" y="380" width="320" height="195" rx="16" class="soft"/><text x="465" y="415" class="h2">OBSERVED / MEASURED</text><text x="465" y="453" class="label">Temperature:</text><line x1="580" y1="457" x2="720" y2="457" class="line"/><text x="465" y="493" class="label">RH:</text><line x1="510" y1="497" x2="720" y2="497" class="line"/><text x="465" y="533" class="label">VPD / other:</text><line x1="575" y1="537" x2="720" y2="537" class="line"/>
<rect x="795" y="380" width="320" height="195" rx="16" class="soft"/><text x="820" y="415" class="h2">ALARM / STATUS</text><rect x="825" y="445" width="20" height="20" class="check"/><text x="858" y="461" class="body">No alarm</text><rect x="825" y="485" width="20" height="20" class="check"/><text x="858" y="501" class="body">Alarm active / event</text><text x="825" y="540" class="small">Alarm ID / message:</text><line x1="965" y1="544" x2="1085" y2="544" class="line"/>
<rect x="60" y="650" width="1080" height="255" rx="20" class="box"/><text x="85" y="690" class="h2">C · Is the reading representative?</text><text x="85" y="730" class="label">Placement / local influences observed:</text><line x1="355" y1="734" x2="1090" y2="734" class="line"/><text x="85" y="770" class="label">Comparison readings / peers:</text><line x1="315" y1="774" x2="1090" y2="774" class="line"/><text x="85" y="810" class="label">Verification / calibration status:</text><line x1="340" y1="814" x2="1090" y2="814" class="line"/><text x="85" y="850" class="label">Trend / logging context:</text><line x1="285" y1="854" x2="1090" y2="854" class="line"/><rect x="85" y="870" width="20" height="20" class="check"/><text x="118" y="887" class="small">Representative enough for task</text><rect x="375" y="870" width="20" height="20" class="check"/><text x="408" y="887" class="small">Suspect / incomplete</text><rect x="655" y="870" width="20" height="20" class="check"/><text x="688" y="887" class="small">Requires escalation / qualified review</text>
<rect x="60" y="935" width="1080" height="290" rx="20" class="box"/><text x="85" y="975" class="h2">D · Verification, uncertainty and escalation</text><text x="85" y="1015" class="label">Permitted verification actually performed:</text><line x1="85" y1="1045" x2="1090" y2="1045" class="line"/><line x1="85" y1="1080" x2="1090" y2="1080" class="line"/><text x="85" y="1120" class="label">What remains unresolved / uncertain:</text><line x1="85" y1="1150" x2="1090" y2="1150" class="line"/><line x1="85" y1="1185" x2="1090" y2="1185" class="line"/>
<rect x="60" y="1255" width="1080" height="205" rx="20" class="box"/><text x="85" y="1295" class="h2">E · Handoff</text><text x="85" y="1335" class="label">Who was notified / escalation status:</text><line x1="370" y1="1339" x2="1090" y2="1339" class="line"/><text x="85" y="1375" class="label">Next required check / owner:</text><line x1="310" y1="1379" x2="1090" y2="1379" class="line"/><text x="85" y="1415" class="label">Receiving person cross-check / question:</text><line x1="390" y1="1419" x2="1090" y2="1419" class="line"/>
<text x="60" y="1500" class="small">Practice rule: do not backfill a missed measurement from memory as though it were observed. Preserve uncertainty instead of inventing a value or root cause.</text>
</svg>