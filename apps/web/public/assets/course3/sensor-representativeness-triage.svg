<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Sensor placement and representativeness triage</title>
  <desc id="desc">Educational diagram showing three environmental sensors in different room positions: a canopy-zone sensor, a wall sensor and a sensor near an air outlet. A six-step workflow checks location, peer agreement, verification status, trend context, authorized operator checks and escalation before treating an outlier as representative.</desc>
  <style>
    text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#17352b}.h1{font-size:34px;font-weight:800}.h2{font-size:22px;font-weight:750}.body{font-size:18px}.small{font-size:15px}.label{font-size:16px;font-weight:750}.card{fill:#fffdf7;stroke:#355f50;stroke-width:2}.soft{fill:#eef5ed}.warn{fill:#f6efe0;stroke:#9a7e47;stroke-width:2}.accent{fill:#dcebdd;stroke:#355f50;stroke-width:2}.line{stroke:#355f50;stroke-width:3;fill:none}.air{stroke:#729b8c;stroke-width:4;fill:none;stroke-linecap:round}.plant{stroke:#4c765d;stroke-width:5;fill:none;stroke-linecap:round}
  </style>
  <rect width="1200" height="760" fill="#f7f3e8"/>
  <text x="60" y="64" class="h1">Does the sensor represent the crop question?</text>
  <text x="60" y="98" class="body">A plausible number can describe a local microclimate without representing the whole room or canopy.</text>

  <rect x="60" y="135" width="570" height="430" rx="24" class="card"/>
  <text x="90" y="175" class="h2">Placement changes what the reading describes</text>
  <rect x="90" y="205" width="510" height="305" rx="18" class="soft"/>
  <line x1="115" y1="455" x2="575" y2="455" class="line"/>
  <path d="M250 455 C248 420 230 396 210 377 M250 430 C275 410 290 385 295 360 M250 416 C230 400 220 380 218 360" class="plant"/>
  <path d="M390 455 C390 418 370 395 352 378 M390 430 C415 410 430 387 432 362 M390 414 C368 397 360 380 360 360" class="plant"/>
  <path d="M520 455 C520 420 500 397 482 380 M520 431 C544 411 556 390 560 368 M520 416 C500 401 490 383 490 364" class="plant"/>

  <rect x="320" y="300" width="64" height="44" rx="10" class="accent"/>
  <text x="337" y="328" class="label">A</text>
  <text x="145" y="295" class="small">Canopy-zone position</text>
  <path d="M270 298 L318 315" class="line"/>

  <rect x="112" y="235" width="64" height="44" rx="10" class="warn"/>
  <text x="130" y="263" class="label">B</text>
  <text x="192" y="253" class="small">Near wall / local boundary</text>
  <path d="M178 255 H190" class="line"/>

  <rect x="510" y="235" width="64" height="44" rx="10" class="warn"/>
  <text x="528" y="263" class="label">C</text>
  <path d="M560 220 C520 205 492 206 458 222" class="air"/>
  <path d="M560 202 C520 188 490 188 450 205" class="air"/>
  <text x="338" y="220" class="small">Air outlet / discharge influence</text>

  <text x="90" y="535" class="small">A, B and C may each be locally accurate. Their usefulness depends on the measurement purpose and context.</text>

  <rect x="675" y="135" width="465" height="500" rx="24" class="card"/>
  <text x="705" y="175" class="h2">Outlier triage before control changes</text>
  <g transform="translate(710 210)">
    <circle cx="24" cy="24" r="22" class="accent"/><text x="18" y="31" class="label">1</text><text x="62" y="20" class="label">Where is it?</text><text x="62" y="44" class="small">Crop position, wall, inlet/outlet, wet surface, fixture influence</text>
    <line x1="24" y1="48" x2="24" y2="78" class="line"/>
    <circle cx="24" cy="102" r="22" class="accent"/><text x="18" y="109" class="label">2</text><text x="62" y="98" class="label">Do peers agree?</text><text x="62" y="122" class="small">Compare nearby independent readings or supplied reference checks</text>
    <line x1="24" y1="126" x2="24" y2="156" class="line"/>
    <circle cx="24" cy="180" r="22" class="accent"/><text x="18" y="187" class="label">3</text><text x="62" y="176" class="label">Is verification current?</text><text x="62" y="200" class="small">Check calibration/comparison status without inventing a repair</text>
    <line x1="24" y1="204" x2="24" y2="234" class="line"/>
    <circle cx="24" cy="258" r="22" class="accent"/><text x="18" y="265" class="label">4</text><text x="62" y="254" class="label">What does the trend/log say?</text><text x="62" y="278" class="small">Timing, equipment cycles and logging interval can add context</text>
    <line x1="24" y1="282" x2="24" y2="312" class="line"/>
    <circle cx="24" cy="336" r="22" class="accent"/><text x="18" y="343" class="label">5</text><text x="62" y="332" class="label">What check is authorized?</text><text x="62" y="356" class="small">Use only supplied operator-level readiness/verification steps</text>
    <line x1="24" y1="360" x2="24" y2="390" class="line"/>
    <circle cx="24" cy="414" r="22" class="warn"/><text x="18" y="421" class="label">6</text><text x="62" y="410" class="label">Escalate unresolved faults</text><text x="62" y="434" class="small">Do not perform unauthorized repair, calibration or control redesign</text>
  </g>

  <rect x="60" y="660" width="1080" height="60" rx="18" class="accent"/>
  <text x="84" y="696" class="label">Key rule:</text>
  <text x="170" y="696" class="body">Outlier ≠ bad sensor, and outlier ≠ room-wide condition. Preserve context, verify within procedure, then escalate.</text>
</svg>
