<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1540" role="img" aria-labelledby="title desc">
<title id="title">PPFD grid and sensor verification practice worksheet</title>
<desc id="desc">Printable worksheet with a nine-point canopy PPFD grid, measurement-method fields, photoperiod comparison, sensor outlier triage, operator-authority boundary and handoff fields. It is intended for practice and contains no universal target values.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#17352b}.h1{font-size:34px;font-weight:800}.h2{font-size:22px;font-weight:750}.body{font-size:18px}.small{font-size:15px}.label{font-size:16px;font-weight:750}.box{fill:#fff;stroke:#355f50;stroke-width:2}.soft{fill:#eef5ed;stroke:#55786b;stroke-width:1.5}.line{stroke:#7f9188;stroke-width:1.5}.check{fill:none;stroke:#355f50;stroke-width:2}
</style>
<rect width="1200" height="1540" fill="#f7f3e8"/>
<text x="60" y="65" class="h1">PPFD grid + sensor verification — practice sheet</text>
<text x="60" y="100" class="body">Use supplied scenario targets and instrument instructions. This sheet does not prescribe universal cannabis light or environment targets.</text>
<rect x="60" y="135" width="1080" height="155" rx="20" class="box"/><text x="85" y="175" class="h2">A · Measurement method</text><text x="85" y="215" class="label">Room / canopy area:</text><line x1="255" y1="219" x2="525" y2="219" class="line"/><text x="565" y="215" class="label">Date / time:</text><line x1="680" y1="219" x2="1090" y2="219" class="line"/><text x="85" y="255" class="label">Meter / sensor ID:</text><line x1="245" y1="259" x2="525" y2="259" class="line"/><text x="565" y="255" class="label">Measurement height / orientation:</text><line x1="825" y1="259" x2="1090" y2="259" class="line"/>
<rect x="60" y="320" width="650" height="545" rx="20" class="box"/><text x="85" y="360" class="h2">B · Record every PPFD point</text><text x="85" y="392" class="small">Write measured values with the same defined height/orientation at each position.</text>
<g transform="translate(115 430)">
<rect x="0" y="0" width="160" height="115" rx="12" class="soft"/><text x="18" y="30" class="label">P1</text><line x1="35" y1="70" x2="125" y2="70" class="line"/><rect x="175" y="0" width="160" height="115" rx="12" class="soft"/><text x="193" y="30" class="label">P2</text><line x1="210" y1="70" x2="300" y2="70" class="line"/><rect x="350" y="0" width="160" height="115" rx="12" class="soft"/><text x="368" y="30" class="label">P3</text><line x1="385" y1="70" x2="475" y2="70" class="line"/>
<rect x="0" y="130" width="160" height="115" rx="12" class="soft"/><text x="18" y="160" class="label">P4</text><line x1="35" y1="200" x2="125" y2="200" class="line"/><rect x="175" y="130" width="160" height="115" rx="12" class="soft"/><text x="193" y="160" class="label">P5</text><line x1="210" y1="200" x2="300" y2="200" class="line"/><rect x="350" y="130" width="160" height="115" rx="12" class="soft"/><text x="368" y="160" class="label">P6</text><line x1="385" y1="200" x2="475" y2="200" class="line"/>
<rect x="0" y="260" width="160" height="115" rx="12" class="soft"/><text x="18" y="290" class="label">P7</text><line x1="35" y1="330" x2="125" y2="330" class="line"/><rect x="175" y="260" width="160" height="115" rx="12" class="soft"/><text x="193" y="290" class="label">P8</text><line x1="210" y1="330" x2="300" y2="330" class="line"/><rect x="350" y="260" width="160" height="115" rx="12" class="soft"/><text x="368" y="290" class="label">P9</text><line x1="385" y1="330" x2="475" y2="330" class="line"/>
</g><text x="100" y="825" class="small">Units: µmol·m⁻²·s⁻¹ · Keep all points. Do not substitute the brightest point for the canopy.</text>
<rect x="745" y="320" width="395" height="545" rx="20" class="box"/><text x="770" y="360" class="h2">C · Summarize without hiding distribution</text><text x="770" y="410" class="label">Average (if required):</text><line x1="940" y1="414" x2="1100" y2="414" class="line"/><text x="770" y="455" class="label">Minimum:</text><line x1="860" y1="459" x2="1100" y2="459" class="line"/><text x="770" y="500" class="label">Maximum:</text><line x1="865" y1="504" x2="1100" y2="504" class="line"/><text x="770" y="545" class="label">Range / required uniformity:</text><line x1="995" y1="549" x2="1100" y2="549" class="line"/><text x="770" y="600" class="label">Spatial difference needing follow-up:</text><line x1="770" y1="632" x2="1100" y2="632" class="line"/><line x1="770" y1="665" x2="1100" y2="665" class="line"/><text x="770" y="715" class="label">Supplied photoperiod:</text><line x1="950" y1="719" x2="1100" y2="719" class="line"/><text x="770" y="758" class="label">Observed controller / light state:</text><line x1="770" y1="790" x2="1100" y2="790" class="line"/><text x="770" y="835" class="small">Record discrepancy; do not independently redesign schedule.</text>
<rect x="60" y="900" width="1080" height="315" rx="20" class="box"/><text x="85" y="940" class="h2">D · Sensor outlier verification</text><text x="85" y="980" class="label">Outlier / sensor ID:</text><line x1="245" y1="984" x2="480" y2="984" class="line"/><text x="520" y="980" class="label">Reading / units:</text><line x1="655" y1="984" x2="1090" y2="984" class="line"/><text x="85" y="1025" class="label">Placement / local influence:</text><line x1="300" y1="1029" x2="1090" y2="1029" class="line"/><text x="85" y="1070" class="label">Peer / comparison evidence:</text><line x1="315" y1="1074" x2="1090" y2="1074" class="line"/><text x="85" y="1115" class="label">Verification / calibration status:</text><line x1="345" y1="1119" x2="1090" y2="1119" class="line"/><text x="85" y="1160" class="label">Trend / logging context:</text><line x1="290" y1="1164" x2="1090" y2="1164" class="line"/><rect x="85" y="1180" width="20" height="20" class="check"/><text x="118" y="1197" class="small">Representative</text><rect x="280" y="1180" width="20" height="20" class="check"/><text x="313" y="1197" class="small">Suspect / incomplete</text><rect x="535" y="1180" width="20" height="20" class="check"/><text x="568" y="1197" class="small">Escalate</text>
<rect x="60" y="1245" width="1080" height="215" rx="20" class="box"/><text x="85" y="1285" class="h2">E · Authority and handoff</text><text x="85" y="1325" class="label">Permitted operator-level check performed:</text><line x1="405" y1="1329" x2="1090" y2="1329" class="line"/><text x="85" y="1365" class="label">Unresolved issue / action outside authority:</text><line x1="425" y1="1369" x2="1090" y2="1369" class="line"/><text x="85" y="1405" class="label">Escalation / receiving-shift next check:</text><line x1="400" y1="1409" x2="1090" y2="1409" class="line"/>
<text x="60" y="1500" class="small">Practice rule: recognize and document measurement problems; do not perform unauthorized repair, protected calibration, fixture redesign or control-strategy changes.</text>
</svg>