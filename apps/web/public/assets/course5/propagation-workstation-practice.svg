<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" role="img" aria-labelledby="t d"><title id="t">Propagation workstation practice worksheet</title><desc id="d">A printable worksheet for donor identity, work-order verification, sanitation checkpoints, tray labels, propagation counts, rooting observations, exceptions, quarantine or isolation actions, and handoff.</desc><rect width="816" height="1056" fill="#fff"/><g font-family="Arial" fill="#173f2a"><text x="48" y="58" font-size="28" font-weight="700">Propagation Workstation Practice</text><text x="48" y="88" font-size="14" fill="#526158">Practice form • Course 5 • Development training aid</text></g><g font-family="Arial" font-size="14" fill="#26382f" stroke="#8da095" stroke-width="1.5"><rect x="48" y="120" width="720" height="95" fill="#f7f4ea"/><text x="62" y="145" stroke="none" font-weight="700">IDENTITY &amp; WORK ORDER</text><text x="62" y="171" stroke="none">Donor/source: _____________________  Lot/batch: _____________________  Target count: __________</text><text x="62" y="196" stroke="none">Tray/destination: _________________________________  Work-order check: _______________________</text><rect x="48" y="235" width="720" height="125" fill="#fff"/><text x="62" y="260" stroke="none" font-weight="700">SANITATION &amp; BIOSECURITY CHECKPOINTS</text><text x="62" y="289" stroke="none">☐ Work surface prepared   ☐ Tools/PPE prepared   ☐ Labels staged before handling</text><text x="62" y="317" stroke="none">☐ Clean-to-dirty sequence followed   ☐ Suspect material isolated/held when required</text><text x="62" y="345" stroke="none">Breach / exception note: ______________________________________________________________</text><rect x="48" y="380" width="720" height="210" fill="#f7f4ea"/><text x="62" y="405" stroke="none" font-weight="700">TRAY MAP / IDENTITY CONTROL</text><path d="M70 435H746M70 475H746M70 515H746M70 555H746M180 425V575M300 425V575M420 425V575M540 425V575M660 425V575" fill="none"/><text x="62" y="584" stroke="none" font-size="12">Use cells for tray position, label, donor/lot code, hold status, or count notes.</text><rect x="48" y="610" width="720" height="135" fill="#fff"/><text x="62" y="635" stroke="none" font-weight="700">COUNT RECONCILIATION</text><text x="62" y="665" stroke="none">Started: ______  Rooted/usable: ______  Lost/rejected: ______  Held: ______  Handed off: ______</text><text x="62" y="695" stroke="none">Difference explained? _________________________________________________________________</text><text x="62" y="724" stroke="none">Do not invent identity or count values to force reconciliation.</text><rect x="48" y="765" width="720" height="225" fill="#f7f4ea"/><text x="62" y="790" stroke="none" font-weight="700">CONDITION, EXCEPTION &amp; HANDOFF</text><text x="62" y="820" stroke="none">Observed rooting/seedling condition: ____________________________________________________</text><text x="62" y="850" stroke="none">Exception / uncertainty: _______________________________________________________________</text><text x="62" y="880" stroke="none">Authorized action taken: ______________________________________________________________</text><text x="62" y="910" stroke="none">Isolation / quarantine status: __________________________________________________________</text><text x="62" y="940" stroke="none">Escalated to / reason: _________________________________________________________________</text><text x="62" y="970" stroke="none">Next action / receiving role: __________________________________________________________</text></g><text x="48" y="1022" font-family="Arial" font-size="12" fill="#6a645c">Scope: controlled propagation execution and documentation. No independent protocol redesign or treatment selection.</text></svg>