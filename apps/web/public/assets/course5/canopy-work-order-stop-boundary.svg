<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Canopy work-order and stop-boundary visual</title><desc id="d">A canopy-maintenance decision path showing identity and condition checks, authorized task execution, stop conditions, sanitation, and truthful completion records.</desc><rect width="1200" height="800" fill="#f7f4ea"/><text x="60" y="75" font-size="36" font-family="Arial" font-weight="700" fill="#173f2a">Canopy work: follow the standard, protect the plant</text><g font-family="Arial"><rect x="70" y="145" width="245" height="160" rx="20" fill="#e5efe7" stroke="#35664a" stroke-width="3"/><rect x="365" y="145" width="245" height="160" rx="20" fill="#e5efe7" stroke="#35664a" stroke-width="3"/><rect x="660" y="145" width="245" height="160" rx="20" fill="#e5efe7" stroke="#35664a" stroke-width="3"/><text x="105" y="190" font-size="24" font-weight="700" fill="#173f2a">Inspect first</text><text x="400" y="190" font-size="24" font-weight="700" fill="#173f2a">Execute scope</text><text x="695" y="190" font-size="24" font-weight="700" fill="#173f2a">Verify result</text><g font-size="18" fill="#35493d"><text x="105" y="228">Room / batch / stage</text><text x="105" y="258">Vigor / damage / pest concern</text><text x="400" y="228">Prune / support / space</text><text x="400" y="258">Only to supplied criteria</text><text x="695" y="228">Compare with work objective</text><text x="695" y="258">Record actual exceptions</text></g><path d="M315 225H365M610 225H660" stroke="#35664a" stroke-width="5"/><rect x="945" y="145" width="190" height="160" rx="20" fill="#fff" stroke="#9c6d36" stroke-width="3"/><text x="975" y="190" font-size="24" font-weight="700" fill="#7b4d1f">STOP / HOLD</text><g font-size="17" fill="#4d473f"><text x="970" y="225">Severe stress</text><text x="970" y="252">Tissue splitting</text><text x="970" y="279">Pest concern</text></g><rect x="120" y="390" width="960" height="250" rx="22" fill="#fff" stroke="#35664a" stroke-width="3"/><text x="155" y="440" font-size="27" font-weight="700" fill="#173f2a">Decision rule</text><text x="155" y="490" font-size="21" fill="#35493d">Authorized, clear instruction + suitable plant condition → perform the defined task consistently.</text><text x="155" y="535" font-size="21" fill="#35493d">Ambiguous instruction, fresh damage, pest concern, excessive tension, or condition outside criteria → stop, isolate if required, document, escalate.</text><text x="155" y="590" font-size="19" fill="#6a645c">Technician I executes the work order. Personal preference does not authorize extra tissue removal, a different training strategy, or continued work through a stop condition.</text></g></svg>