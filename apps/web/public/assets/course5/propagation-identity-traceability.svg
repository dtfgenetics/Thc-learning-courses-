<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Propagation identity and traceability workflow</title><desc id="d">A controlled propagation workflow from verified donor identity through tray labeling, count reconciliation, exception handling, and handoff. Identity uncertainty stops movement rather than being guessed.</desc><rect width="1200" height="800" fill="#f7f4ea"/><text x="60" y="78" font-size="36" font-family="Arial" font-weight="700" fill="#173f2a">Propagation: identity stays attached to the plant</text><text x="60" y="118" font-size="20" font-family="Arial" fill="#405247">Verify before cutting, moving, transplanting, or relabeling.</text><g font-family="Arial"><g fill="#e5efe7" stroke="#35664a" stroke-width="3"><rect x="70" y="185" width="205" height="150" rx="18"/><rect x="330" y="185" width="205" height="150" rx="18"/><rect x="590" y="185" width="205" height="150" rx="18"/><rect x="850" y="185" width="265" height="150" rx="18"/></g><g fill="#173f2a" font-size="24" font-weight="700"><text x="100" y="225">1. Verify source</text><text x="360" y="225">2. Stage labels</text><text x="620" y="225">3. Execute</text><text x="880" y="225">4. Reconcile</text></g><g fill="#35493d" font-size="18"><text x="100" y="260">Donor / lot / work order</text><text x="100" y="290">Target count / destination</text><text x="360" y="260">Tray / position / batch</text><text x="360" y="290">Labels before movement</text><text x="620" y="260">Authorized method only</text><text x="620" y="290">Sanitation checkpoints</text><text x="880" y="260">Started / rooted / lost</text><text x="880" y="290">Moved / held / handed off</text></g><g stroke="#35664a" stroke-width="5" fill="none"><path d="M275 260H330"/><path d="M535 260H590"/><path d="M795 260H850"/></g><rect x="95" y="430" width="1010" height="220" rx="20" fill="#fff" stroke="#9c6d36" stroke-width="3"/><text x="130" y="480" font-size="26" font-weight="700" fill="#7b4d1f">Identity or condition conflict?</text><text x="130" y="525" font-size="21" fill="#4d473f">STOP movement • preserve the physical count • hold/isolate as procedure requires • document the discrepancy</text><text x="130" y="565" font-size="21" fill="#4d473f">Resolve from approved records or escalation — not leaf shape, memory, or a convenient relabel.</text><text x="130" y="615" font-size="18" fill="#6a645c">Scope: traceability and controlled propagation execution. This visual does not prescribe propagation recipes or treatment products.</text></g></svg>