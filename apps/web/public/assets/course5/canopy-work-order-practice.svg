<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" role="img" aria-labelledby="t d"><title id="t">Canopy maintenance work-order practice worksheet</title><desc id="d">A printable worksheet for room and work-order identity, pre-task plant inspection, authorized canopy action, stop conditions, sanitation and quarantine, before/after evaluation, exceptions, and handoff.</desc><rect width="816" height="1056" fill="#fff"/><text x="48" y="58" font-family="Arial" font-size="28" font-weight="700" fill="#173f2a">Canopy Maintenance Work-Order Practice</text><text x="48" y="88" font-family="Arial" font-size="14" fill="#526158">Course 5 • Follow supplied criteria; preserve tissue, sanitation, and exceptions</text><g font-family="Arial" font-size="14" fill="#26382f" stroke="#8da095" stroke-width="1.5"><rect x="48" y="118" width="720" height="105" fill="#f7f4ea"/><text x="62" y="143" stroke="none" font-weight="700">WORK ORDER &amp; IDENTITY</text><text x="62" y="171" stroke="none">Room/zone: __________________  Batch/cultivar: __________________  Stage: __________________</text><text x="62" y="199" stroke="none">Assigned canopy objective / criteria: ____________________________________________________</text><rect x="48" y="243" width="720" height="160" fill="#fff"/><text x="62" y="268" stroke="none" font-weight="700">PRE-TASK PLANT CONDITION</text><text x="62" y="298" stroke="none">☐ Suitable for routine work  ☐ Severe stress  ☐ Existing damage  ☐ Pest/disease concern</text><text x="62" y="330" stroke="none">Plant(s)/location requiring exception handling: ____________________________________________</text><text x="62" y="362" stroke="none">Reason / evidence: ___________________________________________________________________</text><text x="62" y="392" stroke="none">Decision: ☐ proceed ☐ hold/stop ☐ clarify instruction ☐ escalate</text><rect x="48" y="423" width="720" height="175" fill="#f7f4ea"/><text x="62" y="448" stroke="none" font-weight="700">AUTHORIZED ACTION &amp; SANITATION</text><text x="62" y="479" stroke="none">Action performed: ☐ pruning ☐ defoliation ☐ support ☐ spacing ☐ repositioning ☐ other _______</text><text x="62" y="511" stroke="none">Sanitation/tool-control checkpoint: ________________________________________________________</text><text x="62" y="543" stroke="none">Quarantine/isolation boundary if applicable: ______________________________________________</text><text x="62" y="575" stroke="none">No extra technique or irreversible tissue removal outside supplied criteria.</text><rect x="48" y="618" width="720" height="160" fill="#fff"/><text x="62" y="643" stroke="none" font-weight="700">BEFORE / AFTER CONSISTENCY CHECK</text><text x="62" y="674" stroke="none">Did result satisfy supplied structural objective? ☐ yes ☐ partial ☐ no</text><text x="62" y="706" stroke="none">Tissue damage / excessive tension / support risk observed: __________________________________</text><text x="62" y="738" stroke="none">Plant(s) needing recovery/follow-up: _____________________________________________________</text><text x="62" y="768" stroke="none">Actual scope completed: ________________________________________________________________</text><rect x="48" y="798" width="720" height="190" fill="#f7f4ea"/><text x="62" y="823" stroke="none" font-weight="700">EXCEPTION &amp; HANDOFF</text><text x="62" y="854" stroke="none">Exception / unresolved condition: _________________________________________________________</text><text x="62" y="886" stroke="none">Authorized response taken: ______________________________________________________________</text><text x="62" y="918" stroke="none">Escalated to / reason: _________________________________________________________________</text><text x="62" y="950" stroke="none">Next action / receiving role: ____________________________________________________________</text></g><text x="48" y="1020" font-family="Arial" font-size="12" fill="#6a645c">Scope: execute the work order consistently. Do not turn routine canopy work into independent crop-strategy redesign.</text></svg>