<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">IPM scouting route and spatial-pattern visual</title><desc id="d">A room map with a repeatable scouting route through edge, center, intake, and process-adjacent locations, emphasizing representative inspection and mapping of findings rather than scouting only damaged plants.</desc><rect width="1200" height="800" fill="#f7f4ea"/><text x="60" y="72" font-size="36" font-family="Arial" font-weight="700" fill="#173f2a">IPM scouting: repeatable route + mapped evidence</text><text x="60" y="112" font-size="20" font-family="Arial" fill="#405247">Distribution matters. A dramatic close-up does not describe the whole room.</text><g font-family="Arial"><rect x="75" y="160" width="760" height="510" rx="24" fill="#fff" stroke="#35664a" stroke-width="4"/><text x="100" y="200" font-size="21" font-weight="700" fill="#173f2a">Example room map</text><g fill="#e5efe7" stroke="#93aa9a" stroke-width="2"><rect x="120" y="235" width="140" height="100"/><rect x="300" y="235" width="140" height="100"/><rect x="480" y="235" width="140" height="100"/><rect x="660" y="235" width="120" height="100"/><rect x="120" y="390" width="140" height="100"/><rect x="300" y="390" width="140" height="100"/><rect x="480" y="390" width="140" height="100"/><rect x="660" y="390" width="120" height="100"/></g><path d="M100 590 C190 520 170 315 300 290 S505 520 650 440 S720 235 790 255" fill="none" stroke="#35664a" stroke-width="8" stroke-dasharray="14 10"/><g fill="#9c6d36"><circle cx="155" cy="540" r="12"/><circle cx="220" cy="300" r="12"/><circle cx="380" cy="450" r="12"/><circle cx="545" cy="285" r="12"/><circle cx="700" cy="445" r="12"/><circle cx="760" cy="275" r="12"/></g><text x="105" y="635" font-size="17" fill="#526158">Include edge • center • intake/high-risk • canopy levels • leaf surfaces • traps</text><rect x="875" y="160" width="250" height="510" rx="24" fill="#fff" stroke="#9c6d36" stroke-width="3"/><text x="905" y="205" font-size="24" font-weight="700" fill="#7b4d1f">Record layers</text><g font-size="18" fill="#4d473f"><text x="905" y="250">1. Exact location</text><text x="905" y="290">2. Sign or symptom</text><text x="905" y="330">3. Incidence</text><text x="905" y="370">4. Severity</text><text x="905" y="410">5. Spatial pattern</text><text x="905" y="450">6. Trend vs prior round</text><text x="905" y="500">7. Quarantine / isolation</text><text x="905" y="540">8. Escalation status</text></g><text x="905" y="600" font-size="16" fill="#6a645c">Scouting evidence supports investigation; it does not grant pesticide-treatment authority.</text></g></svg>