<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Biosecurity, clean-to-dirty and quarantine workflow</title><desc id="d">A workflow showing clean-to-dirty movement, sanitation checkpoints, suspect material isolation, quarantine boundaries, and documentation across propagation, canopy work, and scouting.</desc><rect width="1200" height="800" fill="#f7f4ea"/><text x="60" y="72" font-size="36" font-family="Arial" font-weight="700" fill="#173f2a">Biosecurity: movement is part of the task</text><text x="60" y="112" font-size="20" font-family="Arial" fill="#405247">Propagation • canopy work • scouting</text><g font-family="Arial"><g fill="#e5efe7" stroke="#35664a" stroke-width="3"><rect x="70" y="180" width="230" height="150" rx="18"/><rect x="350" y="180" width="230" height="150" rx="18"/><rect x="630" y="180" width="230" height="150" rx="18"/></g><text x="105" y="225" font-size="24" font-weight="700" fill="#173f2a">CLEAN AREA</text><text x="385" y="225" font-size="24" font-weight="700" fill="#173f2a">WORK AREA</text><text x="665" y="225" font-size="24" font-weight="700" fill="#173f2a">DIRTY / SUSPECT</text><g font-size="18" fill="#35493d"><text x="105" y="265">Prepared tools / PPE</text><text x="105" y="292">Verified material</text><text x="385" y="265">Defined route / task</text><text x="385" y="292">Sanitation checkpoints</text><text x="665" y="265">Suspect plant / tray</text><text x="665" y="292">Contaminated tool / waste</text></g><path d="M300 255H350M580 255H630" stroke="#35664a" stroke-width="6"/><rect x="910" y="180" width="220" height="150" rx="18" fill="#fff" stroke="#9c6d36" stroke-width="3"/><text x="945" y="225" font-size="24" font-weight="700" fill="#7b4d1f">ISOLATE / HOLD</text><text x="945" y="265" font-size="18" fill="#4d473f">Apply supplied boundary</text><text x="945" y="292" font-size="18" fill="#4d473f">Do not move through clean zones</text><rect x="120" y="425" width="960" height="230" rx="22" fill="#fff" stroke="#35664a" stroke-width="3"/><text x="155" y="470" font-size="26" font-weight="700" fill="#173f2a">When a breach or suspect condition appears</text><text x="155" y="515" font-size="20" fill="#35493d">1. Stop or redirect movement according to procedure.</text><text x="155" y="550" font-size="20" fill="#35493d">2. Sanitize or segregate tools/material as required.</text><text x="155" y="585" font-size="20" fill="#35493d">3. Record location, identity, condition, boundary action, and any breach.</text><text x="155" y="620" font-size="20" fill="#35493d">4. Escalate unresolved conditions; do not self-authorize treatment or release.</text></g></svg>