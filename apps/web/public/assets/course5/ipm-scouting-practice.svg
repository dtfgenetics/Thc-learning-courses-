<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" role="img" aria-labelledby="t d"><title id="t">IPM scouting practice worksheet</title><desc id="d">A printable IPM scouting worksheet for route, observation locations, sign versus symptom classification, incidence, severity, spatial pattern, trend, quarantine action, and escalation without treatment selection.</desc><rect width="816" height="1056" fill="#fff"/><text x="48" y="58" font-family="Arial" font-size="28" font-weight="700" fill="#173f2a">IPM Scouting Route Practice</text><text x="48" y="88" font-family="Arial" font-size="14" fill="#526158">Course 5 • Record evidence, distribution, trend, and containment decisions</text><g font-family="Arial" font-size="14" fill="#26382f" stroke="#8da095" stroke-width="1.5"><rect x="48" y="118" width="720" height="85" fill="#f7f4ea"/><text x="62" y="143" stroke="none" font-weight="700">ROOM / ROUTE / SAMPLE</text><text x="62" y="170" stroke="none">Room/zone: __________________  Date/time: ______________  Route ID: __________  Sample n: ______</text><rect x="48" y="222" width="450" height="300" fill="#fff"/><text x="62" y="247" stroke="none" font-weight="700">ROOM MAP / FINDING LOCATIONS</text><path d="M72 275H475M72 335H475M72 395H475M72 455H475M145 265V505M225 265V505M305 265V505M385 265V505" fill="none"/><rect x="515" y="222" width="253" height="300" fill="#f7f4ea"/><text x="530" y="247" stroke="none" font-weight="700">EVIDENCE CLASSIFICATION</text><text x="530" y="278" stroke="none">☐ Symptom</text><text x="530" y="306" stroke="none">☐ Direct sign</text><text x="530" y="334" stroke="none">☐ Mechanical damage</text><text x="530" y="362" stroke="none">☐ Insufficient evidence</text><text x="530" y="402" stroke="none">Tissue/canopy level:</text><text x="530" y="428" stroke="none">________________________</text><text x="530" y="467" stroke="none">Trap / plant / point ID:</text><text x="530" y="493" stroke="none">________________________</text><rect x="48" y="542" width="720" height="150" fill="#fff"/><text x="62" y="567" stroke="none" font-weight="700">INCIDENCE / SEVERITY / PATTERN / TREND</text><text x="62" y="598" stroke="none">Affected units: ______ / ______ sampled  = incidence __________</text><text x="62" y="628" stroke="none">Severity category used: __________________  Result: __________________</text><text x="62" y="658" stroke="none">Pattern: ☐ isolated ☐ edge/intake ☐ clustered/zonal ☐ widespread ☐ other __________</text><text x="62" y="684" stroke="none">Trend vs prior round: ☐ stable ☐ increasing ☐ resolving ☐ no comparable prior data</text><rect x="48" y="712" width="720" height="260" fill="#f7f4ea"/><text x="62" y="737" stroke="none" font-weight="700">BIOSECURITY / QUARANTINE / ESCALATION</text><text x="62" y="768" stroke="none">Clean-to-dirty/tool-control action: ______________________________________________________</text><text x="62" y="800" stroke="none">Isolation/quarantine boundary applied or preserved: ______________________________________</text><text x="62" y="832" stroke="none">Observed evidence summary: _____________________________________________________________</text><text x="62" y="864" stroke="none">Uncertainty / what is NOT proven: _______________________________________________________</text><text x="62" y="896" stroke="none">Escalated to / reason: _________________________________________________________________</text><text x="62" y="928" stroke="none">Next scouting/follow-up action: _________________________________________________________</text></g><text x="48" y="1018" font-family="Arial" font-size="12" fill="#6a645c">Boundary: scouting and recognition do not authorize pesticide selection, mixing, application, re-entry, or other regulated treatment decisions.</text></svg>