<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Professional shift handoff and integrated technician workflow</title><desc id="desc">Course 1 handoff visual showing preparation, written status, two-way exchange, incoming cross-check, and explicit ownership of open conditions. A lower workflow ribbon connects safety, SOPs, biosecurity, traceability, equipment status, truthful records, and escalation to reinforce the integrated Technician I workflow.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#0d3b2a"/><stop offset="1" stop-color="#145c3d"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#567064"/></marker></defs><rect width="1200" height="900" rx="28" fill="#f7f5ec"/><rect width="1200" height="120" rx="28" fill="url(#g)"/><g font-family="Arial,sans-serif"><text x="55" y="47" fill="#f4d35e" font-size="18" font-weight="700">THC ACADEMY • COURSE 1 • PROFESSIONAL WORKFLOW</text><text x="55" y="90" fill="#fff" font-size="36" font-weight="800">Shift Handoff + Integrated Technician Workflow</text><text x="1115" y="47" text-anchor="end" fill="#dcefe4" font-size="17">Lessons 6.2–6.3</text><text x="1115" y="82" text-anchor="end" fill="#fff" font-size="18" font-weight="700">Make status transferable.</text><g fill="#fff" stroke="#d7d1c4" stroke-width="3"><rect x="35" y="160" width="205" height="165" rx="19"/><rect x="270" y="160" width="205" height="165" rx="19"/><rect x="505" y="160" width="205" height="165" rx="19"/><rect x="740" y="160" width="205" height="165" rx="19"/><rect x="975" y="160" width="190" height="165" rx="19"/></g><g text-anchor="middle" fill="#123d2c"><text x="137" y="202" font-size="21" font-weight="800">1 • Prepare</text><text x="137" y="239" font-size="15" fill="#607167">Review work, holds,</text><text x="137" y="264" font-size="15" fill="#607167">faults, deviations,</text><text x="137" y="289" font-size="15" fill="#607167">time-critical items</text><text x="372" y="202" font-size="21" font-weight="800">2 • Write</text><text x="372" y="239" font-size="15" fill="#607167">Exact IDs, times, facts,</text><text x="372" y="264" font-size="15" fill="#607167">completed work and</text><text x="372" y="289" font-size="15" fill="#607167">open status</text><text x="607" y="202" font-size="21" font-weight="800">3 • Exchange</text><text x="607" y="239" font-size="15" fill="#607167">Outgoing explains;</text><text x="607" y="264" font-size="15" fill="#607167">incoming asks and</text><text x="607" y="289" font-size="15" fill="#607167">confirms meaning</text><text x="842" y="202" font-size="21" font-weight="800">4 • Cross-check</text><text x="842" y="239" font-size="15" fill="#607167">Compare record, room,</text><text x="842" y="264" font-size="15" fill="#607167">equipment status and</text><text x="842" y="289" font-size="15" fill="#607167">critical open items</text><text x="1070" y="202" font-size="21" font-weight="800">5 • Own next action</text><text x="1070" y="239" font-size="15" fill="#607167">Who follows up?</text><text x="1070" y="264" font-size="15" fill="#607167">By when?</text><text x="1070" y="289" font-size="15" fill="#607167">What stays blocked?</text></g><g stroke="#567064" stroke-width="4" marker-end="url(#a)"><path d="M240 242 H260"/><path d="M475 242 H495"/><path d="M710 242 H730"/><path d="M945 242 H965"/></g><rect x="85" y="370" width="1030" height="210" rx="22" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="600" y="412" text-anchor="middle" fill="#123d2c" font-size="24" font-weight="800">Put unresolved or safety-critical information first</text><g fill="#123d2c" font-size="18"><text x="130" y="458">• safety, entry, quarantine or hold restrictions</text><text x="130" y="499">• crop / material identity and abnormal observations</text><text x="130" y="540">• incomplete work and open deviations</text><text x="660" y="458">• equipment alarms / faults and tickets</text><text x="660" y="499">• people notified and decisions pending</text><text x="660" y="540">• time-sensitive next actions and due times</text></g><text x="600" y="630" text-anchor="middle" fill="#123d2c" font-size="24" font-weight="800">Integrated Technician I workflow</text><g><rect x="55" y="665" width="140" height="92" rx="18" fill="#dcefe4" stroke="#2e7d4f" stroke-width="2"/><rect x="215" y="665" width="140" height="92" rx="18" fill="#eef3f7" stroke="#567087" stroke-width="2"/><rect x="375" y="665" width="140" height="92" rx="18" fill="#e9f1e4" stroke="#537b49" stroke-width="2"/><rect x="535" y="665" width="140" height="92" rx="18" fill="#fff4d8" stroke="#9b7729" stroke-width="2"/><rect x="695" y="665" width="140" height="92" rx="18" fill="#e8edf7" stroke="#52668f" stroke-width="2"/><rect x="855" y="665" width="140" height="92" rx="18" fill="#f6e9ef" stroke="#8a526d" stroke-width="2"/><rect x="1015" y="665" width="130" height="92" rx="18" fill="#fff0e7" stroke="#b85d2a" stroke-width="2"/></g><g text-anchor="middle" fill="#163122" font-size="17" font-weight="700"><text x="125" y="704">Safety</text><text x="125" y="731" font-size="14" font-weight="400">control risk</text><text x="285" y="704">SOPs</text><text x="285" y="731" font-size="14" font-weight="400">follow current work</text><text x="445" y="704">Biosecurity</text><text x="445" y="731" font-size="14" font-weight="400">control pathways</text><text x="605" y="704">Traceability</text><text x="605" y="731" font-size="14" font-weight="400">preserve identity</text><text x="765" y="704">Equipment</text><text x="765" y="731" font-size="14" font-weight="400">stay in scope</text><text x="925" y="704">Records</text><text x="925" y="731" font-size="14" font-weight="400">record truthfully</text><text x="1080" y="704">Escalate</text><text x="1080" y="731" font-size="14" font-weight="400">transfer open risk</text></g><rect x="155" y="805" width="890" height="54" rx="18" fill="#143f2d"/><text x="600" y="839" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">Good handoff connects the whole system: safe work, controlled process, truthful status, clear ownership.</text></g></svg>