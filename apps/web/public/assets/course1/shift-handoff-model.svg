<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Professional shift handoff model</title><desc id="desc">A five-stage handoff model showing outgoing preparation, written record, two-way verbal exchange, incoming cross-check and clarification, and explicit ownership of open conditions and next actions. Priority information includes safety or access restrictions, crop and material status, equipment faults, incomplete work, deviations, notifications, and time-sensitive follow-up.</desc><rect width="1200" height="780" rx="28" fill="#fffdf7"/><text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#163122">Professional Shift Handoff</text><text x="600" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5a6b60">A controlled transfer of responsibility—not a one-way note dump</text><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5a6b60"/></marker></defs><g font-family="Arial,sans-serif"><g fill="#fff" stroke="#d9d3c4" stroke-width="3"><rect x="45" y="160" width="195" height="150" rx="18"/><rect x="275" y="160" width="195" height="150" rx="18"/><rect x="505" y="160" width="195" height="150" rx="18"/><rect x="735" y="160" width="195" height="150" rx="18"/><rect x="965" y="160" width="195" height="150" rx="18"/></g><g text-anchor="middle" fill="#163122"><text x="142" y="200" font-size="20" font-weight="700">1. Prepare</text><text x="142" y="234" font-size="15" fill="#5a6b60">Review work, alarms,</text><text x="142" y="258" font-size="15" fill="#5a6b60">holds, deviations,</text><text x="142" y="282" font-size="15" fill="#5a6b60">and time-critical items</text><text x="372" y="200" font-size="20" font-weight="700">2. Write</text><text x="372" y="234" font-size="15" fill="#5a6b60">Exact IDs, times,</text><text x="372" y="258" font-size="15" fill="#5a6b60">facts, completed work,</text><text x="372" y="282" font-size="15" fill="#5a6b60">and open status</text><text x="602" y="200" font-size="20" font-weight="700">3. Exchange</text><text x="602" y="234" font-size="15" fill="#5a6b60">Outgoing explains;</text><text x="602" y="258" font-size="15" fill="#5a6b60">incoming asks questions</text><text x="602" y="282" font-size="15" fill="#5a6b60">and confirms meaning</text><text x="832" y="200" font-size="20" font-weight="700">4. Cross-check</text><text x="832" y="234" font-size="15" fill="#5a6b60">Compare record, room,</text><text x="832" y="258" font-size="15" fill="#5a6b60">system status, and</text><text x="832" y="282" font-size="15" fill="#5a6b60">critical open items</text><text x="1062" y="200" font-size="20" font-weight="700">5. Own next action</text><text x="1062" y="234" font-size="15" fill="#5a6b60">Who follows up?</text><text x="1062" y="258" font-size="15" fill="#5a6b60">By when?</text><text x="1062" y="282" font-size="15" fill="#5a6b60">What stays blocked?</text></g><g stroke="#5a6b60" stroke-width="4" marker-end="url(#a)"><path d="M240 235 H265"/><path d="M470 235 H495"/><path d="M700 235 H725"/><path d="M930 235 H955"/></g><rect x="120" y="390" width="960" height="245" rx="22" fill="#e8f1ea" stroke="#245f3d" stroke-width="2"/><text x="600" y="430" text-anchor="middle" font-size="23" font-weight="700" fill="#163122">Put unresolved or safety-critical information first</text><g fill="#163122" font-size="18"><text x="180" y="482">• safety, entry, quarantine, or hold restrictions</text><text x="180" y="524">• crop / material identity and abnormal observations</text><text x="180" y="566">• incomplete work and open deviations</text><text x="650" y="482">• equipment alarms / faults and tickets</text><text x="650" y="524">• people already notified / decisions pending</text><text x="650" y="566">• time-sensitive next actions and due times</text></g><rect x="260" y="680" width="680" height="62" rx="16" fill="#eef3f7" stroke="#47637a" stroke-width="2"/><text x="600" y="706" text-anchor="middle" font-size="18" font-weight="700" fill="#163122">Separate observation from diagnosis; separate open status from completed status.</text><text x="600" y="731" text-anchor="middle" font-size="15" fill="#5a6b60">A good handoff lets the next qualified person reconstruct what happened without guessing.</text></g></svg>