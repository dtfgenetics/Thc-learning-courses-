<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Material genealogy through cultivation</title><desc id="desc">A genealogy chain showing source plant to clone tray, transplant batch, flowering room, harvest container, retained sample, and disposition. At each transition the identity relationship, location, time, quantity where relevant, and recording event are preserved so new identifiers do not erase the prior history.</desc><rect width="1200" height="760" rx="28" fill="#fffdf7"/><text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#163122">Material Genealogy: Preserve the Relationship</text><text x="600" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5a6b60">New containers, rooms, samples, and identifiers should extend history—not erase it</text><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5a6b60"/></marker></defs><g font-family="Arial,sans-serif"><g fill="#fff" stroke="#d9d3c4" stroke-width="3"><rect x="55" y="180" width="150" height="125" rx="18"/><rect x="245" y="180" width="150" height="125" rx="18"/><rect x="435" y="180" width="150" height="125" rx="18"/><rect x="625" y="180" width="150" height="125" rx="18"/><rect x="815" y="180" width="150" height="125" rx="18"/><rect x="1005" y="180" width="150" height="125" rx="18"/></g><g text-anchor="middle" fill="#163122" font-size="18" font-weight="700"><text x="130" y="220">Source plant</text><text x="130" y="250" fill="#5a6b60" font-size="15" font-weight="400">identity / origin</text><text x="320" y="220">Clone tray</text><text x="320" y="250" fill="#5a6b60" font-size="15" font-weight="400">new group identity</text><text x="510" y="220">Transplant batch</text><text x="510" y="250" fill="#5a6b60" font-size="15" font-weight="400">container / count</text><text x="700" y="220">Flower room</text><text x="700" y="250" fill="#5a6b60" font-size="15" font-weight="400">movement event</text><text x="890" y="220">Harvest container</text><text x="890" y="250" fill="#5a6b60" font-size="15" font-weight="400">source linkage</text><text x="1080" y="220">Sample / disposition</text><text x="1080" y="250" fill="#5a6b60" font-size="15" font-weight="400">final event link</text></g><g stroke="#5a6b60" stroke-width="4" marker-end="url(#a)"><path d="M205 242 H235"/><path d="M395 242 H425"/><path d="M585 242 H615"/><path d="M775 242 H805"/><path d="M965 242 H995"/></g><rect x="110" y="390" width="980" height="190" rx="22" fill="#e8f1ea" stroke="#245f3d" stroke-width="2"/><text x="600" y="430" text-anchor="middle" font-size="23" font-weight="700" fill="#163122">At every identity transition, preserve enough event context to reconstruct what happened</text><g fill="#163122" font-size="17"><text x="165" y="482">• Source identity and new/continuing identity</text><text x="165" y="520">• Location and destination</text><text x="165" y="558">• Date / time of the event</text><text x="650" y="482">• Quantity / count where relevant</text><text x="650" y="520">• Person or system recording the event</text><text x="650" y="558">• Relationship between old and new identifiers</text></g><rect x="235" y="635" width="730" height="66" rx="16" fill="#fff0e7" stroke="#9b5229" stroke-width="2"/><text x="600" y="663" text-anchor="middle" font-size="18" font-weight="700" fill="#163122">Identity mismatch? Stop the affected transition and resolve it under procedure.</text><text x="600" y="690" text-anchor="middle" font-size="15" fill="#5a6b60">Appearance, cultivar name, or “probably the same group” is not a substitute for controlled identity.</text></g></svg>