<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Inventory reconciliation flow</title><desc id="desc">A flowchart comparing physical count and controlled record. If they match, the technician documents the verified state. If they differ, the technician recounts and checks identifiers and recent events, preserves the discrepancy without forcing either value, and escalates unresolved differences for authorized investigation or correction.</desc><rect width="1200" height="760" rx="28" fill="#fffdf7"/><text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#163122">Inventory Reconciliation Is Comparison, Not Forced Agreement</text><text x="600" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5a6b60">The physical state and controlled record are both evidence</text><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5a6b60"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="120" y="155" width="330" height="100" rx="18" fill="#e8f1ea" stroke="#245f3d" stroke-width="3"/><text x="285" y="195" font-size="22" font-weight="700" fill="#163122">Physical verification</text><text x="285" y="224" font-size="16" fill="#5a6b60">count • identity • location • condition</text><rect x="750" y="155" width="330" height="100" rx="18" fill="#eef3f7" stroke="#47637a" stroke-width="3"/><text x="915" y="195" font-size="22" font-weight="700" fill="#163122">Controlled record</text><text x="915" y="224" font-size="16" fill="#5a6b60">expected count • identity • event history</text><path d="M285 255 V325 H530" stroke="#5a6b60" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M915 255 V325 H670" stroke="#5a6b60" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="480" y="315" width="240" height="100" rx="18" fill="#fff" stroke="#a57a2b" stroke-width="3"/><text x="600" y="354" font-size="22" font-weight="700" fill="#163122">Do they agree?</text><text x="600" y="385" font-size="16" fill="#5a6b60">same controlled object and event?</text><path d="M480 365 H300 V485" stroke="#5a6b60" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="370" y="350" font-size="17" font-weight="700" fill="#245f3d">YES</text><rect x="120" y="495" width="360" height="110" rx="18" fill="#e8f1ea" stroke="#245f3d" stroke-width="3"/><text x="300" y="535" font-size="21" font-weight="700" fill="#163122">Document verified state</text><text x="300" y="565" font-size="16" fill="#5a6b60">Complete the movement/reconciliation record</text><text x="300" y="590" font-size="16" fill="#5a6b60">according to procedure</text><path d="M720 365 H900 V455" stroke="#5a6b60" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="820" y="350" font-size="17" font-weight="700" fill="#9b5229">NO</text><rect x="710" y="465" width="380" height="155" rx="18" fill="#fff0e7" stroke="#9b5229" stroke-width="3"/><text x="900" y="502" font-size="21" font-weight="700" fill="#163122">Preserve the discrepancy</text><text x="900" y="532" font-size="16" fill="#5a6b60">Recount • verify identifier • review permitted</text><text x="900" y="558" font-size="16" fill="#5a6b60">recent movements / delayed entries</text><text x="900" y="584" font-size="16" fill="#5a6b60">Do not change a value just to make it match</text><path d="M900 620 V660" stroke="#5a6b60" stroke-width="4" marker-end="url(#a)"/><rect x="655" y="665" width="490" height="60" rx="15" fill="#fbf2df" stroke="#8b5b24" stroke-width="2"/><text x="900" y="701" font-size="17" font-weight="700" fill="#163122">Unresolved? Escalate with confirmed facts and remaining uncertainty</text><text x="300" y="680" font-size="15" fill="#5a6b60">Possible causes include counting error, delayed entry, wrong ID, unrecorded movement, loss/damage, or system issues.</text></g></svg>