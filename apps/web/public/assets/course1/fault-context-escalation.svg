<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Fault context and escalation</title><desc id="desc">Course 1 Module 5 Lesson 5.3 visual showing how a technician builds a maintenance-ready fault context from exact asset and location, first occurrence, observed alarm or symptom, permitted checks, recurrence, process impact, controlled status, and notification while separating verified facts from hypotheses.</desc><defs><linearGradient id="header" x1="0" x2="1"><stop stop-color="#0d3b2a"/><stop offset="1" stop-color="#1b6546"/></linearGradient></defs><rect width="1200" height="900" rx="28" fill="#f7f5ec"/><rect width="1200" height="122" rx="28" fill="url(#header)"/><g font-family="Arial,sans-serif"><text x="54" y="43" fill="#f4d35e" font-size="18" font-weight="700">THC ACADEMY • COURSE 1 • MODULE 5</text><text x="54" y="88" fill="#fff" font-size="38" font-weight="800">Fault Context &amp; Escalation</text><text x="1140" y="45" text-anchor="end" fill="#dcefe4" font-size="17">Lesson 5.3</text><text x="1140" y="79" text-anchor="end" fill="#fff" font-size="17" font-weight="700">Technician I foundation</text><text x="60" y="166" fill="#29465b" font-size="21" font-weight="700">Make the condition reproducible without turning an observation into an unsupported diagnosis.</text><g fill="#163122" font-size="18"><rect x="55" y="205" width="720" height="500" rx="24" fill="#fff" stroke="#d7d1c4" stroke-width="3"/><text x="90" y="250" fill="#123d2c" font-size="27" font-weight="800">Build the time-ordered fault record</text><text x="90" y="303" fill="#6b786f" font-size="15" font-weight="700">1 • ASSET + LOCATION</text><text x="330" y="303" fill="#6b786f" font-size="15" font-weight="700">2 • FIRST OCCURRENCE</text><text x="565" y="303" fill="#6b786f" font-size="15" font-weight="700">3 • EXACT OBSERVATION</text><text x="90" y="340">Identify the exact equipment,</text><text x="90" y="368">room, zone or process point.</text><text x="330" y="340">Record when the condition</text><text x="330" y="368">first appeared.</text><text x="565" y="340">Capture the alarm, sound,</text><text x="565" y="368">reading, leak or no-flow fact.</text><line x1="90" y1="405" x2="740" y2="405" stroke="#d7d1c4" stroke-width="2"/><text x="90" y="448" fill="#6b786f" font-size="15" font-weight="700">4 • PERMITTED CHECKS</text><text x="330" y="448" fill="#6b786f" font-size="15" font-weight="700">5 • RECURRENCE + IMPACT</text><text x="565" y="448" fill="#6b786f" font-size="15" font-weight="700">6 • STATUS + NOTIFICATION</text><text x="90" y="486">Record only operator checks</text><text x="90" y="514">the current procedure allows.</text><text x="330" y="486">Show when it returned and</text><text x="330" y="514">what service or crop area changed.</text><text x="565" y="486">Preserve safe status and use</text><text x="565" y="514">the applicable reporting path.</text><rect x="90" y="570" width="650" height="92" rx="18" fill="#eef3f7" stroke="#567087" stroke-width="2"/><text x="115" y="606" fill="#29465b" font-size="19" font-weight="800">Reporting timing and channel are procedure-controlled.</text><text x="115" y="636" fill="#405a6e" font-size="17">Use the emergency, fault-reporting or escalation process that applies to the condition.</text></g><rect x="815" y="205" width="330" height="225" rx="24" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="980" y="250" text-anchor="middle" fill="#123d2c" font-size="25" font-weight="800">Verified facts</text><g fill="#163122" font-size="18"><text x="850" y="295">✓ “Zone 3 no flow at 14:10”</text><text x="850" y="335">✓ “Reset permitted once”</text><text x="850" y="375">✓ “Alarm returned at 14:17”</text><text x="850" y="415">✓ “Irrigation event did not occur”</text></g><rect x="815" y="465" width="330" height="240" rx="24" fill="#fff0e7" stroke="#b85d2a" stroke-width="3"/><text x="980" y="510" text-anchor="middle" fill="#5c2f16" font-size="25" font-weight="800">Do not convert into fact</text><g fill="#5c2f16" font-size="18"><text x="850" y="555">✕ “Pump is broken”</text><text x="850" y="595">✕ guessed root cause</text><text x="850" y="635">✕ unauthorized internal check</text><text x="850" y="675">✕ deleting recurrence history</text></g><rect x="95" y="754" width="1010" height="96" rx="20" fill="#143f2d"/><text x="600" y="793" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">An alarm is evidence of an abnormal condition—not automatic proof of root cause.</text><text x="600" y="826" text-anchor="middle" fill="#dcefe4" font-size="18">Keep hypotheses clearly labeled and hand unresolved diagnosis or repair to the authorized role.</text></g></svg>