<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Professional shift handoff</title><desc id="desc">Course 1 Module 6 Lesson 6.2 visual showing a structured shift handoff: outgoing preparation, two-way exchange, incoming cross-check, and explicit ownership of unresolved work. Handoff priorities include safety and access controls, holds and identity issues, maintenance status, incomplete work, and time-sensitive next actions. Any instructions transferred must be current, controlled, and within the receiving worker's authority.</desc><defs><linearGradient id="header" x1="0" x2="1"><stop stop-color="#0d3b2a"/><stop offset="1" stop-color="#1b6546"/></linearGradient></defs><rect width="1200" height="900" rx="28" fill="#f7f5ec"/><rect width="1200" height="122" rx="28" fill="url(#header)"/><g font-family="Arial,sans-serif"><text x="54" y="43" fill="#f4d35e" font-size="18" font-weight="700">THC ACADEMY • COURSE 1 • MODULE 6</text><text x="54" y="88" fill="#fff" font-size="38" font-weight="800">Professional Shift Handoff</text><text x="1140" y="45" text-anchor="end" fill="#dcefe4" font-size="17">Lesson 6.2</text><text x="1140" y="79" text-anchor="end" fill="#fff" font-size="17" font-weight="700">Technician I foundation</text><text x="600" y="166" text-anchor="middle" fill="#29465b" font-size="21" font-weight="700">Transfer operational understanding—not just a note.</text><g font-family="Arial,sans-serif"><rect x="55" y="205" width="255" height="210" rx="22" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><circle cx="183" cy="255" r="34" fill="#fff" stroke="#2e7d4f" stroke-width="3"/><text x="183" y="264" text-anchor="middle" fill="#1b6546" font-size="28" font-weight="800">1</text><text x="183" y="320" text-anchor="middle" fill="#123d2c" font-size="24" font-weight="800">Prepare</text><text x="183" y="356" text-anchor="middle" fill="#163122" font-size="18">Find open, abnormal,</text><text x="183" y="384" text-anchor="middle" fill="#163122" font-size="18">restricted and time-sensitive work.</text><rect x="335" y="205" width="255" height="210" rx="22" fill="#eef3f7" stroke="#567087" stroke-width="3"/><circle cx="463" cy="255" r="34" fill="#fff" stroke="#567087" stroke-width="3"/><text x="463" y="264" text-anchor="middle" fill="#29465b" font-size="28" font-weight="800">2</text><text x="463" y="320" text-anchor="middle" fill="#29465b" font-size="24" font-weight="800">Exchange</text><text x="463" y="356" text-anchor="middle" fill="#405a6e" font-size="18">State exact identity, status,</text><text x="463" y="384" text-anchor="middle" fill="#405a6e" font-size="18">actions, owner and timing.</text><rect x="615" y="205" width="255" height="210" rx="22" fill="#f7efd9" stroke="#a67820" stroke-width="3"/><circle cx="743" cy="255" r="34" fill="#fff" stroke="#a67820" stroke-width="3"/><text x="743" y="264" text-anchor="middle" fill="#7a5a16" font-size="28" font-weight="800">3</text><text x="743" y="320" text-anchor="middle" fill="#6a4d14" font-size="24" font-weight="800">Cross-check</text><text x="743" y="356" text-anchor="middle" fill="#6a4d14" font-size="18">Incoming worker verifies critical</text><text x="743" y="384" text-anchor="middle" fill="#6a4d14" font-size="18">records, displays or physical status.</text><rect x="895" y="205" width="250" height="210" rx="22" fill="#fff0e7" stroke="#b85d2a" stroke-width="3"/><circle cx="1020" cy="255" r="34" fill="#fff" stroke="#b85d2a" stroke-width="3"/><text x="1020" y="264" text-anchor="middle" fill="#7b4121" font-size="28" font-weight="800">4</text><text x="1020" y="320" text-anchor="middle" fill="#5c2f16" font-size="24" font-weight="800">Own</text><text x="1020" y="356" text-anchor="middle" fill="#5c2f16" font-size="18">Confirm who now owns the</text><text x="1020" y="384" text-anchor="middle" fill="#5c2f16" font-size="18">next authorized action.</text></g><text x="60" y="470" fill="#123d2c" font-size="25" font-weight="800">Lead with what can block or change the next shift</text><g font-size="18"><rect x="55" y="500" width="210" height="150" rx="20" fill="#fdecec" stroke="#a94442" stroke-width="2"/><text x="160" y="537" text-anchor="middle" fill="#7a2c2a" font-size="20" font-weight="800">Safety / access</text><text x="160" y="570" text-anchor="middle" fill="#7a2c2a">Restrictions, hazards,</text><text x="160" y="598" text-anchor="middle" fill="#7a2c2a">emergency status</text><rect x="285" y="500" width="210" height="150" rx="20" fill="#f7efd9" stroke="#a67820" stroke-width="2"/><text x="390" y="537" text-anchor="middle" fill="#6a4d14" font-size="20" font-weight="800">Hold / identity</text><text x="390" y="570" text-anchor="middle" fill="#6a4d14">Quarantine, hold,</text><text x="390" y="598" text-anchor="middle" fill="#6a4d14">tag discrepancy</text><rect x="515" y="500" width="210" height="150" rx="20" fill="#eef3f7" stroke="#567087" stroke-width="2"/><text x="620" y="537" text-anchor="middle" fill="#29465b" font-size="20" font-weight="800">Equipment</text><text x="620" y="570" text-anchor="middle" fill="#405a6e">Out of service, ticket,</text><text x="620" y="598" text-anchor="middle" fill="#405a6e">maintenance in progress</text><rect x="745" y="500" width="210" height="150" rx="20" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="2"/><text x="850" y="537" text-anchor="middle" fill="#123d2c" font-size="20" font-weight="800">Open work</text><text x="850" y="570" text-anchor="middle" fill="#163122">Incomplete, deviated,</text><text x="850" y="598" text-anchor="middle" fill="#163122">awaiting decision</text><rect x="975" y="500" width="170" height="150" rx="20" fill="#fff" stroke="#c8d6cd" stroke-width="2"/><text x="1060" y="537" text-anchor="middle" fill="#123d2c" font-size="20" font-weight="800">Timing</text><text x="1060" y="570" text-anchor="middle" fill="#163122">Next event,</text><text x="1060" y="598" text-anchor="middle" fill="#163122">deadline, owner</text></g><rect x="95" y="710" width="1010" height="140" rx="20" fill="#143f2d"/><text x="600" y="752" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">Handoff instructions must be current, controlled, and within the receiver's authority.</text><text x="600" y="791" text-anchor="middle" fill="#dcefe4" font-size="18">Do not improvise new priorities, release restrictions, or transfer work that the receiving role is not authorized to perform.</text><text x="600" y="823" text-anchor="middle" fill="#dcefe4" font-size="18">A handoff succeeds when the incoming shift can state what is true now and what happens next.</text></g></svg>