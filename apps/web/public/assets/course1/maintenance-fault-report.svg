<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Maintenance-ready fault report anatomy</title><desc id="desc">An annotated example of a useful equipment fault report showing asset identity, location, exact time, alarm or symptom, relevant readings, visible condition, permitted operator checks and results, process or crop impact, safe action already taken, notification or ticket, and a clearly labeled unconfirmed hypothesis. It contrasts observable facts with unsupported statements such as 'pump broken'.</desc><rect width="1200" height="790" rx="28" fill="#fffdf7"/><text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#163122">Maintenance-Ready Fault Report</text><text x="600" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5a6b60">Give maintenance reproducible context—not a vague diagnosis</text><g font-family="Arial,sans-serif"><rect x="90" y="140" width="720" height="570" rx="22" fill="#fff" stroke="#d9d3c4" stroke-width="3"/><text x="130" y="185" font-size="24" font-weight="700" fill="#163122">Example fault record</text><g fill="#5a6b60" font-size="14" font-weight="700"><text x="130" y="230">ASSET / LOCATION</text><text x="470" y="230">TIME</text><text x="130" y="315">ALARM / OBSERVATION</text><text x="130" y="410">PERMITTED CHECKS + RESULTS</text><text x="130" y="520">PROCESS / CROP IMPACT</text><text x="130" y="610">SAFE ACTION / NOTIFICATION</text></g><g fill="#163122" font-size="18"><text x="130" y="260">P-12 • irrigation room • Zone 3</text><text x="470" y="260">14:10</text><text x="130" y="345">Controller alarm displayed; Zone 3 shows no flow.</text><text x="130" y="375">No visible external leak observed.</text><text x="130" y="440">Reservoir level normal. External indicator checked per operator SOP.</text><text x="130" y="470">No operator-level condition identified that restores flow.</text><text x="130" y="550">Scheduled Zone 3 irrigation not delivered; affected task placed on hold.</text><text x="130" y="640">P-12 left out of use per procedure; maintenance ticket M-44 opened.</text><text x="130" y="670">Lead notified; next irrigation timing handed off.</text></g><rect x="850" y="165" width="280" height="190" rx="18" fill="#e8f1ea" stroke="#245f3d" stroke-width="2"/><text x="990" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#163122">Useful evidence</text><g fill="#163122" font-size="16"><text x="875" y="245">✓ exact asset and location</text><text x="875" y="278">✓ timestamp / alarm text</text><text x="875" y="311">✓ checks actually performed</text><text x="875" y="344">✓ operational impact</text></g><rect x="850" y="390" width="280" height="190" rx="18" fill="#fff0e7" stroke="#9b5229" stroke-width="2"/><text x="990" y="430" text-anchor="middle" font-size="20" font-weight="700" fill="#163122">Avoid unsupported certainty</text><g fill="#163122" font-size="16"><text x="875" y="470">✗ “pump broken”</text><text x="875" y="505">✗ guessed root cause</text><text x="875" y="540">✗ repair attempt outside SOP</text></g><rect x="850" y="615" width="280" height="95" rx="18" fill="#eef3f7" stroke="#47637a" stroke-width="2"/><text x="990" y="650" text-anchor="middle" font-size="18" font-weight="700" fill="#163122">Hypothesis, if allowed</text><text x="990" y="680" text-anchor="middle" font-size="15" fill="#5a6b60">Label it clearly as unconfirmed.</text><text x="600" y="755" text-anchor="middle" font-size="16" fill="#5a6b60">An alarm is evidence of an abnormal condition. It is not automatically proof of root cause.</text></g></svg>