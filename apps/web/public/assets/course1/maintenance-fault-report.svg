<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Maintenance-ready fault report</title><desc id="desc">Course 1 fault-reporting visual showing asset identity, time, exact alarm or symptom, permitted operator checks, recurrence, process impact, safe status, notification, and the rule that hypotheses must remain clearly separate from verified observations.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#0d3b2a"/><stop offset="1" stop-color="#145c3d"/></linearGradient></defs><rect width="1200" height="900" rx="28" fill="#f7f5ec"/><rect width="1200" height="120" rx="28" fill="url(#g)"/><g font-family="Arial,sans-serif"><text x="55" y="47" fill="#f4d35e" font-size="18" font-weight="700">THC ACADEMY • COURSE 1 • EQUIPMENT</text><text x="55" y="90" fill="#fff" font-size="36" font-weight="800">Fault Reporting: Make the Problem Legible</text><text x="1115" y="47" text-anchor="end" fill="#dcefe4" font-size="17">Lesson 5.3</text><text x="1115" y="82" text-anchor="end" fill="#fff" font-size="18" font-weight="700">Observe. Record. Escalate.</text><rect x="50" y="150" width="760" height="610" rx="22" fill="#fff" stroke="#d7d1c4" stroke-width="3"/><text x="90" y="192" fill="#123d2c" font-size="25" font-weight="800">Maintenance-ready fault timeline</text><g fill="#6b786f" font-size="14" font-weight="700"><text x="90" y="236">ASSET / LOCATION</text><text x="470" y="236">FIRST OCCURRENCE</text><text x="90" y="326">ALARM / OBSERVATION</text><text x="90" y="432">PERMITTED CHECKS + RESULTS</text><text x="90" y="540">RECURRENCE + PROCESS IMPACT</text><text x="90" y="650">SAFE STATUS + NOTIFICATION</text></g><g fill="#163122" font-size="19"><text x="90" y="267">P-12 • Irrigation Room • Zone 3</text><text x="470" y="267">14:10</text><text x="90" y="358">Controller alarm displayed; Zone 3 shows no flow.</text><text x="90" y="391">No visible external leak observed.</text><text x="90" y="465">Reservoir level normal; external indicator checked under operator SOP.</text><text x="90" y="498">No permitted operator action restored flow.</text><text x="90" y="574">Reset permitted once at 14:12; alarm returned at 14:17.</text><text x="90" y="607">Scheduled irrigation did not occur in Zone 3.</text><text x="90" y="684">Asset left out of use under procedure; maintenance ticket opened.</text><text x="90" y="717">Lead notified; next irrigation timing handed off.</text></g><rect x="850" y="150" width="300" height="190" rx="20" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="1000" y="190" text-anchor="middle" fill="#123d2c" font-size="23" font-weight="800">Record verified facts</text><g fill="#123d2c" font-size="17"><text x="880" y="230">✓ exact asset / place / time</text><text x="880" y="264">✓ exact alarm or symptom</text><text x="880" y="298">✓ checks actually completed</text><text x="880" y="332">✓ crop / process impact</text></g><rect x="850" y="375" width="300" height="190" rx="20" fill="#fff0e7" stroke="#b85d2a" stroke-width="3"/><text x="1000" y="415" text-anchor="middle" fill="#5c2f16" font-size="23" font-weight="800">Do not manufacture certainty</text><g fill="#5c2f16" font-size="17"><text x="880" y="455">✕ “pump broken”</text><text x="880" y="489">✕ guessed root cause</text><text x="880" y="523">✕ unauthorized repair</text><text x="880" y="557">✕ deleting recurrence history</text></g><rect x="850" y="600" width="300" height="160" rx="20" fill="#eef3f7" stroke="#567087" stroke-width="3"/><text x="1000" y="641" text-anchor="middle" fill="#29465b" font-size="22" font-weight="800">Hypothesis ≠ fact</text><text x="1000" y="678" text-anchor="middle" fill="#405a6e" font-size="17">Label an unconfirmed idea</text><text x="1000" y="706" text-anchor="middle" fill="#405a6e" font-size="17">as unconfirmed if useful.</text><rect x="125" y="805" width="950" height="58" rx="18" fill="#143f2d"/><text x="600" y="842" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">An alarm is evidence of an abnormal condition—not automatic proof of root cause.</text></g></svg>