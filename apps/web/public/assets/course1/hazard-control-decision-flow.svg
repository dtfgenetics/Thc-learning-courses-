<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Hierarchy of controls for cultivation technicians</title>
<desc id="desc">Course 1 infographic showing the hierarchy of controls from elimination through substitution, engineering controls, administrative controls and personal protective equipment. It emphasizes using the strongest effective control that is permitted by the current procedure and worker authorization, verifying the result, and escalating technical changes outside Technician I authority.</desc>
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#0a382b"/><stop offset="1" stop-color="#155d46"/></linearGradient><style>text{font-family:Arial,sans-serif}.h{fill:#fff;font-weight:700}.t{fill:#17352a}.m{fill:#56685d}.b{font-weight:700}.s{font-size:18px}.p{font-size:16px}</style></defs>
<rect width="1600" height="1000" fill="#f7f4ea"/><rect width="1600" height="120" fill="url(#head)"/><text x="65" y="52" class="h" font-size="30">THC ACADEMY • COURSE 1 • LESSON 1.1</text><text x="65" y="96" class="h" font-size="48">HIERARCHY OF CONTROLS</text><text x="1530" y="56" text-anchor="end" fill="#b8e46f" font-size="24" font-weight="700">STRONGER CONTROLS FIRST</text><text x="1530" y="90" text-anchor="end" class="h" font-size="18">PPE is important, but it is not the first choice when stronger controls are feasible.</text>
<rect x="45" y="150" width="1000" height="790" rx="24" fill="#fff" stroke="#c9d4cb" stroke-width="3"/><text x="75" y="195" class="b t" font-size="26">Control the hazard at its source whenever possible</text><text x="75" y="225" class="s m">The hierarchy ranks control approaches by how directly they reduce exposure to the hazard.</text>
<polygon points="220,285 875,285 820,390 275,390" fill="#1f7a4b"/><text x="548" y="330" text-anchor="middle" class="h" font-size="30">1 • ELIMINATION</text><text x="548" y="365" text-anchor="middle" class="h" font-size="20">Remove the hazard entirely</text>
<polygon points="275,405 820,405 770,505 325,505" fill="#58a642"/><text x="548" y="447" text-anchor="middle" class="h" font-size="28">2 • SUBSTITUTION</text><text x="548" y="480" text-anchor="middle" class="h" font-size="19">Replace with a safer alternative</text>
<polygon points="325,520 770,520 725,615 370,615" fill="#e2b51d"/><text x="548" y="560" text-anchor="middle" class="t b" font-size="27">3 • ENGINEERING CONTROLS</text><text x="548" y="592" text-anchor="middle" class="t" font-size="18">Isolate people from the hazard</text>
<polygon points="370,630 725,630 680,720 415,720" fill="#e9812f"/><text x="548" y="668" text-anchor="middle" class="h" font-size="26">4 • ADMINISTRATIVE CONTROLS</text><text x="548" y="698" text-anchor="middle" class="h" font-size="18">Change how the work is performed</text>
<polygon points="415,735 680,735 635,825 460,825" fill="#cf3932"/><text x="548" y="775" text-anchor="middle" class="h" font-size="28">5 • PPE</text><text x="548" y="805" text-anchor="middle" class="h" font-size="18">Protect the worker</text>
<path d="M150 805 V315" stroke="#1f7a4b" stroke-width="8"/><path d="M150 315 l-18 28 h36z" fill="#1f7a4b"/><text x="125" y="300" text-anchor="middle" class="b t" font-size="17">MOST EFFECTIVE</text><text x="125" y="850" text-anchor="middle" class="b m" font-size="17">LEAST DIRECT</text>
<rect x="760" y="300" width="240" height="510" rx="18" fill="#f3f7f4"/><text x="790" y="338" class="b t" font-size="21">CULTIVATION EXAMPLES</text><text x="790" y="382" class="b" fill="#1f7a4b" font-size="18">Elimination</text><text x="790" y="410" class="p t">Remove an unnecessary trip hazard</text><text x="790" y="435" class="p t">or take damaged equipment out of use.</text><text x="790" y="480" class="b" fill="#58a642" font-size="18">Substitution</text><text x="790" y="508" class="p t">Use an approved less-hazardous product</text><text x="790" y="533" class="p t">when the procedure allows it.</text><text x="790" y="578" class="b" fill="#a77a00" font-size="18">Engineering</text><text x="790" y="606" class="p t">Guarding, ventilation, enclosures,</text><text x="790" y="631" class="p t">interlocks or physical barriers.</text><text x="790" y="676" class="b" fill="#bd5e1d" font-size="18">Administrative</text><text x="790" y="704" class="p t">SOPs, access rules, work sequence,</text><text x="790" y="729" class="p t">training, scheduling and signage.</text><text x="790" y="774" class="b" fill="#b52e2b" font-size="18">PPE</text><text x="790" y="802" class="p t">Task-specific protection selected from</text><text x="790" y="827" class="p t">the assessed exposure and instructions.</text>
<rect x="1080" y="150" width="475" height="790" rx="24" fill="#123f31"/><text x="1120" y="205" class="h" font-size="28">TECHNICIAN I DECISION RULES</text><line x1="1120" y1="225" x2="1510" y2="225" stroke="#75bf8c" stroke-width="2"/><text x="1120" y="280" class="h s">✓ Prefer stronger controls when they are feasible.</text><text x="1120" y="325" class="h s">✓ Use the strongest control you are trained and authorized to use.</text><text x="1120" y="385" class="h s">✓ Verify that the control actually corrected or contained the condition.</text><text x="1120" y="445" class="h s">✓ Do not treat PPE as permission to ignore an uncontrolled hazard.</text><text x="1120" y="505" class="h s">✓ Do not modify guards, ventilation, electrical systems, alarms or other technical safeguards without authorization.</text><rect x="1120" y="590" width="390" height="230" rx="18" fill="#eef5ef"/><text x="1150" y="635" class="b t" font-size="23">WHEN THE BEST CONTROL IS OUTSIDE YOUR ROLE</text><text x="1150" y="685" class="s t">1. Stop or isolate where the site procedure authorizes it.</text><text x="1150" y="730" class="s t">2. Preserve useful observations.</text><text x="1150" y="775" class="s t">3. Escalate to the qualified person or team.</text><text x="1315" y="885" text-anchor="middle" fill="#b8e46f" font-size="25" font-weight="700">CONTROL THE RISK • STAY IN YOUR ROLE</text>
</svg>