<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Hazard control and escalation decision flow</title>
  <desc id="desc">A flowchart for a cultivation technician. After a hazard is observed, the worker determines whether an authorized routine control exists. If so, the worker applies it and verifies the condition. If not, or if work cannot proceed safely, the worker stops the task, isolates the condition where authorized, and escalates. Life-safety alarms direct the worker to the site emergency procedure.</desc>
  <rect width="1200" height="820" rx="28" fill="#fffdf7"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#163122">Hazard Control &amp; Escalation</text>
  <text x="600" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5a6b60">Technician I: act within training, authorization, and the current site procedure</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="390" y="130" width="420" height="90" rx="18" fill="#e8f1ea" stroke="#245f3d" stroke-width="3"/>
    <text x="600" y="168" font-size="22" font-weight="700" fill="#163122">Hazard or abnormal condition observed</text>
    <text x="600" y="196" font-size="17" fill="#5a6b60">Pause long enough to identify what is unsafe or uncontrolled</text>

    <path d="M600 220 V274" stroke="#5a6b60" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="370" y="280" width="460" height="100" rx="18" fill="#ffffff" stroke="#a57a2b" stroke-width="3"/>
    <text x="600" y="320" font-size="22" font-weight="700" fill="#163122">Is there a defined routine control</text>
    <text x="600" y="348" font-size="18" fill="#5a6b60">that you are trained and authorized to perform?</text>

    <path d="M370 330 H210 V460" stroke="#5a6b60" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="270" y="316" font-size="18" font-weight="700" fill="#245f3d">YES</text>
    <rect x="60" y="470" width="300" height="120" rx="18" fill="#e8f1ea" stroke="#245f3d" stroke-width="3"/>
    <text x="210" y="512" font-size="21" font-weight="700" fill="#163122">Apply the approved control</text>
    <text x="210" y="542" font-size="17" fill="#5a6b60">Then verify the condition is controlled</text>
    <text x="210" y="568" font-size="17" fill="#5a6b60">and document when required</text>

    <path d="M830 330 H995 V430" stroke="#5a6b60" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="914" y="316" font-size="18" font-weight="700" fill="#8b5b24">NO / UNSURE</text>
    <rect x="840" y="440" width="310" height="100" rx="18" fill="#fbf2df" stroke="#8b5b24" stroke-width="3"/>
    <text x="995" y="478" font-size="21" font-weight="700" fill="#163122">Can the task proceed safely?</text>
    <text x="995" y="507" font-size="17" fill="#5a6b60">Do not improvise a technical repair</text>

    <path d="M995 540 V602" stroke="#5a6b60" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="815" y="610" width="360" height="140" rx="18" fill="#fff0e7" stroke="#9b5229" stroke-width="3"/>
    <text x="995" y="648" font-size="21" font-weight="700" fill="#163122">Stop the task</text>
    <text x="995" y="678" font-size="17" fill="#5a6b60">Isolate or prevent use only where authorized</text>
    <text x="995" y="706" font-size="17" fill="#5a6b60">Escalate to the qualified person or team</text>
    <text x="995" y="732" font-size="17" fill="#5a6b60">Preserve useful observations and records</text>

    <rect x="410" y="635" width="380" height="115" rx="18" fill="#eef3f7" stroke="#47637a" stroke-width="3"/>
    <text x="600" y="675" font-size="20" font-weight="700" fill="#163122">Life-safety alarm or emergency?</text>
    <text x="600" y="704" font-size="17" fill="#5a6b60">Follow the posted emergency procedure and chain of command.</text>
    <text x="600" y="730" font-size="17" fill="#5a6b60">Do not enter an unsafe area merely to investigate.</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b60"/>
    </marker>
  </defs>
</svg>
