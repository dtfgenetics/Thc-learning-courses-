<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">Cultivation data integrity record lifecycle</title><desc id="desc">A six-stage record lifecycle showing controlled identity and context, contemporaneous observation, attributable entry, transparent correction, late-entry or missing-data handling, and reconstructable handoff. The diagram contrasts preserved record history with guessed values, silent overwrites, backdating, and context-free numbers.</desc><rect width="1200" height="840" rx="28" fill="#fffdf7"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5a6b60"/></marker></defs><g font-family="Arial,sans-serif"><text x="600" y="55" text-anchor="middle" font-size="34" font-weight="700" fill="#163122">Trustworthy Cultivation Record Lifecycle</text><text x="600" y="90" text-anchor="middle" font-size="18" fill="#5a6b60">Preserve reality, timing, context, attribution, and change history</text><g fill="#fff" stroke="#d9d3c4" stroke-width="3"><rect x="45" y="145" width="330" height="145" rx="18"/><rect x="435" y="145" width="330" height="145" rx="18"/><rect x="825" y="145" width="330" height="145" rx="18"/><rect x="45" y="360" width="330" height="145" rx="18"/><rect x="435" y="360" width="330" height="145" rx="18"/><rect x="825" y="360" width="330" height="145" rx="18"/></g><g fill="#163122" text-anchor="middle"><text x="210" y="185" font-size="21" font-weight="700">1. Identify the object</text><text x="210" y="219" font-size="15" fill="#5a6b60">Plant, lot, sample, asset, room,</text><text x="210" y="242" font-size="15" fill="#5a6b60">reservoir, task, or work order</text><text x="210" y="267" font-size="15" fill="#5a6b60">must be unambiguous</text><text x="600" y="185" font-size="21" font-weight="700">2. Observe / act</text><text x="600" y="219" font-size="15" fill="#5a6b60">Capture the real activity,</text><text x="600" y="242" font-size="15" fill="#5a6b60">measurement, movement,</text><text x="600" y="267" font-size="15" fill="#5a6b60">inspection, or condition</text><text x="990" y="185" font-size="21" font-weight="700">3. Record with context</text><text x="990" y="219" font-size="15" fill="#5a6b60">Value + unit + identity + location</text><text x="990" y="242" font-size="15" fill="#5a6b60">+ true activity time + attribution</text><text x="990" y="267" font-size="15" fill="#5a6b60">where the task requires it</text><text x="210" y="400" font-size="21" font-weight="700">4. Correct transparently</text><text x="210" y="434" font-size="15" fill="#5a6b60">Preserve the original entry and</text><text x="210" y="457" font-size="15" fill="#5a6b60">the controlled correction trail</text><text x="210" y="482" font-size="15" fill="#5a6b60">instead of silently overwriting</text><text x="600" y="400" font-size="21" font-weight="700">5. Handle late / missing data</text><text x="600" y="434" font-size="15" fill="#5a6b60">Show actual observation time and</text><text x="600" y="457" font-size="15" fill="#5a6b60">later entry time when permitted;</text><text x="600" y="482" font-size="15" fill="#5a6b60">leave unknown facts visibly unknown</text><text x="990" y="400" font-size="21" font-weight="700">6. Reconstruct / hand off</text><text x="990" y="434" font-size="15" fill="#5a6b60">Another qualified person should</text><text x="990" y="457" font-size="15" fill="#5a6b60">be able to follow what happened,</text><text x="990" y="482" font-size="15" fill="#5a6b60">what changed, and what stays open</text></g><g stroke="#5a6b60" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M375 217 H425"/><path d="M765 217 H815"/><path d="M990 290 V325 H210 V350"/><path d="M375 432 H425"/><path d="M765 432 H815"/></g><rect x="115" y="585" width="970" height="185" rx="22" fill="#fff4e8" stroke="#a45b18" stroke-width="2"/><text x="600" y="624" text-anchor="middle" font-size="23" font-weight="700" fill="#7a3d0c">Record-integrity failures to stop</text><g font-size="18" fill="#163122"><text x="175" y="671">• guessed or target values entered as actual observations</text><text x="175" y="709">• backdating a later entry to make it look contemporaneous</text><text x="650" y="671">• silent overwrites that erase the original history</text><text x="650" y="709">• context-free numbers, vague identity, or unclear attribution</text></g><rect x="245" y="790" width="710" height="38" rx="14" fill="#e8f1ea" stroke="#245f3d" stroke-width="2"/><text x="600" y="816" text-anchor="middle" font-size="17" font-weight="700" fill="#163122">A truthful incomplete record is more useful than a complete-looking record that hides what actually happened.</text></g></svg>