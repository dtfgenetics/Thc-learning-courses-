<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Record correction and data integrity lifecycle</title><desc id="desc">Course 1 data-integrity visual showing identity, observation, attributable recording, transparent correction, late or missing data handling, and reconstructable handoff. It warns against guessed values, backdating, silent overwrites, and corrections that erase the original history.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#0d3b2a"/><stop offset="1" stop-color="#145c3d"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#567064"/></marker></defs><rect width="1200" height="900" rx="28" fill="#f7f5ec"/><rect width="1200" height="120" rx="28" fill="url(#g)"/><g font-family="Arial,sans-serif"><text x="55" y="47" fill="#f4d35e" font-size="18" font-weight="700">THC ACADEMY • COURSE 1 • RECORDS</text><text x="55" y="90" fill="#fff" font-size="36" font-weight="800">Record Correction + Data Integrity</text><text x="1115" y="47" text-anchor="end" fill="#dcefe4" font-size="17">Lesson 6.1</text><text x="1115" y="82" text-anchor="end" fill="#fff" font-size="18" font-weight="700">Preserve what actually happened.</text><g fill="#fff" stroke="#d7d1c4" stroke-width="3"><rect x="45" y="160" width="330" height="150" rx="20"/><rect x="435" y="160" width="330" height="150" rx="20"/><rect x="825" y="160" width="330" height="150" rx="20"/><rect x="45" y="385" width="330" height="150" rx="20"/><rect x="435" y="385" width="330" height="150" rx="20"/><rect x="825" y="385" width="330" height="150" rx="20"/></g><g text-anchor="middle" fill="#123d2c"><text x="210" y="202" font-size="22" font-weight="800">1 • Identify</text><text x="210" y="239" font-size="16" fill="#607167">Plant, lot, asset, room, task</text><text x="210" y="266" font-size="16" fill="#607167">or work order is unambiguous</text><text x="600" y="202" font-size="22" font-weight="800">2 • Observe / act</text><text x="600" y="239" font-size="16" fill="#607167">Capture the actual activity,</text><text x="600" y="266" font-size="16" fill="#607167">measurement or condition</text><text x="990" y="202" font-size="22" font-weight="800">3 • Record with context</text><text x="990" y="239" font-size="16" fill="#607167">Value + unit + identity + time</text><text x="990" y="266" font-size="16" fill="#607167">+ location + attribution</text><text x="210" y="427" font-size="22" font-weight="800">4 • Correct transparently</text><text x="210" y="464" font-size="16" fill="#607167">Preserve original information</text><text x="210" y="491" font-size="16" fill="#607167">and the controlled audit trail</text><text x="600" y="427" font-size="22" font-weight="800">5 • Handle missing / late data</text><text x="600" y="464" font-size="16" fill="#607167">Show true observation and entry</text><text x="600" y="491" font-size="16" fill="#607167">times; leave unknowns unknown</text><text x="990" y="427" font-size="22" font-weight="800">6 • Reconstruct / hand off</text><text x="990" y="464" font-size="16" fill="#607167">Another qualified person can see</text><text x="990" y="491" font-size="16" fill="#607167">what happened and what remains open</text></g><g stroke="#567064" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M375 235 H425"/><path d="M765 235 H815"/><path d="M990 310 V350 H210 V375"/><path d="M375 460 H425"/><path d="M765 460 H815"/></g><rect x="70" y="590" width="500" height="215" rx="22" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="320" y="633" text-anchor="middle" fill="#123d2c" font-size="24" font-weight="800">A controlled correction should</text><g fill="#123d2c" font-size="18"><text x="105" y="679">✓ keep the original/audit history visible</text><text x="105" y="718">✓ identify the corrected information</text><text x="105" y="757">✓ include required date/time/attribution</text><text x="105" y="796">✓ follow the approved paper or digital process</text></g><rect x="630" y="590" width="500" height="215" rx="22" fill="#fff0e7" stroke="#b85d2a" stroke-width="3"/><text x="880" y="633" text-anchor="middle" fill="#5c2f16" font-size="24" font-weight="800">Integrity failures to stop</text><g fill="#5c2f16" font-size="18"><text x="665" y="679">✕ guessed or target values as observations</text><text x="665" y="718">✕ backdating a later entry</text><text x="665" y="757">✕ silent overwrites or erased history</text><text x="665" y="796">✕ “fixing” records to force agreement</text></g><rect x="180" y="830" width="840" height="48" rx="16" fill="#143f2d"/><text x="600" y="861" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">A truthful incomplete record is safer than a complete-looking record that hides reality.</text></g></svg>