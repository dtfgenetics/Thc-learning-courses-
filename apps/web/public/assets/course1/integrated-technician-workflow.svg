<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Integrated Technician I workflow</title><desc id="desc">Course 1 Module 6 Lesson 6.3 visual showing an integrated technician workflow: review assigned work and current controlled instructions, verify prerequisites and status, execute only authorized routine work, monitor and respond to changes, document reality, and communicate unresolved conditions and follow-up. Planning is framed as reviewing assigned work and dependencies rather than independent production-planning authority.</desc><defs><linearGradient id="header" x1="0" x2="1"><stop stop-color="#0d3b2a"/><stop offset="1" stop-color="#1b6546"/></linearGradient></defs><rect width="1200" height="900" rx="28" fill="#f7f5ec"/><rect width="1200" height="122" rx="28" fill="url(#header)"/><g font-family="Arial,sans-serif"><text x="54" y="43" fill="#f4d35e" font-size="18" font-weight="700">THC ACADEMY • COURSE 1 • MODULE 6</text><text x="54" y="88" fill="#fff" font-size="37" font-weight="800">Integrated Technician I Workflow</text><text x="1140" y="45" text-anchor="end" fill="#dcefe4" font-size="17">Lesson 6.3</text><text x="1140" y="79" text-anchor="end" fill="#fff" font-size="17" font-weight="700">Technician I foundation</text><text x="600" y="165" text-anchor="middle" fill="#29465b" font-size="21" font-weight="700">Connect safety, biosecurity, identity, equipment boundaries and trustworthy records as one system.</text><circle cx="600" cy="475" r="245" fill="#fff" stroke="#d7d1c4" stroke-width="3"/><circle cx="600" cy="475" r="105" fill="#143f2d"/><text x="600" y="453" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">WORK INSIDE</text><text x="600" y="486" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">CONTROLLED</text><text x="600" y="519" text-anchor="middle" fill="#f4d35e" font-size="24" font-weight="800">AUTHORITY</text><g font-size="17"><rect x="430" y="210" width="340" height="105" rx="20" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="600" y="245" text-anchor="middle" fill="#123d2c" font-size="22" font-weight="800">1 • Review assigned work</text><text x="600" y="276" text-anchor="middle" fill="#163122">Current instruction • hazards • prerequisites • priorities</text><rect x="805" y="330" width="320" height="115" rx="20" fill="#eef3f7" stroke="#567087" stroke-width="3"/><text x="965" y="365" text-anchor="middle" fill="#29465b" font-size="22" font-weight="800">2 • Verify readiness</text><text x="965" y="396" text-anchor="middle" fill="#405a6e">Identity • status • access • sanitation</text><text x="965" y="423" text-anchor="middle" fill="#405a6e">equipment • required controls</text><rect x="795" y="535" width="330" height="115" rx="20" fill="#f7efd9" stroke="#a67820" stroke-width="3"/><text x="960" y="570" text-anchor="middle" fill="#6a4d14" font-size="22" font-weight="800">3 • Execute authorized work</text><text x="960" y="601" text-anchor="middle" fill="#6a4d14">Follow the current sequence and preserve</text><text x="960" y="628" text-anchor="middle" fill="#6a4d14">identity, controls and role boundaries.</text><rect x="430" y="655" width="340" height="115" rx="20" fill="#fff0e7" stroke="#b85d2a" stroke-width="3"/><text x="600" y="690" text-anchor="middle" fill="#5c2f16" font-size="22" font-weight="800">4 • Monitor and respond</text><text x="600" y="721" text-anchor="middle" fill="#5c2f16">Record changes; stop, hold or escalate when</text><text x="600" y="748" text-anchor="middle" fill="#5c2f16">conditions exceed the assigned procedure.</text><rect x="75" y="535" width="330" height="115" rx="20" fill="#eef3f7" stroke="#567087" stroke-width="3"/><text x="240" y="570" text-anchor="middle" fill="#29465b" font-size="22" font-weight="800">5 • Document reality</text><text x="240" y="601" text-anchor="middle" fill="#405a6e">Completed work, open work, timing, identity,</text><text x="240" y="628" text-anchor="middle" fill="#405a6e">exceptions and unresolved status.</text><rect x="75" y="330" width="330" height="115" rx="20" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="240" y="365" text-anchor="middle" fill="#123d2c" font-size="22" font-weight="800">6 • Communicate &amp; follow up</text><text x="240" y="396" text-anchor="middle" fill="#163122">Transfer controlled status, ownership and</text><text x="240" y="423" text-anchor="middle" fill="#163122">next authorized action to the right role.</text></g><g fill="none" stroke="#789083" stroke-width="4" stroke-linecap="round"><path d="M780 285 C865 290 915 300 950 322"/><path d="M1070 455 C1100 485 1095 515 1060 535"/><path d="M790 665 C760 700 735 710 770 700"/><path d="M410 710 C340 700 305 680 280 650"/><path d="M140 535 C110 500 115 470 145 445"/><path d="M250 320 C335 260 405 245 430 245"/></g><rect x="95" y="805" width="1010" height="58" rx="18" fill="#143f2d"/><text x="600" y="842" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">Do not turn blocked, uncertain or unauthorized work into “complete.” Preserve the true status and route it.</text></g></svg>