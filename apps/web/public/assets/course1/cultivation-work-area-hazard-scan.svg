<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Cultivation work-area hazard scan</title>
  <desc id="desc">A simplified cultivation room diagram showing examples of hazards a technician should notice: irrigation water approaching damaged electrical equipment, a blocked aisle, an unstable ladder, a sharp tool left exposed, plant dust during handling, intense lighting, and a carbon-dioxide alarm. The diagram emphasizes recognizing and escalating hazards rather than repairing equipment without authorization.</desc>
  <rect width="1200" height="820" rx="28" fill="#fffdf7"/>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#163122">Cultivation Work-Area Hazard Scan</text>
  <text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5a6b60">Scan people, pathways, equipment, environment, materials, and alarms before normalizing a condition</text>

  <g font-family="Arial, sans-serif">
    <rect x="80" y="130" width="1040" height="590" rx="22" fill="#f7f3e8" stroke="#d9d3c4" stroke-width="3"/>
    <rect x="120" y="170" width="900" height="430" rx="16" fill="#ffffff" stroke="#d9d3c4" stroke-width="2"/>
    <rect x="150" y="205" width="230" height="130" rx="16" fill="#e8f1ea" stroke="#245f3d" stroke-width="2"/>
    <text x="265" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="#163122">Plant bench</text>
    <g fill="#527f3a">
      <circle cx="200" cy="285" r="24"/><circle cx="265" cy="285" r="24"/><circle cx="330" cy="285" r="24"/>
    </g>

    <rect x="455" y="205" width="230" height="130" rx="16" fill="#e8f1ea" stroke="#245f3d" stroke-width="2"/>
    <text x="570" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="#163122">Plant bench</text>
    <g fill="#527f3a">
      <circle cx="505" cy="285" r="24"/><circle cx="570" cy="285" r="24"/><circle cx="635" cy="285" r="24"/>
    </g>

    <rect x="750" y="205" width="220" height="95" rx="16" fill="#eef3f7" stroke="#47637a" stroke-width="2"/>
    <text x="860" y="242" text-anchor="middle" font-size="20" font-weight="700" fill="#163122">CO₂ / life-safety alarm</text>
    <text x="860" y="270" text-anchor="middle" font-size="16" fill="#5a6b60">Follow posted response if active</text>

    <rect x="165" y="420" width="170" height="80" rx="14" fill="#eef3f7" stroke="#47637a" stroke-width="2"/>
    <text x="250" y="452" text-anchor="middle" font-size="18" font-weight="700" fill="#163122">Powered device</text>
    <path d="M310 475 L385 510" stroke="#9b5229" stroke-width="7"/>
    <path d="M360 495 l20 -20" stroke="#9b5229" stroke-width="4"/>
    <path d="M370 505 l20 -20" stroke="#9b5229" stroke-width="4"/>

    <path d="M90 540 C210 500, 300 570, 430 535 C520 510, 600 530, 690 550" stroke="#6a9bb8" stroke-width="22" opacity=".65" fill="none"/>
    <text x="245" y="585" font-size="17" fill="#47637a">Irrigation water spreading toward damaged cord</text>

    <rect x="530" y="405" width="110" height="150" rx="8" fill="#fff0e7" stroke="#9b5229" stroke-width="3" transform="rotate(8 585 480)"/>
    <line x1="555" y1="420" x2="555" y2="540" stroke="#9b5229" stroke-width="6"/>
    <line x1="612" y1="430" x2="612" y2="548" stroke="#9b5229" stroke-width="6"/>
    <line x1="552" y1="455" x2="613" y2="463" stroke="#9b5229" stroke-width="5"/>
    <line x1="552" y1="490" x2="613" y2="498" stroke="#9b5229" stroke-width="5"/>
    <text x="585" y="590" text-anchor="middle" font-size="17" fill="#9b5229">Damaged / unstable ladder</text>

    <rect x="715" y="410" width="190" height="95" rx="14" fill="#fbf2df" stroke="#8b5b24" stroke-width="3"/>
    <text x="810" y="445" text-anchor="middle" font-size="18" font-weight="700" fill="#163122">Cart in marked aisle</text>
    <text x="810" y="475" text-anchor="middle" font-size="16" fill="#5a6b60">Blocks normal movement</text>

    <path d="M965 420 l65 25 -65 25 z" fill="#9b5229"/>
    <rect x="930" y="439" width="45" height="12" rx="5" fill="#5a6b60"/>
    <text x="985" y="505" text-anchor="middle" font-size="16" fill="#9b5229">Exposed cutting tool</text>

    <rect x="150" y="625" width="890" height="58" rx="12" fill="#ffffff" stroke="#d9d3c4" stroke-width="2"/>
    <text x="595" y="660" text-anchor="middle" font-size="18" fill="#163122">Also scan for heat, intense light/UV, noise, plant dust/allergens, microbes, chemicals, slips/trips, and task-specific hazards.</text>

    <g>
      <line x1="255" y1="170" x2="255" y2="130" stroke="#a57a2b" stroke-width="8"/>
      <line x1="570" y1="170" x2="570" y2="130" stroke="#a57a2b" stroke-width="8"/>
      <line x1="860" y1="170" x2="860" y2="130" stroke="#a57a2b" stroke-width="8"/>
      <text x="570" y="150" text-anchor="middle" font-size="15" fill="#a57a2b">High-intensity lighting overhead</text>
    </g>
  </g>
</svg>
