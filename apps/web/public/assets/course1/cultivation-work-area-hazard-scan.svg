<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Workplace hazard recognition in a cultivation facility</title>
<desc id="desc">Course 1 hazard-recognition infographic for cultivation technicians. It shows representative slip, trip, electrical, chemical, ergonomic, environmental, biological, sharp-tool, fire and access hazards and reminds learners to identify the condition, assess whether an authorized routine control is sufficient, stop when work cannot proceed safely, and escalate conditions outside their authority.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#0b382b"/><stop offset="1" stop-color="#145d45"/></linearGradient><style>text{font-family:Arial,sans-serif}.h{font-weight:700;fill:#fff}.t{fill:#17352a}.m{fill:#52645b}.s{font-size:18px}.b{font-size:22px;font-weight:700}.p{font-size:16px}</style></defs>
<rect width="1600" height="1000" fill="#f7f4ea"/><rect width="1600" height="120" fill="url(#g)"/><text x="70" y="54" class="h" font-size="30">THC ACADEMY • COURSE 1 • LESSON 1.1</text><text x="70" y="96" class="h" font-size="48">WORKPLACE HAZARD RECOGNITION</text><text x="1530" y="55" text-anchor="end" class="h" font-size="22">SEE IT • ASSESS IT • CONTROL IT</text><text x="1530" y="88" text-anchor="end" fill="#b8e46f" font-size="20">Act only within training and authorization</text>
<rect x="45" y="150" width="1060" height="555" rx="26" fill="#fff" stroke="#c9d4cb" stroke-width="3"/><text x="75" y="190" class="b t">Scan the whole work area, not only the task in front of you</text><text x="75" y="220" class="s m">People • pathways • equipment • environment • materials • alarms</text>
<rect x="80" y="260" width="930" height="350" rx="20" fill="#e8f0e8" stroke="#7aa083" stroke-width="2"/>
<rect x="120" y="305" width="215" height="105" rx="14" fill="#d8ead8"/><text x="228" y="342" text-anchor="middle" class="b t">PLANT BENCH</text><circle cx="165" cy="375" r="24" fill="#4f7d39"/><circle cx="228" cy="375" r="24" fill="#4f7d39"/><circle cx="290" cy="375" r="24" fill="#4f7d39"/>
<rect x="390" y="305" width="215" height="105" rx="14" fill="#d8ead8"/><text x="498" y="342" text-anchor="middle" class="b t">PLANT BENCH</text><circle cx="435" cy="375" r="24" fill="#4f7d39"/><circle cx="498" cy="375" r="24" fill="#4f7d39"/><circle cx="560" cy="375" r="24" fill="#4f7d39"/>
<rect x="685" y="288" width="210" height="78" rx="13" fill="#edf2f7" stroke="#58748a"/><text x="790" y="322" text-anchor="middle" class="b t">AIR / ALARM</text><text x="790" y="349" text-anchor="middle" class="p m">Ventilation, gas monitor, alarm</text>
<path d="M95 530 C250 480 315 565 485 520 C605 490 730 550 875 530" stroke="#5c9ac0" stroke-width="25" opacity=".7" fill="none"/><text x="145" y="575" class="s" fill="#285d78">Wet floor / spreading water</text>
<rect x="190" y="450" width="160" height="70" rx="12" fill="#f4f6f7" stroke="#47637a" stroke-width="2"/><text x="270" y="482" text-anchor="middle" class="b t">POWERED DEVICE</text><path d="M335 495 l92 32" stroke="#9a3e2f" stroke-width="8"/><text x="365" y="455" class="p" fill="#9a3e2f">damaged cord</text>
<rect x="515" y="435" width="100" height="145" rx="8" fill="#fff0e4" stroke="#a36a2f" stroke-width="4" transform="rotate(7 565 510)"/><line x1="535" y1="455" x2="540" y2="565" stroke="#a36a2f" stroke-width="5"/><line x1="590" y1="460" x2="595" y2="570" stroke="#a36a2f" stroke-width="5"/><line x1="537" y1="495" x2="592" y2="500" stroke="#a36a2f" stroke-width="4"/><text x="565" y="620" text-anchor="middle" class="p" fill="#8a5827">unstable / damaged ladder</text>
<rect x="700" y="430" width="185" height="85" rx="14" fill="#fff4d8" stroke="#9d752b" stroke-width="3"/><text x="792" y="466" text-anchor="middle" class="b t">BLOCKED AISLE</text><text x="792" y="494" text-anchor="middle" class="p m">cart, hose, clutter</text>
<path d="M930 445 l65 24 -65 24z" fill="#9a3e2f"/><rect x="900" y="463" width="42" height="11" rx="5" fill="#5d665f"/><text x="948" y="525" text-anchor="middle" class="p" fill="#9a3e2f">exposed sharp tool</text>
<g><rect x="45" y="735" width="250" height="215" rx="20" fill="#fff" stroke="#ccd8cf"/><text x="70" y="775" class="b t">COMMON HAZARD TYPES</text><text x="70" y="812" class="s t">• Slip, trip and fall</text><text x="70" y="842" class="s t">• Electrical / fire</text><text x="70" y="872" class="s t">• Chemical exposure</text><text x="70" y="902" class="s t">• Ergonomic / physical</text><text x="70" y="932" class="s t">• Biological / environmental</text></g>
<g><rect x="325" y="735" width="350" height="215" rx="20" fill="#fff" stroke="#ccd8cf"/><text x="350" y="775" class="b t">TECHNICIAN RESPONSE</text><text x="350" y="812" class="s t">1. Identify the observed condition.</text><text x="350" y="842" class="s t">2. Use an approved routine control if authorized.</text><text x="350" y="872" class="s t">3. Verify the condition is actually controlled.</text><text x="350" y="902" class="s t">4. Stop and escalate when it is not controlled.</text><text x="350" y="932" class="s t">5. Follow emergency procedures for life-safety events.</text></g>
<g><rect x="705" y="735" width="400" height="215" rx="20" fill="#fff8e6" stroke="#d8bd72"/><text x="730" y="775" class="b t">AUTHORITY BOUNDARY</text><text x="730" y="815" class="s t">Recognition does not equal repair authority.</text><text x="730" y="850" class="s t">Do not open, bypass, modify, troubleshoot or repair</text><text x="730" y="880" class="s t">electrical, mechanical, alarm or life-safety systems</text><text x="730" y="910" class="s t">unless you are specifically trained and authorized.</text></g>
<g><rect x="1140" y="150" width="415" height="800" rx="26" fill="#113f31"/><text x="1180" y="205" class="h" font-size="28">HAZARD SPOTTING CHECKLIST</text><line x1="1180" y1="225" x2="1510" y2="225" stroke="#7fc896" stroke-width="2"/><text x="1180" y="270" class="h s">✓ Walkways and exits are clear</text><text x="1180" y="315" class="h s">✓ Floors are dry or controlled</text><text x="1180" y="360" class="h s">✓ Cords, guards and tools are intact</text><text x="1180" y="405" class="h s">✓ Chemicals are identified and controlled</text><text x="1180" y="450" class="h s">✓ Ventilation and alarms look normal</text><text x="1180" y="495" class="h s">✓ Heat, noise and lighting are considered</text><text x="1180" y="540" class="h s">✓ Biological exposure routes are considered</text><text x="1180" y="585" class="h s">✓ The response is within your authority</text><rect x="1180" y="650" width="330" height="180" rx="18" fill="#e8f1ea"/><text x="1210" y="695" class="b t">IF CONDITIONS CHANGE</text><text x="1210" y="735" class="s t">Reassess the task.</text><text x="1210" y="770" class="s t">A valid work order does not authorize</text><text x="1210" y="800" class="s t">continuing through a new uncontrolled hazard.</text><text x="1360" y="890" text-anchor="middle" class="h" font-size="26">SAFE WORK = COMPETENT WORK</text></g>
</svg>