<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Equipment readiness and operator-versus-maintenance boundary</title><desc id="desc">Course 1 equipment visual showing a pre-use readiness scan, routine operator care explicitly assigned by current instructions, and clear servicing boundary cues such as guard removal, protected electrical access, disassembly, hazardous motion, pressure or stored energy. Failed checks require control and escalation, not improvised repair.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#0d3b2a"/><stop offset="1" stop-color="#145c3d"/></linearGradient></defs><rect width="1200" height="900" rx="28" fill="#f7f5ec"/><rect width="1200" height="122" rx="28" fill="url(#g)"/><g font-family="Arial,sans-serif"><text x="55" y="48" fill="#f4d35e" font-size="18" font-weight="700">THC ACADEMY • COURSE 1 • EQUIPMENT</text><text x="55" y="91" fill="#fff" font-size="36" font-weight="800">Pre-Use Readiness + Operator Boundary</text><text x="1110" y="47" text-anchor="end" fill="#dcefe4" font-size="17">Lessons 5.1–5.2</text><text x="1110" y="83" text-anchor="end" fill="#fff" font-size="18" font-weight="700">Inspect. Verify. Stay in scope.</text><rect x="45" y="155" width="1110" height="120" rx="20" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="75" y="192" fill="#123d2c" font-size="25" font-weight="800">1 • Pre-use readiness scan</text><g fill="#123d2c" font-size="18"><text x="78" y="228">✓ Confirm exact asset and current controlled status</text><text x="430" y="228">✓ Compare accessible condition to defined criteria</text><text x="820" y="228">✓ Review only indicators assigned to the operator</text><text x="78" y="258">✓ If a criterion fails: hold, document and escalate under procedure</text></g><rect x="45" y="305" width="525" height="410" rx="22" fill="#eef7f1" stroke="#2e7d4f" stroke-width="3"/><text x="307" y="350" text-anchor="middle" fill="#123d2c" font-size="28" font-weight="800">Routine operator care</text><text x="307" y="379" text-anchor="middle" fill="#557064" font-size="16">Only when explicitly assigned by equipment instructions + site SOP</text><g fill="#123d2c" font-size="20"><text x="85" y="430">✓ External visual inspection</text><text x="85" y="478">✓ Assigned cleaning / sanitation</text><text x="85" y="526">✓ Simple setup defined for operator</text><text x="85" y="574">✓ Visible connection / leak checks</text><text x="85" y="622">✓ External readings / indicators</text><text x="85" y="670">✓ Defined reset or routine correction, if authorized</text></g><rect x="630" y="305" width="525" height="410" rx="22" fill="#fff0e7" stroke="#b85d2a" stroke-width="3"/><text x="892" y="350" text-anchor="middle" fill="#5c2f16" font-size="28" font-weight="800">Stop: servicing / maintenance boundary</text><text x="892" y="379" text-anchor="middle" fill="#7a5b4a" font-size="16">Transfer to the employer-defined trained / authorized role</text><g fill="#5c2f16" font-size="20"><text x="670" y="430">✕ Remove or bypass a guard</text><text x="670" y="478">✕ Enter a hazardous motion area</text><text x="670" y="526">✕ Open protected electrical components</text><text x="670" y="574">✕ Disassemble powered equipment</text><text x="670" y="622">✕ Release pressure or stored energy</text><text x="670" y="670">✕ Perform repair not assigned by the current procedure</text></g><rect x="120" y="755" width="960" height="100" rx="22" fill="#143f2d"/><text x="600" y="793" text-anchor="middle" fill="#f4d35e" font-size="24" font-weight="800">A failed readiness check does not create repair authority.</text><text x="600" y="826" text-anchor="middle" fill="#fff" font-size="18">Preserve controlled status, record the evidence, and escalate when the operator procedure ends.</text></g></svg>