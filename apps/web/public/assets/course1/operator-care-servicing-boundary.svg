<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Operator care versus servicing boundary</title><desc id="desc">A two-sided boundary diagram. Operator care includes explicitly assigned external inspection, cleaning, setup, visible connection checks, consumable replacement, readings, and other actions defined by the manual and site SOP. Servicing includes removing guards, entering hazardous motion areas, opening protected electrical components, disassembling powered equipment, releasing pressure or stored energy, and other work requiring qualified authorization and energy-control procedures.</desc><rect width="1200" height="780" rx="28" fill="#fffdf7"/><text x="600" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#163122">Operator Care vs. Servicing: Know the Boundary</text><text x="600" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5a6b60">“I know how” is not the same as “I am assigned and authorized”</text><g font-family="Arial,sans-serif"><rect x="70" y="145" width="500" height="500" rx="24" fill="#e8f1ea" stroke="#245f3d" stroke-width="3"/><rect x="630" y="145" width="500" height="500" rx="24" fill="#fff0e7" stroke="#9b5229" stroke-width="3"/><text x="320" y="195" text-anchor="middle" font-size="27" font-weight="700" fill="#163122">Routine operator care</text><text x="880" y="195" text-anchor="middle" font-size="27" font-weight="700" fill="#163122">Servicing / technical maintenance</text><text x="320" y="227" text-anchor="middle" font-size="16" fill="#5a6b60">Only when explicitly assigned by manual + site SOP</text><text x="880" y="227" text-anchor="middle" font-size="16" fill="#5a6b60">Requires the employer-defined qualified / authorized role</text><g fill="#163122" font-size="18"><text x="115" y="285">• External visual inspection</text><text x="115" y="330">• Assigned cleaning / sanitation</text><text x="115" y="375">• Simple setup defined for operator</text><text x="115" y="420">• Visible connection / leak checks</text><text x="115" y="465">• Consumable replacement if assigned</text><text x="115" y="510">• External readings / indicators</text><text x="115" y="555">• Defined reset or readiness check</text><text x="675" y="285">• Remove or bypass a guard</text><text x="675" y="330">• Reach into hazardous motion area</text><text x="675" y="375">• Open protected electrical components</text><text x="675" y="420">• Disassemble powered equipment</text><text x="675" y="465">• Release pressure / stored energy</text><text x="675" y="510">• Clear jams with startup hazard</text><text x="675" y="555">• Work covered by energy-control procedure</text></g><rect x="365" y="680" width="470" height="62" rx="16" fill="#fbf2df" stroke="#8b5b24" stroke-width="2"/><text x="600" y="707" text-anchor="middle" font-size="18" font-weight="700" fill="#163122">When the defined operator procedure ends, stop and escalate.</text><text x="600" y="732" text-anchor="middle" font-size="15" fill="#5a6b60">Course completion does not grant lockout/tagout authorization or skilled-maintenance status.</text></g></svg>