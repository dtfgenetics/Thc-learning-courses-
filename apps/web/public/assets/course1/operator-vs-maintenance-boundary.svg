<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Operator care versus maintenance boundary</title><desc id="desc">Course 1 Module 5 Lesson 5.2 visual separating routine operator actions explicitly assigned, trained, and authorized by current procedure from servicing or maintenance involving guards, protected access, electrical components, disassembly, stored energy, pressure, or other hazards that require the employer-defined authorized role.</desc><defs><linearGradient id="header" x1="0" x2="1"><stop stop-color="#0d3b2a"/><stop offset="1" stop-color="#1b6546"/></linearGradient></defs><rect width="1200" height="900" rx="28" fill="#f7f5ec"/><rect width="1200" height="122" rx="28" fill="url(#header)"/><g font-family="Arial,sans-serif"><text x="54" y="43" fill="#f4d35e" font-size="18" font-weight="700">THC ACADEMY • COURSE 1 • MODULE 5</text><text x="54" y="88" fill="#fff" font-size="37" font-weight="800">Operator Care vs. Maintenance</text><text x="1140" y="45" text-anchor="end" fill="#dcefe4" font-size="17">Lesson 5.2</text><text x="1140" y="79" text-anchor="end" fill="#fff" font-size="17" font-weight="700">Technician I foundation</text><text x="600" y="168" text-anchor="middle" fill="#29465b" font-size="21" font-weight="700">The controlled equipment instructions and employer procedure define the boundary.</text><rect x="55" y="205" width="515" height="505" rx="24" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="312" y="252" text-anchor="middle" fill="#123d2c" font-size="29" font-weight="800">Operator care</text><text x="312" y="287" text-anchor="middle" fill="#1b6546" font-size="18" font-weight="700">Only when explicitly assigned, trained and authorized</text><g fill="#163122" font-size="20"><text x="95" y="340">✓ External inspection and observation</text><text x="95" y="388">✓ Routine cleaning or setup steps</text><text x="95" y="436">✓ Specified external indicators or checks</text><text x="95" y="484">✓ Approved consumable or simple adjustment</text><text x="95" y="532">✓ One permitted reset when procedure allows</text><text x="95" y="580">✓ Record results and preserve current status</text></g><rect x="630" y="205" width="515" height="505" rx="24" fill="#fff0e7" stroke="#b85d2a" stroke-width="3"/><text x="887" y="252" text-anchor="middle" fill="#5c2f16" font-size="29" font-weight="800">Stop and refer</text><text x="887" y="287" text-anchor="middle" fill="#7b4121" font-size="18" font-weight="700">Servicing or protected work stays with the authorized role</text><g fill="#5c2f16" font-size="20"><text x="670" y="340">• Guard or safety device removal/bypass</text><text x="670" y="388">• Danger-zone entry or protected access</text><text x="670" y="436">• Electrical enclosure or qualified work</text><text x="670" y="484">• Powered disassembly or internal repair</text><text x="670" y="532">• Pressure, gravity, heat or stored energy</text><text x="670" y="580">• Diagnosis, calibration or unassigned action</text></g><rect x="95" y="745" width="1010" height="105" rx="20" fill="#143f2d"/><text x="600" y="786" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">If the procedure does not assign the action, stop and clarify.</text><text x="600" y="821" text-anchor="middle" fill="#dcefe4" font-size="18">A stopped machine is not proof that hazardous or stored energy is controlled.</text></g></svg>