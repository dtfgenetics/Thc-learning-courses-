<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">PPE task guide and hazard communication map for cultivation technicians</title>
<desc id="desc">Course 1 infographic showing that personal protective equipment must be selected from the assigned task, employer hazard assessment, current product label and Safety Data Sheet, site SOP or work order, and applicable restrictions. It shows common PPE categories and reminds learners that respirator use, pesticide handling and other specialized tasks require specific authorization, training and program requirements.</desc>
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#0a382b"/><stop offset="1" stop-color="#155d46"/></linearGradient><style>text{font-family:Arial,sans-serif}.h{fill:#fff;font-weight:700}.t{fill:#17352a}.m{fill:#56685d}.b{font-weight:700}.s{font-size:18px}.p{font-size:16px}</style></defs>
<rect width="1600" height="1000" fill="#f7f4ea"/><rect width="1600" height="120" fill="url(#head)"/><text x="65" y="52" class="h" font-size="30">THC ACADEMY • COURSE 1 • LESSON 1.2</text><text x="65" y="96" class="h" font-size="48">PPE TASK GUIDE + HAZARD COMMUNICATION</text><text x="1530" y="55" text-anchor="end" fill="#b8e46f" font-size="23" font-weight="700">RIGHT TASK • RIGHT INFORMATION • RIGHT PPE</text><text x="1530" y="89" text-anchor="end" class="h" font-size="18">Do not select protection from habit or memory alone.</text>
<rect x="45" y="150" width="960" height="790" rx="24" fill="#fff" stroke="#cad5cc" stroke-width="3"/><text x="75" y="195" class="b t" font-size="27">PPE decisions start with controlled information</text><text x="75" y="226" class="s m">Confirm the task, hazard assessment, label/SDS, current procedure and restrictions before work begins.</text>
<g><rect x="80" y="270" width="190" height="120" rx="18" fill="#e9f2ea" stroke="#2d744b" stroke-width="2"/><text x="175" y="310" text-anchor="middle" class="b t" font-size="21">ASSIGNED TASK</text><text x="175" y="344" text-anchor="middle" class="p t">Area • tools • material</text><text x="175" y="370" text-anchor="middle" class="p t">expected exposure</text>
<rect x="300" y="270" width="190" height="120" rx="18" fill="#e9f2ea" stroke="#2d744b" stroke-width="2"/><text x="395" y="310" text-anchor="middle" class="b t" font-size="21">HAZARD ASSESSMENT</text><text x="395" y="344" text-anchor="middle" class="p t">Employer-selected controls</text><text x="395" y="370" text-anchor="middle" class="p t">and required PPE</text>
<rect x="520" y="270" width="190" height="120" rx="18" fill="#edf2f7" stroke="#58748a" stroke-width="2"/><text x="615" y="310" text-anchor="middle" class="b t" font-size="21">LABEL + SDS</text><text x="615" y="344" text-anchor="middle" class="p t">Hazards • first aid</text><text x="615" y="370" text-anchor="middle" class="p t">handling • exposure controls</text>
<rect x="740" y="270" width="220" height="120" rx="18" fill="#fff4db" stroke="#a1762e" stroke-width="2"/><text x="850" y="310" text-anchor="middle" class="b t" font-size="21">SOP + RESTRICTIONS</text><text x="850" y="344" text-anchor="middle" class="p t">Work order • site rules</text><text x="850" y="370" text-anchor="middle" class="p t">entry status • qualifications</text></g>
<path d="M175 390 V435 H520" stroke="#63736a" stroke-width="4"/><path d="M395 390 V435" stroke="#63736a" stroke-width="4"/><path d="M615 390 V435" stroke="#63736a" stroke-width="4"/><path d="M850 390 V435 H560" stroke="#63736a" stroke-width="4"/><path d="M520 435 V470" stroke="#63736a" stroke-width="4"/>
<rect x="210" y="475" width="630" height="120" rx="22" fill="#dcecdf" stroke="#2d744b" stroke-width="4"/><text x="525" y="520" text-anchor="middle" class="b t" font-size="26">CONFIRM THE CONTROL PACKAGE</text><text x="525" y="555" text-anchor="middle" class="s t">Correct product • required controls • PPE • authorization • entry status</text><text x="525" y="582" text-anchor="middle" class="s t">Resolve missing or conflicting information before proceeding.</text>
<text x="75" y="650" class="b t" font-size="25">COMMON PPE CATEGORIES</text><g><rect x="75" y="680" width="170" height="160" rx="18" fill="#f1f7f2"/><circle cx="160" cy="730" r="28" fill="#2d744b"/><text x="160" y="738" text-anchor="middle" class="h" font-size="23">EYE</text><text x="160" y="790" text-anchor="middle" class="b t" font-size="18">Eye / face</text><text x="160" y="818" text-anchor="middle" class="p m">glasses • goggles • shield</text>
<rect x="260" y="680" width="170" height="160" rx="18" fill="#f1f7f2"/><circle cx="345" cy="730" r="28" fill="#2d744b"/><text x="345" y="738" text-anchor="middle" class="h" font-size="21">HAND</text><text x="345" y="790" text-anchor="middle" class="b t" font-size="18">Hand protection</text><text x="345" y="818" text-anchor="middle" class="p m">task / chemical specific</text>
<rect x="445" y="680" width="170" height="160" rx="18" fill="#f1f7f2"/><circle cx="530" cy="730" r="28" fill="#2d744b"/><text x="530" y="738" text-anchor="middle" class="h" font-size="18">BODY</text><text x="530" y="790" text-anchor="middle" class="b t" font-size="18">Protective clothing</text><text x="530" y="818" text-anchor="middle" class="p m">as required by the task</text>
<rect x="630" y="680" width="170" height="160" rx="18" fill="#f1f7f2"/><circle cx="715" cy="730" r="28" fill="#2d744b"/><text x="715" y="738" text-anchor="middle" class="h" font-size="18">FOOT</text><text x="715" y="790" text-anchor="middle" class="b t" font-size="18">Foot protection</text><text x="715" y="818" text-anchor="middle" class="p m">task / facility specific</text>
<rect x="815" y="680" width="170" height="160" rx="18" fill="#f1f7f2"/><circle cx="900" cy="730" r="28" fill="#2d744b"/><text x="900" y="738" text-anchor="middle" class="h" font-size="16">RESP</text><text x="900" y="790" text-anchor="middle" class="b t" font-size="18">Respiratory</text><text x="900" y="818" text-anchor="middle" class="p m">only under required program</text></g>
<rect x="1040" y="150" width="515" height="790" rx="24" fill="#123f31"/><text x="1080" y="205" class="h" font-size="28">TASK-BASED DECISION CHECK</text><line x1="1080" y1="225" x2="1510" y2="225" stroke="#79c18e" stroke-width="2"/><text x="1080" y="275" class="h s">✓ What exactly is the task and material?</text><text x="1080" y="320" class="h s">✓ What hazards were identified for this task?</text><text x="1080" y="365" class="h s">✓ What does the current label and SDS require?</text><text x="1080" y="410" class="h s">✓ What does the current site SOP or work order require?</text><text x="1080" y="455" class="h s">✓ Are there entry, pesticide, respirator or other restrictions?</text><text x="1080" y="500" class="h s">✓ Is the PPE intact, compatible and correctly fitted?</text><rect x="1080" y="565" width="430" height="245" rx="18" fill="#eef5ef"/><text x="1110" y="610" class="b t" font-size="23">IMPORTANT BOUNDARIES</text><text x="1110" y="650" class="s t">• An SDS is an information source, not a substitute for the label or site procedure.</text><text x="1110" y="710" class="s t">• Respirator use may require medical evaluation, fit testing, training and a respiratory-protection program.</text><text x="1110" y="790" class="s t">• Pesticide-handler duties require the applicable label, training and authorization.</text><text x="1298" y="875" text-anchor="middle" fill="#b8e46f" font-size="25" font-weight="700">WHEN INFORMATION DOESN'T ALIGN: STOP AND VERIFY</text>
</svg>