<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Controlled SOP and work-order anatomy</title><desc id="desc">An annotated controlled work instruction showing document identity and revision, scope and prerequisites, material or asset identity, sequence, acceptance criteria, required records, decision points, and escalation contact. A companion work-order card shows that a work order applies the controlled method to a specific room, batch, quantity, asset, date, or shift and should agree with the current SOP.</desc><rect width="1200" height="820" rx="28" fill="#fffdf7"/><text x="600" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#163122">Controlled Instruction Anatomy</text><text x="600" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5a6b60">The current instruction defines the method; the work order applies it to specific work</text><g font-family="Arial,sans-serif"><rect x="75" y="135" width="690" height="600" rx="20" fill="#fff" stroke="#d9d3c4" stroke-width="3"/><text x="110" y="180" font-size="25" font-weight="700" fill="#163122">SOP: Controlled routine method</text><rect x="110" y="205" width="620" height="60" rx="10" fill="#eef3f7"/><text x="130" y="232" font-size="16" font-weight="700" fill="#47637a">DOCUMENT CONTROL</text><text x="130" y="254" font-size="15" fill="#163122">ID • revision • effective status • owner</text><rect x="110" y="285" width="295" height="105" rx="12" fill="#e8f1ea"/><text x="130" y="317" font-size="18" font-weight="700" fill="#163122">Scope &amp; prerequisites</text><text x="130" y="346" font-size="15" fill="#5a6b60">Who / what / where it applies</text><text x="130" y="372" font-size="15" fill="#5a6b60">training, PPE, setup, authorization</text><rect x="435" y="285" width="295" height="105" rx="12" fill="#e8f1ea"/><text x="455" y="317" font-size="18" font-weight="700" fill="#163122">Identity &amp; inputs</text><text x="455" y="346" font-size="15" fill="#5a6b60">room • plant/material • asset</text><text x="455" y="372" font-size="15" fill="#5a6b60">tools • products • records</text><rect x="110" y="410" width="620" height="105" rx="12" fill="#fff" stroke="#a57a2b" stroke-width="2"/><text x="130" y="442" font-size="18" font-weight="700" fill="#163122">Sequence / actions</text><text x="130" y="470" font-size="15" fill="#5a6b60">ordered steps • decision points • conditions that stop or change work</text><text x="130" y="496" font-size="15" fill="#5a6b60">do not replace current steps with “the way we usually do it”</text><rect x="110" y="535" width="295" height="130" rx="12" fill="#fbf2df"/><text x="130" y="567" font-size="18" font-weight="700" fill="#163122">Acceptance criteria</text><text x="130" y="595" font-size="15" fill="#5a6b60">What proves the task is complete?</text><text x="130" y="622" font-size="15" fill="#5a6b60">count • measurement • cleanliness</text><text x="130" y="648" font-size="15" fill="#5a6b60">identity check • signoff • status</text><rect x="435" y="535" width="295" height="130" rx="12" fill="#fff0e7"/><text x="455" y="567" font-size="18" font-weight="700" fill="#163122">Records &amp; escalation</text><text x="455" y="595" font-size="15" fill="#5a6b60">What must be recorded?</text><text x="455" y="622" font-size="15" fill="#5a6b60">What exceptions require a stop?</text><text x="455" y="648" font-size="15" fill="#5a6b60">Who owns the next decision?</text><rect x="825" y="190" width="300" height="430" rx="20" fill="#eef3f7" stroke="#47637a" stroke-width="3"/><text x="975" y="232" text-anchor="middle" font-size="24" font-weight="700" fill="#163122">Work order</text><text x="975" y="263" text-anchor="middle" font-size="16" fill="#5a6b60">Specific execution context</text><g font-size="16" fill="#163122"><text x="860" y="320">Room / location</text><text x="860" y="360">Batch / material ID</text><text x="860" y="400">Asset / equipment</text><text x="860" y="440">Quantity / count</text><text x="860" y="480">Date / shift / priority</text><text x="860" y="520">Assigned task / status</text></g><rect x="850" y="555" width="250" height="45" rx="10" fill="#fff"/><text x="975" y="584" text-anchor="middle" font-size="15" font-weight="700" fill="#9b5229">Conflict? Stop and resolve it.</text><text x="600" y="780" text-anchor="middle" font-size="17" fill="#5a6b60">A printed page can look official and still be obsolete. Verify the controlled revision before affected work.</text></g></svg>