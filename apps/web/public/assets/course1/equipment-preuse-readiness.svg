<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Equipment pre-use readiness</title><desc id="desc">Course 1 Module 5 Lesson 5.1 visual showing a technician pre-use readiness sequence: confirm asset identity and assignment, check controlled status, inspect only assigned external points, review permitted indicators, classify the finding, and document the final status. Failed criteria require the site-defined hold or escalation process and do not authorize repair.</desc><defs><linearGradient id="header" x1="0" x2="1"><stop stop-color="#0d3b2a"/><stop offset="1" stop-color="#1b6546"/></linearGradient></defs><rect width="1200" height="900" rx="28" fill="#f7f5ec"/><rect width="1200" height="122" rx="28" fill="url(#header)"/><g font-family="Arial,sans-serif"><text x="54" y="43" fill="#f4d35e" font-size="18" font-weight="700">THC ACADEMY • COURSE 1 • MODULE 5</text><text x="54" y="88" fill="#fff" font-size="38" font-weight="800">Equipment Pre-Use Readiness</text><text x="1140" y="45" text-anchor="end" fill="#dcefe4" font-size="17">Lesson 5.1</text><text x="1140" y="79" text-anchor="end" fill="#fff" font-size="17" font-weight="700">Technician I foundation</text><text x="60" y="166" fill="#29465b" font-size="21" font-weight="700">Use the current equipment and site procedure. A pre-use check verifies readiness; it is not a repair assignment.</text><g font-size="19" fill="#163122"><rect x="55" y="205" width="210" height="210" rx="22" fill="#fff" stroke="#c8d6cd" stroke-width="3"/><circle cx="160" cy="255" r="34" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="160" y="264" text-anchor="middle" fill="#1b6546" font-size="28" font-weight="800">1</text><text x="80" y="318" font-size="22" font-weight="800">Identify</text><text x="80" y="352">Confirm exact asset,</text><text x="80" y="380">location and assignment.</text><rect x="285" y="205" width="210" height="210" rx="22" fill="#fff" stroke="#c8d6cd" stroke-width="3"/><circle cx="390" cy="255" r="34" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="390" y="264" text-anchor="middle" fill="#1b6546" font-size="28" font-weight="800">2</text><text x="310" y="318" font-size="22" font-weight="800">Status</text><text x="310" y="352">Check holds, faults,</text><text x="310" y="380">maintenance notes or</text><text x="310" y="406">out-of-service status.</text><rect x="515" y="205" width="210" height="210" rx="22" fill="#fff" stroke="#c8d6cd" stroke-width="3"/><circle cx="620" cy="255" r="34" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="620" y="264" text-anchor="middle" fill="#1b6546" font-size="28" font-weight="800">3</text><text x="540" y="318" font-size="22" font-weight="800">Inspect</text><text x="540" y="352">Review only assigned</text><text x="540" y="380">external readiness points</text><text x="540" y="406">and visible condition.</text><rect x="745" y="205" width="210" height="210" rx="22" fill="#fff" stroke="#c8d6cd" stroke-width="3"/><circle cx="850" cy="255" r="34" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="850" y="264" text-anchor="middle" fill="#1b6546" font-size="28" font-weight="800">4</text><text x="770" y="318" font-size="22" font-weight="800">Indicators</text><text x="770" y="352">Review alarms, displays</text><text x="770" y="380">or readings included in</text><text x="770" y="406">the operator procedure.</text><rect x="975" y="205" width="170" height="210" rx="22" fill="#fff" stroke="#c8d6cd" stroke-width="3"/><circle cx="1060" cy="255" r="34" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="1060" y="264" text-anchor="middle" fill="#1b6546" font-size="28" font-weight="800">5</text><text x="1000" y="318" font-size="22" font-weight="800">Classify</text><text x="1000" y="352">Choose the status</text><text x="1000" y="380">supported by the</text><text x="1000" y="406">evidence.</text></g><text x="60" y="470" fill="#123d2c" font-size="24" font-weight="800">Readiness outcomes</text><rect x="55" y="500" width="255" height="185" rx="22" fill="#e7f3eb" stroke="#2e7d4f" stroke-width="3"/><text x="80" y="540" fill="#123d2c" font-size="23" font-weight="800">READY</text><text x="80" y="578" fill="#163122" font-size="18">Specified checks pass.</text><text x="80" y="610" fill="#163122" font-size="18">Operate under current</text><text x="80" y="638" fill="#163122" font-size="18">work instructions.</text><rect x="330" y="500" width="255" height="185" rx="22" fill="#eef3f7" stroke="#567087" stroke-width="3"/><text x="355" y="540" fill="#29465b" font-size="23" font-weight="800">ROUTINE CORRECTION</text><text x="355" y="578" fill="#405a6e" font-size="18">Only when explicitly</text><text x="355" y="610" fill="#405a6e" font-size="18">assigned, trained and</text><text x="355" y="638" fill="#405a6e" font-size="18">authorized by procedure.</text><rect x="605" y="500" width="255" height="185" rx="22" fill="#fff0e7" stroke="#b85d2a" stroke-width="3"/><text x="630" y="540" fill="#5c2f16" font-size="23" font-weight="800">HOLD / ESCALATE</text><text x="630" y="578" fill="#5c2f16" font-size="18">Failed criterion, open fault</text><text x="630" y="610" fill="#5c2f16" font-size="18">or unresolved controlled</text><text x="630" y="638" fill="#5c2f16" font-size="18">status: do not use.</text><rect x="880" y="500" width="265" height="185" rx="22" fill="#fdecec" stroke="#a94442" stroke-width="3"/><text x="905" y="540" fill="#7a2c2a" font-size="23" font-weight="800">EMERGENCY</text><text x="905" y="578" fill="#7a2c2a" font-size="18">Immediate serious hazard:</text><text x="905" y="610" fill="#7a2c2a" font-size="18">follow the posted emergency</text><text x="905" y="638" fill="#7a2c2a" font-size="18">response procedure.</text><rect x="95" y="730" width="1010" height="108" rx="20" fill="#143f2d"/><text x="600" y="772" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">Failed readiness criteria do not create repair authority.</text><text x="600" y="808" text-anchor="middle" fill="#dcefe4" font-size="18">Preserve controlled status and follow the site-defined out-of-service or escalation process.</text></g></svg>