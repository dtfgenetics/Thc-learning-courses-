<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Deviation, exception, incomplete and unknown status decision map</title><desc id="desc">A decision flow for classifying cultivation work as complete, planned exception, deviation, incomplete, or unknown and unverified. The diagram emphasizes preserving actual facts, missing information, immediate controls, notification, and open ownership rather than forcing work to appear complete.</desc><rect width="1200" height="820" rx="28" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5a6b60"/></marker></defs><g font-family="Arial,sans-serif"><text x="600" y="55" text-anchor="middle" font-size="34" font-weight="700" fill="#163122">What Is the Honest Work Status?</text><text x="600" y="90" text-anchor="middle" font-size="18" fill="#5a6b60">Classify what actually happened before closing the task</text><rect x="395" y="125" width="410" height="86" rx="18" fill="#e8f1ea" stroke="#245f3d" stroke-width="3"/><text x="600" y="160" text-anchor="middle" font-size="21" font-weight="700" fill="#163122">Are all required steps, evidence, and acceptance criteria satisfied?</text><text x="600" y="190" text-anchor="middle" font-size="16" fill="#5a6b60">Use the current controlled instruction—not memory or intent</text><path d="M600 211 V260" stroke="#5a6b60" stroke-width="4" marker-end="url(#arrow)"/><rect x="470" y="265" width="260" height="80" rx="17" fill="#fff" stroke="#d9d3c4" stroke-width="3"/><text x="600" y="299" text-anchor="middle" font-size="22" font-weight="700" fill="#163122">YES</text><text x="600" y="328" text-anchor="middle" font-size="17" fill="#5a6b60">Complete</text><path d="M470 305 H280" stroke="#5a6b60" stroke-width="4" marker-end="url(#arrow)"/><text x="380" y="291" text-anchor="middle" font-size="16" fill="#5a6b60">NO</text><rect x="45" y="250" width="235" height="110" rx="18" fill="#fff" stroke="#d9d3c4" stroke-width="3"/><text x="162" y="283" text-anchor="middle" font-size="19" font-weight="700" fill="#163122">Did the procedure</text><text x="162" y="309" text-anchor="middle" font-size="19" font-weight="700" fill="#163122">define this alternate path?</text><text x="162" y="340" text-anchor="middle" font-size="15" fill="#5a6b60">If yes, follow the approved exception</text><path d="M162 360 V410" stroke="#5a6b60" stroke-width="4" marker-end="url(#arrow)"/><rect x="45" y="415" width="235" height="92" rx="18" fill="#eef3f7" stroke="#47637a" stroke-width="2"/><text x="162" y="450" text-anchor="middle" font-size="19" font-weight="700" fill="#163122">Planned exception</text><text x="162" y="480" text-anchor="middle" font-size="15" fill="#5a6b60">Document the defined alternate action</text><path d="M280 305 H360 V455 H415" stroke="#5a6b60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="342" y="329" font-size="15" fill="#5a6b60">No defined exception</text><rect x="415" y="405" width="370" height="104" rx="18" fill="#fff" stroke="#d9d3c4" stroke-width="3"/><text x="600" y="440" text-anchor="middle" font-size="19" font-weight="700" fill="#163122">Was there an unplanned departure from instruction or expected condition?</text><text x="600" y="480" text-anchor="middle" font-size="15" fill="#5a6b60">Equipment fault, identity mismatch, missed step, alarm, interrupted sanitation, etc.</text><path d="M520 509 V565" stroke="#5a6b60" stroke-width="4" marker-end="url(#arrow)"/><path d="M680 509 V565" stroke="#5a6b60" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="546" font-size="15" fill="#5a6b60">YES</text><text x="690" y="546" font-size="15" fill="#5a6b60">NO / cannot verify</text><rect x="350" y="570" width="315" height="110" rx="18" fill="#fff4e8" stroke="#a45b18" stroke-width="2"/><text x="508" y="607" text-anchor="middle" font-size="21" font-weight="700" fill="#7a3d0c">Deviation</text><text x="508" y="637" text-anchor="middle" font-size="15" fill="#5a6b60">Preserve facts, immediate controls,</text><text x="508" y="660" text-anchor="middle" font-size="15" fill="#5a6b60">notification, and open disposition</text><rect x="700" y="570" width="315" height="110" rx="18" fill="#fff" stroke="#d9d3c4" stroke-width="3"/><text x="858" y="607" text-anchor="middle" font-size="21" font-weight="700" fill="#163122">Incomplete or unknown</text><text x="858" y="637" text-anchor="middle" font-size="15" fill="#5a6b60">Keep unfinished work open;</text><text x="858" y="660" text-anchor="middle" font-size="15" fill="#5a6b60">do not replace missing facts with guesses</text><rect x="155" y="715" width="890" height="72" rx="18" fill="#e8f1ea" stroke="#245f3d" stroke-width="2"/><text x="600" y="744" text-anchor="middle" font-size="19" font-weight="700" fill="#163122">Every non-routine closeout should preserve: exact identity • expected condition • actual condition • time/sequence</text><text x="600" y="772" text-anchor="middle" font-size="16" fill="#5a6b60">immediate control • missing/unknown facts • notification • open decision and owner</text></g></svg>